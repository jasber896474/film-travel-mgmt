                  <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
                    {[["config", t.vehicleConfig], ["daily", t.dailyDispatch]].map(([k, lb]) => (
                      <button key={k} type="button" onClick={() => setVehicleSub(k)} style={{ padding: "7px 18px", border: "none", cursor: "pointer", fontSize: 12, borderRadius: 20, fontFamily: "'Noto Sans JP',sans-serif", fontWeight: vehicleSub === k ? 700 : 400, color: vehicleSub === k ? "var(--shiro)" : "var(--sumi)", background: vehicleSub === k ? "var(--moegi)" : "var(--washi)" }}>{lb}</button>
                    ))}
                  </div>
                  {vehicleSub === "config" && (<>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <div style={{ width: 3, height: 18, background: "var(--moegi)", borderRadius: 2 }} />
                      <h2 style={{ fontSize: 13, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--sumi)", margin: 0 }}>{t.vehicleMgmt}</h2>
                    </div>
                    <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
                      {canEdit && vehicles.length > 1 && (
                        <label title={t.lockVehicleOrderHint} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--nezumi)", cursor: "pointer", whiteSpace: "nowrap" }}>
                          <input type="checkbox" checked={vehicleOrderLocked} onChange={toggleVehicleOrderLock} />
                          {t.lockVehicleOrder}
                        </label>
                      )}
                      <div style={{ display: "flex", gap: 6 }}>
                        <button type="button" onClick={() => openVehicleReportPrint(sortedVehicles, allAssignments, persons, project, lang, t)} style={{ ...pBtn(false), background: "var(--asagi)", border: "none", fontSize: 12 }}>{t.previewReport}</button>
                        {canEdit && <button type="button" onClick={() => setVehicleModal({ mode: "add" })} style={pBtn(false)}>{t.addVehicle}</button>}
                      </div>
                    </div>
                  </div>
                  {vehicles.length === 0 ? (
                    <div style={{ padding: "50px 40px", textAlign: "center", background: "var(--shiro)", border: "1px solid var(--keisenL)", borderRadius: 8, color: "var(--nezumi)", fontSize: 13 }}>{t.noVehicleHint}</div>
                  ) : (<>
                    {/* ── Vehicle card grid ── */}
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(320px,1fr))", gap: 14 }}>
                      {sortedVehicles.map((v, vi) => {
                        const assigns = getAssignmentsForVehicle(v.id);
                        const cap = v.capacity || 4;
                        const segGroups = {};
                        assigns.forEach((a) => {
                          const k = a.segment_label || "";
                          if (!segGroups[k]) segGroups[k] = [];
                          segGroups[k].push(a);
                        });
                        const onboard = Math.max(0, ...Object.values(segGroups).map((g) => vehicleOnboardCount(g)), 0);
                        const pct = cap ? Math.min(100, (onboard / cap) * 100) : 0;
                        const isFull = onboard >= cap;
                        const draggableCard = canEdit && vehicleOrderLocked;
                        return (
                          <div
                            key={v.id}
                            draggable={draggableCard}
                            onDragStart={() => { vehicleDragItem.current = vi; }}
                            onDragEnter={() => { vehicleDragOver.current = vi; }}
                            onDragEnd={handleVehicleDragEnd}
                            onDragOver={(e) => e.preventDefault()}
                            style={{ background: "var(--shiro)", borderRadius: 8, border: "1px solid var(--keisenL)", overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.05)", opacity: 1 }}
                          >
                            {/* Vehicle header */}
                            <div style={{ background: "var(--sumiMid)", color: "var(--washi)", padding: "14px 18px" }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                                <div style={{ display: "flex", alignItems: "flex-start", gap: 8, minWidth: 0 }}>
                                  {draggableCard && (
                                    <span style={{ cursor: "grab", color: "rgba(253,252,249,.45)", fontSize: 14, lineHeight: 1.4, marginTop: 1, userSelect: "none" }} title={t.lockVehicleOrder}>⠿</span>
                                  )}
                                  <div style={{ minWidth: 0 }}>
                                    <strong style={{ fontSize: 14, fontFamily: "'Noto Serif JP',serif" }}>{vehicleDisplayTitle(v, vi)}</strong>
                                    <div style={{ fontSize: 10.5, marginTop: 4, opacity: 0.65, letterSpacing: "0.04em" }}>{v.region} · {v.type} · {onboard}/{cap} {t.passengers_unit}</div>
                                  </div>
                                </div>
                                <div style={{ display: "flex", gap: 6, alignItems: "center", flexShrink: 0 }}>
                                  {vehicleOrderLocked && canEdit && (
                                    <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                                      <button type="button" disabled={vi === 0} onClick={() => moveVehicle(vi, -1)} style={{ ...eBtn, padding: "1px 5px", fontSize: 9, lineHeight: 1, color: "var(--washi)", borderColor: "rgba(253,252,249,.2)", background: "rgba(253,252,249,.08)", marginRight: 0, opacity: vi === 0 ? 0.3 : 1, cursor: vi === 0 ? "default" : "pointer" }}>▲</button>
                                      <button type="button" disabled={vi === sortedVehicles.length - 1} onClick={() => moveVehicle(vi, 1)} style={{ ...eBtn, padding: "1px 5px", fontSize: 9, lineHeight: 1, color: "var(--washi)", borderColor: "rgba(253,252,249,.2)", background: "rgba(253,252,249,.08)", marginRight: 0, opacity: vi === sortedVehicles.length - 1 ? 0.3 : 1, cursor: vi === sortedVehicles.length - 1 ? "default" : "pointer" }}>▼</button>
                                    </div>
                                  )}
                                  {canEdit && <button type="button" style={{ ...eBtn, color: "var(--washi)", borderColor: "rgba(253,252,249,.2)", background: "rgba(253,252,249,.08)", marginRight: 0 }} onClick={() => setVehicleModal({ mode: "edit", data: v })}>{t.edit}</button>}
                                  {canEdit && <button type="button" style={{ ...dBtn, color: "#ff9a9a", borderColor: "rgba(255,100,100,.3)", background: "rgba(255,80,80,.08)" }} onClick={async () => { if (window.confirm(t.deleteConfirm)) { await api.deleteWhere("vehicle_assignments", "vehicle_id", v.id).catch(() => {}); await api.delete("vehicles", v.id); setVehicles((x) => x.filter((y) => y.id !== v.id)); } }}>×</button>}
                                </div>
                              </div>
                              {/* Capacity bar */}
                              <div style={{ height: 3, background: "rgba(255,255,255,.15)", marginTop: 10, borderRadius: 2, overflow: "hidden" }}>
                                <div style={{ height: 3, width: pct + "%", background: isFull ? "#ff6b6b" : "var(--moegi2)", borderRadius: 2, transition: "width .4s" }} />
                              </div>
                            </div>
                            <VehicleCardDetails v={v} t={t} lang={lang} />
                            <div style={{ padding: "12px 14px" }}>
                              {assigns.length > 0 && (() => {
                                let seq = 0;
                                return (
                                  <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 2px", alignItems: "center", marginBottom: canEdit ? 10 : 0 }}>
                                    {assigns.map((a) => {
                                      const p = persons.find((x) => x.id === a.person_id);
                                      if (!p) return null;
                                      seq += 1;
                                      const numLbl = vehicleCircLabel(seq);
                                      const isDriver = a.role === "driver";
                                      return (
                                        <span key={a.id || `${a.person_id}-${a.role}`} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 12.5, color: "var(--sumi)", fontWeight: isDriver ? 700 : 500, padding: "3px 6px", background: isDriver ? "var(--moegi3)" : "transparent", borderRadius: 4 }}>
                                          <span style={{ fontSize: 11, color: isDriver ? "var(--moegi)" : "var(--nezumi)", minWidth: 14, display: "inline-flex" }}>{numLbl.css ? <CircBadge label={numLbl} isDriver={isDriver} /> : numLbl.text}</span>
                                          <span>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</span>
                                          {isDriver && <span style={{ fontSize: 9, color: "var(--moegi)", fontWeight: 700, marginLeft: 2 }}>{t.driver}</span>}
                                          {canEdit && <button type="button" onClick={() => removeAssignment(a)} style={{ marginLeft: 3, background: "none", border: "none", cursor: "pointer", color: "var(--usunezumi)", fontSize: 11, lineHeight: 1, padding: "0 2px" }}>×</button>}
                                        </span>
                                      );
                                    })}
                                  </div>
                                );
                              })()}
                              {canEdit && (
                                <div style={{ marginTop: 10, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                                  <select style={{ ...inpStyle, flex: "2 1 120px", minWidth: 0 }} value={addTripVehicle === v.id ? tripPerson : ""} onChange={(e) => { setAddTripVehicle(v.id); setTripPerson(e.target.value); }}>
                                    <option value="">{t.selectPassenger}</option>
                                    {persons.filter((p) => !p.hide_from_vehicles).map((p) => <option key={p.id} value={p.id}>{p.dept ? `[${p.dept}] ` : ""}{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</option>)}
                                  </select>
                                  <select style={{ ...inpStyle, flex: "1 1 80px", minWidth: 0 }} value={addTripVehicle === v.id ? tripRole : "passenger"} onChange={(e) => { setAddTripVehicle(v.id); setTripRole(e.target.value); }}>
                                    <option value="driver">{t.driver}</option>
                                    <option value="passenger">{t.passengers}</option>
                                  </select>
                                  <button type="button" style={{ ...pBtn(false), flex: "0 0 auto" }} onClick={() => {
                                    if (!tripPerson || addTripVehicle !== v.id) return;
                                    addAssignment(v.id, +tripPerson, tripRole, "");
                                    setAddTripVehicle(null); setTripPerson(""); setTripRole("passenger");
                                  }}>+</button>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>)}
                  </>)}
                  {vehicleSub === "daily" && (() => {
                    const todayDispatches = dailyDispatches.filter((d) => dispatchDateKey(d) === dispatchDate);
                    const dailyPersonKey = (vehicleId, personId) => `${vehicleId}:${personId}`;
                    const insertDailyRows = async (records, date) => {
                      const existing = dailyDispatches.filter((d) => dispatchDateKey(d) === date);
                      const existingKeys = new Set(existing.map((d) => dailyPersonKey(d.vehicle_id, d.person_id)));
                      const toInsert = records.filter((r) => !existingKeys.has(dailyPersonKey(r.vehicle_id, r.person_id)));
                      if (!toInsert.length) return 0;
                      const rows = await Promise.all(toInsert.map((r, i) => {
                        const sort = r.sort_order ?? existing.filter((d) => d.vehicle_id === r.vehicle_id).length + i;
                        return api.insert("daily_dispatches", { project_id: pid, dispatch_date: date, vehicle_id: r.vehicle_id, person_id: r.person_id, role: r.role || "passenger", sort_order: sort }).then(([row]) => row);
                      }));
                      setDailyDispatches((d) => [...d, ...rows]);
                      return rows.length;
                    };
                    const importFromConfig = async (silent) => {
                      const template = templateAssignmentsForDaily(allAssignments);
                      if (!template.length) {
                        if (!silent) showToast(t.dispatchNoConfigTemplate);
                        return 0;
                      }
                      const n = await insertDailyRows(template, dispatchDate);
                      if (!silent) {
                        if (n > 0) showToast(t.dispatchImportedFromConfig.replace("{n}", n));
                        else showToast(t.dispatchNothingToImport);
                      }
                      return n;
                    };
                    const addDispatch = async (vehicleId, personId, role) => {
                      try {
                        const [row] = await api.insert("daily_dispatches", { project_id: pid, dispatch_date: dispatchDate, vehicle_id: vehicleId, person_id: +personId, role, sort_order: todayDispatches.filter((d) => d.vehicle_id === vehicleId).length });
                        setDailyDispatches((d) => [...d, row]);
                      } catch (e) { showToast(e.message); }
                    };
                    const removeDispatch = async (rec) => {
                      try { await api.delete("daily_dispatches", rec.id); setDailyDispatches((d) => d.filter((x) => x.id !== rec.id)); }
                      catch (e) { showToast(e.message); }
                    };
                    const copyPrev = async () => {
                      const prevDate = (() => { const d = parseLocalDate(dispatchDate); d.setDate(d.getDate() - 1); return localDateStr(d); })();
                      const prevRecs = dailyDispatches.filter((d) => dispatchDateKey(d) === prevDate);
                      if (prevRecs.length) {
                        try {
                          const n = await insertDailyRows(prevRecs.map((r) => ({ vehicle_id: r.vehicle_id, person_id: r.person_id, role: r.role, sort_order: r.sort_order })), dispatchDate);
                          if (n > 0) showToast(t.dispatchCopied);
                          else showToast(t.dispatchNothingToImport);
                        } catch (e) { showToast(e.message); }
                        return;
                      }
                      const n = await importFromConfig(true);
                      if (n > 0) showToast(t.dispatchFallbackFromConfig.replace("{n}", n));
                      else if (!allAssignments.length) showToast(t.dispatchNoConfigTemplate);
                      else showToast(t.dispatchNoYesterday);
                    };
                    return (
                      <div>
                        <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center", flexWrap: "wrap" }}>
                          <input type="date" style={{ ...inpStyle, width: "auto" }} value={dispatchDate} onChange={(e) => setDispatchDate(e.target.value)} />
                          {canEdit && (
                            <>
                              <button type="button" onClick={copyPrev} style={{ ...pBtn(false), background: "var(--asagi)", border: "none", fontSize: 12 }}>📋 {t.copyPrevDay}</button>
                              <button type="button" onClick={() => importFromConfig(false)} style={{ ...pBtn(false), background: "var(--moegi)", border: "none", fontSize: 12, color: "var(--shiro)" }}>📥 {t.importFromConfig}</button>
                            </>
                          )}
                          <span style={{ fontSize: 11, color: "var(--nezumi)", marginLeft: "auto" }}>{todayDispatches.length} {t.totalAssigned}</span>
                        </div>
                        {vehicles.length === 0 ? (
                          <div style={{ padding: "50px 40px", textAlign: "center", background: "var(--shiro)", border: "1px solid var(--keisenL)", borderRadius: 8, color: "var(--nezumi)", fontSize: 13 }}>{t.noVehicleHint}</div>
                        ) : (
                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(320px,1fr))", gap: 14 }}>
                            {sortedVehicles.map((v, vi) => {
                              const dAssigns = todayDispatches.filter((d) => d.vehicle_id === v.id);
                              const cap = v.capacity || 4;
                              const isFull = dAssigns.length >= cap;
                              const pct = Math.min(100, Math.round((dAssigns.length / cap) * 100));
                              return (
                                <div key={v.id} style={{ background: "var(--shiro)", border: "1px solid var(--keisenL)", borderRadius: 8, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.05)" }}>
                                  <div style={{ background: "var(--sumiMid)", backgroundImage: "var(--theadGrad)", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <div>
                                      <strong style={{ fontSize: 14, fontFamily: "'Noto Serif JP',serif", color: "var(--washi)" }}>{vehicleDisplayTitle(v, vi)}</strong>
                                      <div style={{ fontSize: 10.5, marginTop: 4, opacity: 0.65, color: "var(--washi)", letterSpacing: "0.04em" }}>{v.region} · {v.type} · {dAssigns.length}/{cap} {t.passengers_unit}</div>
                                    </div>
                                  </div>
                                  <div style={{ height: 3, background: "rgba(0,0,0,.08)" }}><div style={{ height: 3, width: pct + "%", background: isFull ? "#ff6b6b" : "var(--moegi2)", transition: "width .4s" }} /></div>
                                  <div style={{ padding: "10px 14px" }}>
                                    {dAssigns.length > 0 && (
                                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 2px", marginBottom: canEdit ? 10 : 0 }}>
                                        {dAssigns.map((a, idx) => {
                                          const p = persons.find((x) => x.id === a.person_id);
                                          if (!p) return null;
                                          const isDriver = a.role === "driver";
                                          return (
                                            <span key={a.id} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 12.5, color: "var(--sumi)", fontWeight: isDriver ? 700 : 500, padding: "3px 6px", background: isDriver ? "var(--moegi3)" : "transparent", borderRadius: 4 }}>
                                              <span style={{ fontSize: 11, color: isDriver ? "var(--moegi)" : "var(--nezumi)", minWidth: 14, display: "inline-flex" }}>{(() => { const l = vehicleCircLabel(idx + 1); return l.css ? <CircBadge label={l} isDriver={isDriver} /> : l.text; })()}</span>
                                              <span>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</span>
                                              {isDriver && <span style={{ fontSize: 9, color: "var(--moegi)", fontWeight: 700, marginLeft: 2 }}>{t.driver}</span>}
                                              {canEdit && <button type="button" onClick={() => removeDispatch(a)} style={{ marginLeft: 3, background: "none", border: "none", cursor: "pointer", color: "var(--usunezumi)", fontSize: 11, lineHeight: 1, padding: "0 2px" }}>×</button>}
                                            </span>
                                          );
                                        })}
                                      </div>
                                    )}
                                    {dAssigns.length === 0 && <div style={{ fontSize: 11, color: "var(--usunezumi)", padding: "8px 0" }}>{t.noDispatchData}</div>}
                                    {canEdit && !isFull && (
                                      <DailyDispatchAddRow vehicleId={v.id} persons={persons} t={t} onAdd={addDispatch} />
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
                <aside style={{ flex: "0 1 280px", position: "sticky", top: 16 }}>
                  <div style={{ background: "var(--shiro)", border: "1px solid var(--keisenL)" }}>
                    <div style={{ background: personsWithNoTrips.length ? "var(--shu)" : "var(--moegi)", color: "var(--washi)", padding: "12px 16px", display: "flex", justifyContent: "space-between" }}>
                      <span>{t.unassigned}</span><span>{personsWithNoTrips.length}</span>
                    </div>
                    <div style={{ maxHeight: 400, overflowY: "auto" }}>
                      {personsWithNoTrips.map((p) => (
                        <div key={p.id} style={{ padding: "8px 16px", borderBottom: "1px solid var(--keisenL)", fontSize: 12 }}>
                          <div style={{ fontWeight: 600 }}>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</div>
                          <div style={{ fontSize: 10, color: "var(--nezumi)" }}>{p.dept}</div>
                        </div>
                      ))}
                    </div>
                    <p style={{ padding: 10, fontSize: 10, color: "var(--nezumi)" }}>{t.unassignedHint}</p>
                  </div>
                  <div style={{ marginTop: 12, background: "var(--washi)", padding: 12, fontSize: 11, color: "var(--nezumi)", lineHeight: 1.5 }}>
                    {t.personTrips}: {t.segmentMorning} / {t.segmentEvening} / {t.segmentTransfer}
                  </div>
                </aside>
              </div>
            </div>
          )}
        </div>
      )}

      {personModal && <Modal title={personModal.mode === "add" ? t.addStaff : t.editStaff} onClose={() => setPersonModal(null)}><PersonForm init={personModal.data} onSave={savePerson} onClose={() => setPersonModal(null)} t={t} lang={lang} /></Modal>}
      {flightModal && <Modal title={t.flightMgmt} wide onClose={() => setFlightModal(null)}><FlightForm init={flightModal.data} onSave={async (f) => { try { const ex = flights.find((x) => x.person_id === flightModal.pid); const data = buildFlightPayload(f, flightModal.pid, pid); if (ex) { const [r] = await api.update("flights", ex.id, data); setFlights((fl) => fl.map((x) => x.id === ex.id ? r : x)); } else { const [r] = await api.insert("flights", data); setFlights((fl) => [...fl, r]); } showToast(t.saved); setFlightModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setFlightModal(null)} t={t} lang={lang} flightRouteMemory={flightRouteMemory} /></Modal>}
      {showReportExport && <ReportExportModal onClose={() => setShowReportExport(false)} t={t} lang={lang} project={project} persons={persons} flights={flights} stays={stays} flatStays={flatStays} personsNoStay={personsMissingPhaseStay} hotels={hotels} pricingRules={pricingRules} vehicles={sortedVehicles} vehicleAssignments={vehicleAssignments} personIndex={personIndex} stayDisplayTotals={stayDisplayTotals} hotelCumulativeStats={hotelCumulativeStats} />}
      {stayModal && <Modal title={t.hotelMgmt} onClose={closeStayModal}><HotelStayForm init={stayModal.data} hotels={hotels} pricingRules={pricingRules} onSave={saveStay} onClose={closeStayModal} t={t} project={project} lang={lang} isSpecialRoom={stayModal.special || stayModal.pid === null} defaultPhaseId={stayModal.defaultPhaseId} allStays={stays} roommates={roommates} /></Modal>}
      {hotelModal && <Modal title={hotelModal.mode === "add" ? t.addHotel : t.hotelName} onClose={() => setHotelModal(null)}><HotelMasterForm init={hotelModal.data} shootPhases={shootPhases} onSave={async (f) => { try { if (hotelModal.mode === "add") { const [r] = await api.insert("hotels", { ...f, project_id: pid }); setHotels((h) => [...h, r]); } else { const [r] = await api.update("hotels", hotelModal.data.id, f); setHotels((h) => h.map((x) => x.id === hotelModal.data.id ? r : x)); } showToast(t.saved); setHotelModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setHotelModal(null)} t={t} /></Modal>}
      {priceModal && <Modal title={t.dateException} onClose={() => setPriceModal(null)}><PricingRuleForm init={priceModal.data} hotelId={priceModal.hotelId} hotelName={priceModal.hotelName} onSave={async (f) => { try { const data = { ...f, project_id: pid }; if (priceModal.mode === "add") { const [r] = await api.insert("pricing_rules", data); setPricingRules((rs) => [...rs, r]); } else { const [r] = await api.update("pricing_rules", priceModal.data.id, data); setPricingRules((rs) => rs.map((x) => x.id === priceModal.data.id ? r : x)); } showToast(t.saved); setPriceModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setPriceModal(null)} t={t} project={project} lang={lang} /></Modal>}
      {vehicleModal && <Modal title={vehicleModal.mode === "add" ? t.addVehicle : t.editVehicle} onClose={() => setVehicleModal(null)}><VehicleForm init={vehicleModal.data} onSave={saveVehicle} onClose={() => setVehicleModal(null)} t={t} lang={lang} /></Modal>}
      {roommateModal && <RoommateModal pid={roommateModal.pid} persons={persons} roommates={roommates} stays={flatStays} onSave={async (rpid, partnerIds) => { try { const group = [...new Set([rpid, ...partnerIds])]; for (const gid of group) await api.deleteWhere("roommates", "person_id", gid); if (partnerIds.length) for (const gid of group) { const partners = group.filter((x) => x !== gid); if (partners.length) await api.insert("roommates", partners.map((x) => ({ person_id: gid, partner_id: x, project_id: pid }))); } await loadAll(); showToast(t.saved); setRoommateModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setRoommateModal(null)} t={t} />}
      {showMembers && <MemberManager project={project} user={user} canManage={canManageMembers} onClose={() => setShowMembers(false)} t={t} />}
      {showCurrency && <CurrencySettingsModal project={project} onSave={saveCurrency} onClose={() => setShowCurrency(false)} t={t} />}
    </div>
  );
}

// ─── 全域 CSS ─────────────────────────────────────────────────
function GlobalStyles() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@300;400;600&display=swap');
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); font-family: 'Noto Sans JP', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: var(--sumi); }
      ::-webkit-scrollbar { width: 6px; height: 6px; }

      }

      }

      .unassigned-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }

      .unassigned-tag--clickable { cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; }

      .unassigned-tag--clickable:active { background: rgba(74,127,165,.1); }
      .unassigned-tag .tag-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }

      }
      .staff-table-wrap { overflow-x: auto; width: 100%; max-width: 100%; -webkit-overflow-scrolling: touch; }

      .staff-table .col-actions button { font-size: 10.5px; padding: 4px 7px; margin: 0; }
      .staff-table .roman-name-inline { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
    `}</style>
  );
}

function App() {
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [isSystemOwner, setIsSystemOwner] = useState(false);
  const [project, setProject] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [lang, setLang] = useState(() => localStorage.getItem("app_lang") || "zh-TW");
  const [theme, setTheme] = useState(() => (localStorage.getItem("app_theme") === "dark" ? "dark" : "light"));
  const [booting, setBooting] = useState(true);
  const [sessionExpired, setSessionExpired] = useState(false);
  const lastActivityRef = useRef(Date.now());

  useLayoutEffect(() => {
    applyThemeVars(theme);
    localStorage.setItem("app_theme", theme);
  }, [theme]);

  // ── 閒置偵測：監聽全域操作，重設最後活動時間；持續有操作時也順便延長 Supabase session ──
  useEffect(() => {
    if (!token) return;
    const markActive = () => { lastActivityRef.current = Date.now(); };
    const events = ["mousedown", "keydown", "touchstart", "wheel", "scroll"];
    events.forEach((ev) => document.addEventListener(ev, markActive, { passive: true }));

    const refreshTimer = setInterval(async () => {
      const idleFor = Date.now() - lastActivityRef.current;
      if (idleFor > IDLE_LIMIT_MS) return; // 已閒置過久，交給 IdleGuard 處理登出
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const sess = JSON.parse(raw);
        if (sess.expires_at && Date.now() > sess.expires_at - 120000 && sess.refresh_token) {
          const refreshed = await api.refresh(sess.refresh_token);
          if (refreshed.access_token) {
            saveSession(refreshed);
            _token = refreshed.access_token;
            setToken(refreshed.access_token);
          }
        }
      } catch { /* 忽略，交由一般 401 流程處理 */ }
    }, 5 * 60 * 1000);

    return () => {
      events.forEach((ev) => document.removeEventListener(ev, markActive));
      clearInterval(refreshTimer);
    };
  }, [token]);

  const handleIdleLogout = () => { api.logout(); clearSession(); window.location.reload(); };

  // ── Detect password reset link (type=recovery in URL hash) ──
  const recoveryToken = useMemo(() => {
    const hash = window.location.hash.slice(1);
    const params = new URLSearchParams(hash);
    if (params.get("type") === "recovery") return params.get("access_token") || null;
    return null;
  }, []);

  useEffect(() => {
    window.__onSessionExpired = () => setSessionExpired(true);
    return () => { window.__onSessionExpired = null; };
  }, []);

  const applyAuth = async (tk, u, loginLang) => {
    _token = tk;
    setToken(tk);
    setUser(u);
    const owner = await resolveIsSystemOwner(u.id);
    setIsSystemOwner(owner);
    try {
      const rows = await api.get("user_settings", `&user_id=eq.${u.id}`);
      setLang(rows[0]?.language || loginLang || localStorage.getItem("app_lang") || "zh-TW");
    } catch {
      setLang(loginLang || "zh-TW");
    }
  };

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const sess = JSON.parse(raw);
        if (sess.expires_at && Date.now() > sess.expires_at - 120000 && sess.refresh_token) {
          const refreshed = await api.refresh(sess.refresh_token);
          if (refreshed.access_token) {
            saveSession(refreshed);
            sess.access_token = refreshed.access_token;
          }
        }
        if (!sess.access_token) return;
        _token = sess.access_token;
        const u = await api.getUser();
        if (u?.id) await applyAuth(sess.access_token, u);
        else clearSession();
      } catch {
        clearSession();
      } finally {
        setBooting(false);
      }
    })();
  }, []);

  const handleLangChange = async (newLang) => {
    setLang(newLang);
    localStorage.setItem("app_lang", newLang);
    if (user) {
      try {
        await sb("user_settings", { method: "POST", prefer: "return=representation,resolution=merge-duplicates", body: JSON.stringify({ user_id: user.id, language: newLang }) });
      } catch (e) { console.error(e); }
    }
  };

  if (recoveryToken) return <><GlobalStyles /><ResetPasswordScreen recoveryToken={recoveryToken} lang={lang} /></>;

  if (booting) return (
    <>
      <GlobalStyles />
      <div style={{ minHeight: "100vh", background: "var(--sumiMid)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16 }}>
        <div style={{ fontSize: 36, fontFamily: "'Noto Serif JP',serif", color: "var(--moegi2)", animation: "fadeIn 1s ease both" }}>映</div>
        <div style={{ fontSize: 11, color: "var(--nezumi)", letterSpacing: "0.18em", textTransform: "uppercase" }}>{T[lang].loading}</div>
      </div>
    </>
  );
  if (sessionExpired) return (
    <>
      <GlobalStyles />
      <SessionExpiredModal t={T[lang]} onRelogin={() => { clearSession(); setSessionExpired(false); setToken(null); setUser(null); window.location.reload(); }} />
    </>
  );
  if (!token) return <><GlobalStyles /><LoginScreen onLogin={(tk, u, l) => applyAuth(tk, u, l)} /></>;
  const handleThemeChange = (m) => setTheme(m === "dark" ? "dark" : "light");
  const idleGuard = <IdleLogoutGuard lastActivityRef={lastActivityRef} onTimeout={handleIdleLogout} t={T[lang]} />;
  if (!project) return <><GlobalStyles />{idleGuard}<ProjectSelector user={user} isSystemOwner={isSystemOwner} lang={lang} theme={theme} onThemeChange={handleThemeChange} onLangChange={handleLangChange} onSelect={(proj, role) => { setProject(proj); setUserRole(isSystemOwner && !role ? "owner" : role); }} lastActivityRef={lastActivityRef} /></>;
  return <><GlobalStyles />{idleGuard}<ProjectApp project={project} userRole={userRole} user={user} isSystemOwner={isSystemOwner} lang={lang} theme={theme} onThemeChange={handleThemeChange} onLangChange={handleLangChange} onBack={() => { setProject(null); setUserRole(null); }} onProjectUpdate={setProject} lastActivityRef={lastActivityRef} /></>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
