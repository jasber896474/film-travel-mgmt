      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--keisenD); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--nezumi); }

      @keyframes modalIn { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .flight-table th, .flight-table td { text-align: center; }
      .flight-table-wrap { overflow-x: auto; border-radius: 10px; }

      .flight-table .col-person { text-align: left !important; }
      .flight-table .flight-no { color: var(--nezumi); font-size: 11.5px; }
      .flight-table .flight-dept { font-size: 11px; font-weight: 600; color: var(--nezumi); }
      .flight-table .flight-name { font-weight: 600; }
      .flight-table .flight-grp-out { background: rgba(43,90,76,.45) !important; color: #b4dfca !important; opacity: 1 !important; }
      .flight-table .flight-grp-ret { background: rgba(46,110,136,.42) !important; color: #a6d8ec !important; opacity: 1 !important; }
      .flight-table .flight-sub-hdr { background: rgba(0,0,0,.15) !important; }
      .flight-table .flight-muted { opacity: 0.82; font-size: 11.5px; color: var(--nezumi); }
      .flight-table .apt-code { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
      .flight-table .apt-term { font-size: 10.5px; color: var(--nezumi); margin-top: 1px; }
      .flight-table .flight-dt-date { font-size: 10.5px; color: var(--nezumi); }
      .flight-table .flight-dt-time { font-size: 13px; font-weight: 500; }
      .flight-table .pickup-wrap { background: var(--asagi2, rgba(58,120,140,.12)); border-radius: 6px; padding: 4px 8px; display: inline-block; min-width: 58px; line-height: 1.3; }
      .flight-table .pickup-date { font-size: 10px; color: var(--asagi); opacity: .8; }
      .flight-table .pickup-time { font-size: 15px; font-weight: 700; color: var(--asagi); letter-spacing: .01em; }

        .flight-table td { font-size: 9.5px !important; padding: 5px 3px !important; }
        .flight-table .flight-row-ret td { background: #f5f5f0 !important; }
        .flight-table .apt-code { font-size: 10px !important; }
        .flight-table .apt-term { font-size: 8px !important; }
        .flight-table .flight-dt-date, .flight-table .pickup-date { font-size: 8px !important; }

      }

      .td-amt { font-weight: 600; color: var(--asagi); font-variant-numeric: tabular-nums; text-align: right; }
      .tab-content { animation: fadeIn .22s ease both; }
      .data-table { table-layout: fixed; width: 100%; }
      .data-table .col-text { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .data-table .col-center { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; max-width: none; }
      .data-table .col-actions { text-align: center; white-space: nowrap; max-width: none; }
      .data-table .col-actions .tbl-actions { display: inline-flex; flex-wrap: nowrap; gap: 4px; justify-content: center; align-items: center; }
      .room-no-cell { text-align: center; max-width: none !important; overflow: visible; }
      .room-no-input { width: 100%; max-width: 72px; margin: 0 auto; display: block; text-align: center; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }

      .stay-table tr.stay-dept-banner td {

      .unassigned-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
      .unassigned-tag { display: inline-flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0; max-width: 100%; background: var(--shiro); border: 1px solid var(--keisenL); border-radius: 6px; padding: 6px 12px; font-size: 11.5; font-family: inherit; color: inherit; }
      .unassigned-tag--clickable { cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; }
      .unassigned-tag--clickable:hover { border-color: var(--asagi); background: rgba(74,127,165,.06); box-shadow: 0 1px 4px rgba(74,127,165,.12); }
      .unassigned-tag--clickable:active { background: rgba(74,127,165,.1); }
      .unassigned-tag .tag-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }

    `}</style>
  );
}

function App() {
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [isSystemOwner, setIsSystemOwner] = useState(false);
  const [project, setProject] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [lang, setLang] = useState(() => localStorage.getItem("app_lang") || "zh-TW");
  const [theme, setTheme] = useState(() => (localStorage.getItem("app_theme") === "dark" ? "dark" : "light"));
  const [booting, setBooting] = useState(true);
  const [sessionExpired, setSessionExpired] = useState(false);

  useLayoutEffect(() => {
    applyThemeVars(theme);
    localStorage.setItem("app_theme", theme);
  }, [theme]);

  // ── Detect password reset link (type=recovery in URL hash) ──
  const recoveryToken = useMemo(() => {
    const hash = window.location.hash.slice(1);
    const params = new URLSearchParams(hash);
    if (params.get("type") === "recovery") return params.get("access_token") || null;
    return null;
  }, []);

  useEffect(() => {
    window.__onSessionExpired = () => setSessionExpired(true);
    return () => { window.__onSessionExpired = null; };
  }, []);

  const applyAuth = async (tk, u, loginLang) => {
    _token = tk;
    setToken(tk);
    setUser(u);
    const owner = await resolveIsSystemOwner(u.id);
    setIsSystemOwner(owner);
    try {
      const rows = await api.get("user_settings", `&user_id=eq.${u.id}`);
      setLang(rows[0]?.language || loginLang || localStorage.getItem("app_lang") || "zh-TW");
    } catch {
      setLang(loginLang || "zh-TW");
    }
  };

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const sess = JSON.parse(raw);
        if (sess.expires_at && Date.now() > sess.expires_at - 120000 && sess.refresh_token) {
          const refreshed = await api.refresh(sess.refresh_token);
          if (refreshed.access_token) {
            saveSession(refreshed);
            sess.access_token = refreshed.access_token;
          }
        }
        if (!sess.access_token) return;
        _token = sess.access_token;
        const u = await api.getUser();
        if (u?.id) await applyAuth(sess.access_token, u);
        else clearSession();
      } catch {
        clearSession();
      } finally {
        setBooting(false);
      }
    })();
  }, []);

  const handleLangChange = async (newLang) => {
    setLang(newLang);
    localStorage.setItem("app_lang", newLang);
    if (user) {
      try {
        await sb("user_settings", { method: "POST", prefer: "return=representation,resolution=merge-duplicates", body: JSON.stringify({ user_id: user.id, language: newLang }) });
      } catch (e) { console.error(e); }
    }
  };

  if (recoveryToken) return <><GlobalStyles /><ResetPasswordScreen recoveryToken={recoveryToken} lang={lang} /></>;

  if (booting) return (
    <>
      <GlobalStyles />
      <div style={{ minHeight: "100vh", background: "var(--sumiMid)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16 }}>
        <div style={{ fontSize: 36, fontFamily: "'Noto Serif JP',serif", color: "var(--moegi2)", animation: "fadeIn 1s ease both" }}>映</div>
        <div style={{ fontSize: 11, color: "var(--nezumi)", letterSpacing: "0.18em", textTransform: "uppercase" }}>{T[lang].loading}</div>
      </div>
    </>
  );
  if (sessionExpired) return (
    <>
      <GlobalStyles />
      <SessionExpiredModal t={T[lang]} onRelogin={() => { clearSession(); setSessionExpired(false); setToken(null); setUser(null); window.location.reload(); }} />
    </>
  );
  if (!token) return <><GlobalStyles /><LoginScreen onLogin={(tk, u, l) => applyAuth(tk, u, l)} /></>;
  const handleThemeChange = (m) => setTheme(m === "dark" ? "dark" : "light");
  if (!project) return <><GlobalStyles /><ProjectSelector user={user} isSystemOwner={isSystemOwner} lang={lang} theme={theme} onThemeChange={handleThemeChange} onLangChange={handleLangChange} onSelect={(proj, role) => { setProject(proj); setUserRole(isSystemOwner && !role ? "owner" : role); }} /></>;
  return <><GlobalStyles /><ProjectApp project={project} userRole={userRole} user={user} isSystemOwner={isSystemOwner} lang={lang} theme={theme} onThemeChange={handleThemeChange} onLangChange={handleLangChange} onBack={() => { setProject(null); setUserRole(null); }} onProjectUpdate={setProject} /></>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
