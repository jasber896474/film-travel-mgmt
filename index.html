// ─── 請款對帳面板 ─────────────────────────────────────────────
/** 依連續相同房價切分請款列（對齊飯店帳單，避免均價產生小數） */
function buildInvoicePriceSegmentRows({ checkIn, totalNights, roomLabel, roomCount, subLabel, nightUnitPrice }) {
  const rows = [];
  let i = 0;
  while (i < totalNights) {
    const price = nightUnitPrice(i);
    if (price == null) { i += 1; continue; }
    let j = i + 1;
    while (j < totalNights && nightUnitPrice(j) === price) j += 1;
    const segNights = j - i;
    const startD = parseLocalDate(checkIn); startD.setDate(startD.getDate() + i);
    const endD = parseLocalDate(checkIn); endD.setDate(endD.getDate() + j);
    rows.push({
      check_in: localDateStr(startD),
      check_out: localDateStr(endD),
      roomLabel,
      subLabel,
      roomCount,
      nights: segNights,
      unitPrice: price,
      batchTotal: price * roomCount * segNights,
    });
    i = j;
  }
  return rows;
}

/**
 * 對齊飯店請款習慣：同飯店內，相同入住日+退房日+房型合併為一批
 * 公式：單價 × 間數 × 晚數（間數依房號或人數；每晚依 pricing_rules 計價）
 */
function buildInvoiceBatchesMerged(stays, pricingRules, hotels) {
  const hMap = Object.fromEntries(hotels.map((h) => [+h.id, h]));
  const byHotel = {};

  stays.forEach((s) => {
    if (!s.hotel_id || !s.check_in || !s.check_out) return;
    const hid = +s.hotel_id;
    if (!byHotel[hid]) byHotel[hid] = {};
    const bk = buildInvoiceBatchKey(s);
    if (!byHotel[hid][bk]) {
      byHotel[hid][bk] = {
        stays: [],
        check_in: s.check_in,
        check_out: s.check_out,
        roomLabel: s.room_type === "Custom" ? (s.room_custom || "Custom") : (s.room_type || "—"),
      };
    }
    byHotel[hid][bk].stays.push(s);
  });

  const result = [];
  Object.entries(byHotel).forEach(([hidStr, batchMap]) => {
    const hid = +hidStr;
    const hotel = hMap[hid];
    const batches = [];

    Object.values(batchMap).forEach(({ stays: batchStays, check_in, check_out, roomLabel }) => {
      const nights = diffDays(check_in, check_out);
      if (nights <= 0) return;

      const roomCount = countInvoiceRooms(batchStays);
      const rep = batchStays[0];

      buildInvoicePriceSegmentRows({
        checkIn: check_in,
        totalNights: nights,
        roomLabel,
        roomCount,
        subLabel: null,
        nightUnitPrice: (i) => {
          const d = parseLocalDate(check_in); d.setDate(d.getDate() + i);
          return stayNightPriceFromRules(rep, localDateStr(d), pricingRules, hMap);
        },
      }).forEach((row) => batches.push(row));
    });

    batches.sort((a, b) => a.check_in.localeCompare(b.check_in) || a.roomLabel.localeCompare(b.roomLabel));
    const hotelTotal = batches.reduce((s, b) => s + b.batchTotal, 0);
    result.push({ hotel, hid, batches, hotelTotal });
  });

  result.sort((a, b) => (a.hotel?.name || "").localeCompare(b.hotel?.name || ""));
  return result;
}

/** 逐間明細：依房號／每人／專用空間各算一行 */
function buildInvoiceBatchesPerRoom(stays, pricingRules, hotels) {
  const hMap = Object.fromEntries(hotels.map((h) => [+h.id, h]));
  const hotelUnitMap = {};
  stays.forEach((s) => {
    if (!s.hotel_id || !s.check_in || !s.check_out) return;
    const hid = +s.hotel_id;
    if (!hotelUnitMap[hid]) hotelUnitMap[hid] = {};
    const uk = buildInvoiceUnitKey(s);
    if (!hotelUnitMap[hid][uk]) hotelUnitMap[hid][uk] = { stays: [] };
    hotelUnitMap[hid][uk].stays.push(s);
  });

  const result = [];
  Object.entries(hotelUnitMap).forEach(([hidStr, unitMap]) => {
    const hid = +hidStr;
    const hotel = hMap[hid];
    const batches = [];

    Object.values(unitMap).forEach(({ stays: unitStays }) => {
      let minIn = null;
      let maxOut = null;
      unitStays.forEach((s) => {
        if (!minIn || s.check_in < minIn) minIn = s.check_in;
        if (!maxOut || s.check_out > maxOut) maxOut = s.check_out;
      });
      if (!minIn || !maxOut) return;
      const spanNights = diffDays(minIn, maxOut);
      if (spanNights <= 0) return;

      const rep = unitStays[0];
      const roomLabel = rep.room_type === "Custom" ? (rep.room_custom || "Custom") : (rep.room_type || "—");
      const rn = (rep.room_number || "").trim();
      const subLabel = rep.special_room_name ? rep.special_room_name : rn;
      const feeMap = Object.fromEntries(unitStays.map((s) => [s.id, calcStayTotalFromRules(s, pricingRules, hotels)]));

      buildInvoicePriceSegmentRows({
        checkIn: minIn,
        totalNights: spanNights,
        roomLabel,
        roomCount: 1,
        subLabel,
        nightUnitPrice: (i) => {
          const d = parseLocalDate(minIn); d.setDate(d.getDate() + i);
          const ds = localDateStr(d);
          const occupants = unitStays.filter((s) => stayActiveOnDate(s, ds));
          if (!occupants.length) return null;
          const payer = occupants.length === 1 ? occupants[0] : pickSharedRoomPayer(occupants, feeMap);
          return stayNightPriceFromRules(payer, ds, pricingRules, hMap);
        },
      }).forEach((row) => batches.push(row));
    });

    batches.sort((a, b) => a.check_in.localeCompare(b.check_in) || (a.subLabel || "").localeCompare(b.subLabel || ""));
    const hotelTotal = batches.reduce((s, b) => s + b.batchTotal, 0);
    result.push({ hotel, hid, batches, hotelTotal });
  });

  result.sort((a, b) => (a.hotel?.name || "").localeCompare(b.hotel?.name || ""));
  return result;
}

function ShootPhaseBar({ phases, active, onSelect, onAdd, onDelete, t, canEdit }) {
  const [name, setName] = useState("");
  const [pendingDelete, setPendingDelete] = useState(null);

  const phaseChipStyle = (selected) => ({
    padding: "8px 14px",
    border: "none",
    cursor: "pointer",
    fontSize: 12,
    fontWeight: selected ? 700 : 500,
    color: selected ? "var(--shiro)" : "var(--sumi)",
    background: selected ? "var(--moegi)" : "var(--washi)",
    minHeight: 36,
    lineHeight: 1.3,
    fontFamily: "inherit",
  });

  const phaseBoxStyle = (selected) => ({
    display: "inline-flex",
    alignItems: "stretch",
    borderRadius: 4,
    overflow: "hidden",
    border: `1px solid ${selected ? "var(--moegi)" : "var(--keisenM)"}`,
    boxShadow: selected ? "0 0 0 1px var(--moegi)" : "none",
  });

  if (!phases.length && !canEdit) return null;
  return (
    <div style={{ marginBottom: 14, padding: "12px 14px", background: "var(--shiro)", borderRadius: 4, border: "1px solid var(--keisenL)" }}>
      <div style={{ fontSize: 10, fontWeight: 700, color: "var(--nezumi)", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 8 }}>{t.manageShootPhases}</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <div style={phaseBoxStyle(!active)}>
          <button type="button" onClick={() => onSelect("")} style={phaseChipStyle(!active)}>{t.allPhases}</button>
        </div>
        {phases.map((p) => {
          const selected = active === p.id;
          return (
            <div key={p.id} style={phaseBoxStyle(selected)}>
              <button type="button" onClick={() => onSelect(p.id)} style={phaseChipStyle(selected)}>{p.name}</button>
              {canEdit && (
                <button
                  type="button"
                  aria-label={t.delete}
                  title={t.delete}
                  onClick={(e) => { e.stopPropagation(); setPendingDelete(p); }}
                  style={{
                    width: 32, minWidth: 32, border: "none", borderLeft: `1px solid ${selected ? "rgba(255,255,255,.25)" : "var(--keisenM)"}`,
                    cursor: "pointer", background: selected ? "rgba(0,0,0,.12)" : "var(--washi)",
                    color: selected ? "rgba(255,255,255,.85)" : "var(--usunezumi)", fontSize: 16, lineHeight: 1,
                    fontFamily: "inherit", padding: 0,
                  }}
                >×</button>
              )}
            </div>
          );
        })}
      </div>
      {canEdit && phases.length < 4 && (
        <div style={{ display: "flex", gap: 6, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input style={{ ...inpStyle, flex: "1 1 140px", minWidth: 0, borderRadius: 4 }} value={name} onChange={(e) => setName(e.target.value)} placeholder={t.shootPhaseNamePh} onKeyDown={(e) => { if (e.key === "Enter" && name.trim()) { onAdd(name.trim()); setName(""); } }} />
          <button type="button" style={{ ...pBtn(!name.trim()), borderRadius: 4 }} disabled={!name.trim()} onClick={() => { onAdd(name.trim()); setName(""); }}>+ {t.addShootPhase}</button>
          <span style={{ fontSize: 10, color: "var(--usunezumi)" }}>{t.maxPhasesHint}</span>
        </div>
      )}
      {pendingDelete && (
        <Modal title={t.deleteShootPhaseTitle} onClose={() => setPendingDelete(null)}>
          <p style={{ fontSize: 13, lineHeight: 1.65, color: "var(--sumi)", margin: "0 0 18px" }}>
            {t.deleteShootPhaseConfirm.replace("{name}", pendingDelete.name)}
          </p>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button type="button" onClick={() => setPendingDelete(null)} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer", borderRadius: 4 }}>{t.cancel}</button>
            <button type="button" onClick={() => { onDelete(pendingDelete.id); setPendingDelete(null); }} style={{ ...dBtn, borderRadius: 4, padding: "8px 16px" }}>{t.delete}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function HotelMasterForm({ init, onSave, onClose, t, shootPhases }) {
  const blank = { name: "", address: "", tel: "", shoot_phase_id: "", check_in_time: "15:00", check_out_time: "11:00" };
  const [f, setF] = useState(init ? { ...blank, ...init, shoot_phase_id: init.shoot_phase_id || "", check_in_time: init.check_in_time || "15:00", check_out_time: init.check_out_time || "11:00" } : blank);
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

  const initRates = init?.room_type_rates || {};
  const isInitUniform = "All" in initRates;
  const [uniformPrice, setUniformPrice] = useState(isInitUniform);
  const [uniformRate, setUniformRate] = useState(String(initRates["All"] ?? ""));
  const [typeRates, setTypeRates] = useState(
    Object.fromEntries(ROOM_TYPES_FOR_RATES.map((r) => [r, String(initRates[r] ?? "")]))
  );
  const [customTypes, setCustomTypes] = useState(() =>
    Object.entries(initRates)
      .filter(([k, v]) => k !== "All" && !ROOM_TYPES_FOR_RATES.includes(k) && v != null && v !== "")
      .map(([name, price]) => ({ name, price: String(price) }))
  );

  const buildRates = () => {
    if (uniformPrice) return uniformRate !== "" ? { All: +uniformRate } : {};
    const out = {};
    Object.entries(typeRates).forEach(([k, v]) => { if (v !== "") out[k] = +v; });
    customTypes.forEach(({ name, price }) => {
      const n = (name || "").trim();
      if (n && price !== "") out[n] = +price;
    });
    return out;
  };

  return (
    <div>
      <Field label={t.hotelName}><input style={inpStyle} value={f.name} onChange={set("name")} /></Field>
      <Field label={t.hotelAddr}><input style={inpStyle} value={f.address} onChange={set("address")} /></Field>
      <Field label={t.hotelTel}><input style={inpStyle} value={f.tel} onChange={set("tel")} /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 4 }}>
        <Field label={t.checkInTime}>
          <input type="time" style={inpStyle} value={f.check_in_time || "15:00"} onChange={set("check_in_time")} />
          <p style={{ fontSize: 10, color: "var(--nezumi)", marginTop: 4, margin: "4px 0 0" }}>{"未填預設 15:00"}</p>
        </Field>
        <Field label={t.checkOutTime}>
          <input type="time" style={inpStyle} value={f.check_out_time || "11:00"} onChange={set("check_out_time")} />
          <p style={{ fontSize: 10, color: "var(--nezumi)", marginTop: 4, margin: "4px 0 0" }}>{"未填預設 11:00"}</p>
        </Field>
      </div>
      {shootPhases?.length > 0 && (
        <Field label={t.assignShootPhase}>
          <select style={inpStyle} value={f.shoot_phase_id || ""} onChange={(e) => setF((p) => ({ ...p, shoot_phase_id: e.target.value }))}>
            <option value="">{t.shootPhaseUnset}</option>
            {shootPhases.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </Field>
      )}

      <div style={{ marginTop: 18, borderTop: "1px solid var(--keisenL)", paddingTop: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <div style={{ width: 3, height: 14, background: "var(--asagi)", borderRadius: 2 }} />
          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", color: "var(--sumi)" }}>{t.roomTypeRates}</span>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--nezumi)", cursor: "pointer", marginLeft: "auto" }}>
            <input type="checkbox" checked={uniformPrice} onChange={(e) => setUniformPrice(e.target.checked)} />
            {t.allSamePrice}
          </label>
        </div>
        {uniformPrice ? (
          <Field label={t.pricePerNight}>
            <input type="number" min="0" style={inpStyle} placeholder="0" value={uniformRate} onChange={(e) => setUniformRate(e.target.value)} />
          </Field>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {ROOM_TYPES_FOR_RATES.map((rt) => (
              <Field key={rt} label={rt}>
                <input type="number" min="0" style={inpStyle} placeholder="0"
                  value={typeRates[rt] || ""}
                  onChange={(e) => setTypeRates((p) => ({ ...p, [rt]: e.target.value }))} />
              </Field>
            ))}
          </div>
        )}
        {!uniformPrice && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: "var(--sumi)", letterSpacing: "0.04em" }}>{t.hotelCustomRoomTypes}</span>

// 配房輔助：判斷兩段住宿是否同飯店且日期重疊
function staysOverlap(a, b) {
  return a.hotel_id && b.hotel_id && String(a.hotel_id) === String(b.hotel_id) &&
    a.check_in < b.check_out && b.check_in < a.check_out;
}

function RoommateModal({ pid, persons, roommates, stays, onSave, onClose, t }) {
  const current = roommates.filter((r) => r.person_id === pid).map((r) => r.partner_id);
  const [selected, setSelected] = useState(current);
  const [showAll, setShowAll] = useState(false);
  const person = persons.find((p) => p.id === pid);
  const myStays = stays.filter((s) => s.person_id === pid);

  // Smart filter: only persons with overlapping hotel stays
  const sameHotelIds = useMemo(() => {
    if (!myStays.length) return new Set();
    return new Set(
      persons
        .filter((p) => p.id !== pid)
        .filter((p) => stays.filter((s) => s.person_id === p.id).some((s) => myStays.some((ms) => staysOverlap(ms, s))))
        .map((p) => p.id)
    );
  }, [pid, myStays, persons, stays]);

  const candidates = showAll
    ? persons.filter((p) => p.id !== pid)
    : persons.filter((p) => p.id !== pid && (sameHotelIds.has(p.id) || selected.includes(p.id)));

  const toggle = (id) => setSelected((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);

  return (
    <Modal title={`${t.roommateSet} — ${person?.name_kanji || ""}`} onClose={onClose}>
      {/* My stays context */}
      {myStays.length > 0 && (
        <div style={{ background: "var(--moegi3)", border: "1px solid rgba(43,90,76,.15)", borderRadius: 6, padding: "8px 12px", marginBottom: 12, fontSize: 11, color: "var(--moegi)", lineHeight: 1.6 }}>
          {myStays.map((s) => <div key={s.id}>{s.hotelName || s.hotel_id} · {s.check_in} – {s.check_out} ({s.roomLabel || s.room_type})</div>)}
        </div>
      )}
      {/* Filter toggle */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 10.5, color: "var(--usunezumi)" }}>
          {showAll ? `全部 ${persons.length - 1} 人` : `同飯店重疊日期 ${sameHotelIds.size} 人`}
        </span>
        <button type="button" onClick={() => setShowAll((v) => !v)}
          style={{ fontSize: 10.5, background: "none", border: "none", cursor: "pointer", color: "var(--moegi)", textDecoration: "underline", fontFamily: "'Noto Sans JP',sans-serif" }}>
          {showAll ? "只顯示同飯店" : "顯示全部"}
        </button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto" }}>
        {candidates.length === 0 && (
          <div style={{ padding: "20px", textAlign: "center", color: "var(--usunezumi)", fontSize: 12 }}>
            {showAll ? "無其他成員" : "無同飯店重疊住宿成員，請點「顯示全部」"}
          </div>
        )}
        {candidates.map((p) => {
          const pStays = stays.filter((s) => s.person_id === p.id && myStays.some((ms) => staysOverlap(ms, s)));
          const isSelected = selected.includes(p.id);
          return (
            <label key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", border: `1px solid ${isSelected ? "var(--moegi)" : "var(--keisenM)"}`, borderRadius: 6, cursor: "pointer", background: isSelected ? "var(--moegi3)" : "var(--shiro)", transition: "all .12s" }}>
              <input type="checkbox" checked={isSelected} onChange={() => toggle(p.id)} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name_kanji}
                  <span style={{ fontSize: 11, color: "var(--nezumi)", fontWeight: 400, marginLeft: 8 }}>{p.dept}</span>
                </div>
                {pStays.length > 0 && <div style={{ fontSize: 10, color: "var(--moegi)", marginTop: 1 }}>{pStays[0].hotelName || ""} {pStays[0].check_in}–{pStays[0].check_out}</div>}
              </div>
            </label>
          );
        })}
      </div>
      <div style={{ marginTop: 10, padding: "8px 12px", background: "var(--washi)", fontSize: 11.5, borderRadius: 4, color: "var(--sumi)" }}>
        {selected.length === 0 ? <span style={{ color: "var(--usunezumi)" }}>{t.roommateNone}</span>
          : selected.map((id) => persons.find((p) => p.id === id)?.name_kanji).filter(Boolean).join("、")}
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 14 }}>
        <button type="button" onClick={onClose} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer" }}>{t.cancel}</button>
        <button type="button" onClick={() => onSave(pid, selected)} style={pBtn(false)}>{t.save}</button>
      </div>
    </Modal>
  );
}

function MemberManager({ project, user, canManage, onClose, t }) {
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [userId, setUserId] = useState("");
  const [role, setRole] = useState("editor");
  const [saving, setSaving] = useState(false);
  const [toastMsg, showToast] = useToast();
  const load = async () => {
    setLoading(true);
    try { setMembers(await api.get("user_projects", `&project_id=eq.${project.id}`)); } catch (e) { showToast(e.message); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);
  const addMember = async () => {
    if (!userId.trim()) return;
    setSaving(true);
    try {
      if (members.find((m) => m.user_id === userId.trim())) { showToast(t.memberAlready); return; }
      await api.insert("user_projects", { user_id: userId.trim(), project_id: project.id, role });
      showToast(t.saved); setUserId(""); load();
    } catch (e) { showToast(e.message); } finally { setSaving(false); }
  };
  return (
    <Modal title={`${t.members} — ${project.name}`} onClose={onClose} wide>
      <Toast msg={toastMsg} />
      <div style={{ background: "var(--washi)", padding: 18, marginBottom: 20, border: "1px solid var(--keisenL)" }}>
        <div style={{ fontWeight: 600, fontSize: 11, marginBottom: 8 }}>{t.memberAdd}</div>
        <p style={{ fontSize: 12, color: "var(--nezumi)", marginBottom: 10 }}>{t.memberUidHint}</p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input style={{ ...inpStyle, flex: 2, minWidth: 200 }} value={userId} onChange={(e) => setUserId(e.target.value)} placeholder="UUID" />
          <select value={role} onChange={(e) => setRole(e.target.value)} style={inpStyle}>
            <option value="admin">{t.role_admin}</option>
            <option value="editor">{t.role_editor}</option>
            <option value="viewer">{t.role_viewer}</option>
          </select>
          <button type="button" onClick={addMember} disabled={saving || !userId.trim()} style={pBtn(saving || !userId.trim())}>{t.memberAddBtn}</button>
        </div>
      </div>
      <div style={{ fontWeight: 600, fontSize: 11, marginBottom: 12 }}>{t.memberCurrent.replace("{n}", members.length)}</div>
      {loading ? <div style={{ textAlign: "center", color: "var(--usunezumi)" }}>…</div> : members.map((m) => {
        const isMe = m.user_id === user.id;
        const canModify = canManage && !isMe && m.role !== "owner";
        return (
          <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: 12, border: "1px solid var(--keisenL)", marginBottom: 8 }}>
            <div>
              <span style={{ fontSize: 11, padding: "2px 8px", ...(ROLE_COLORS[m.role] || ROLE_COLORS.viewer) }}>{t[`role_${m.role}`] || m.role}</span>
              {isMe && <span style={{ fontSize: 9, marginLeft: 6, color: "var(--moegi)" }}>{t.me}</span>}
              <div style={{ fontSize: 11, color: "var(--usunezumi)", fontFamily: "monospace", marginTop: 4 }}>{m.user_id}</div>
            </div>
            {canModify && (
              <div style={{ display: "flex", gap: 8 }}>
                <select value={m.role} onChange={async (e) => { await api.update("user_projects", m.id, { role: e.target.value }); load(); }} style={{ ...inpStyle, width: "auto" }}>
                  <option value="admin">{t.role_admin}</option>
                  <option value="editor">{t.role_editor}</option>
                  <option value="viewer">{t.role_viewer}</option>
                </select>
                <button type="button" style={dBtn} onClick={async () => { if (window.confirm(t.deleteConfirm)) { await api.delete("user_projects", m.id); load(); } }}>{t.delete}</button>
              </div>
            )}
          </div>
        );
      })}
      <p style={{ fontSize: 11, color: "var(--kincha)", marginTop: 12 }}>{t.memberUidLabel}: {t.memberUidInfo}</p>
    </Modal>
  );
}

function ResetPasswordScreen({ recoveryToken, lang }) {
  const t = T[lang] || T["zh-TW"];
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const wrap = {
    minHeight: "100vh", background: "var(--sumiMid)",
    backgroundImage: "radial-gradient(ellipse 80% 60% at 20% 80%, rgba(43,90,76,.22) 0%, transparent 60%)",
    display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans JP',sans-serif",
  };
  const card = {
    background: "var(--shiro)", borderRadius: 12, padding: "44px 48px",
    width: 420, maxWidth: "95vw",
    boxShadow: "0 24px 80px rgba(0,0,0,.26), 0 0 0 1px rgba(255,255,255,.06)",
  };

  const handleReset = async () => {
    if (!pw || !pw2) { setError(t.errEmailPw); return; }
    if (pw !== pw2) { setError(t.errPwMatch); return; }
    if (pw.length < 6) { setError(t.errPwLen); return; }
    setLoading(true); setError("");
    try {
      const res = await api.updatePw(recoveryToken, pw);
      if (res.error) { setError(res.error.message || "Error"); return; }
      setDone(true);
    } catch (e) { setError(String(e.message)); } finally { setLoading(false); }
  };

  if (done) return (
    <div style={wrap}><div style={card}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 36, fontFamily: "'Noto Serif JP',serif", color: "var(--moegi)", marginBottom: 16 }}>映</div>
        <div style={{ fontSize: 32, marginBottom: 12, color: "var(--moegi)" }}>✓</div>
        <h3 style={{ fontSize: 16, fontWeight: 600, color: "var(--sumi)", marginBottom: 12, fontFamily: "'Noto Serif JP',serif" }}>{t.resetPwSuccess}</h3>
        <button type="button" onClick={() => { window.location.hash = ""; window.location.reload(); }} style={{ ...pBtn(false), width: "100%", padding: "11px 0", marginTop: 8 }}>{t.backToLogin}</button>
      </div>
    </div></div>
  );

  return (
    <div style={wrap}><div style={card}>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 36, lineHeight: 1, color: "var(--moegi)", marginBottom: 10, fontFamily: "'Noto Serif JP',serif" }}>映</div>
        <h1 style={{ fontSize: 16, fontWeight: 600, color: "var(--sumi)", margin: 0, letterSpacing: "0.08em", fontFamily: "'Noto Serif JP',serif" }}>{t.resetPwTitle}</h1>
      </div>
      {error && <div style={{ background: "rgba(173,48,48,.06)", color: "var(--shu)", padding: "10px 14px", marginBottom: 18, fontSize: 12, borderRadius: 6, border: "1px solid rgba(173,48,48,.15)" }}>{error}</div>}
      <Field label={t.newPw}><input style={inpStyle} type="password" value={pw} onChange={(e) => setPw(e.target.value)} className="wa-input" /></Field>
      <Field label={t.confirmNewPw}><input style={inpStyle} type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleReset()} className="wa-input" /></Field>
      <button type="button" onClick={handleReset} disabled={loading} style={{ ...pBtn(loading), width: "100%", padding: "11px 0", marginTop: 4 }}>
        {loading ? <span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> : t.resetPwBtn}
      </button>
    </div></div>
  );
}

    backgroundImage: [
      "radial-gradient(ellipse 80% 60% at 20% 80%, rgba(43,90,76,.22) 0%, transparent 60%)",
      "radial-gradient(ellipse 60% 40% at 80% 20%, rgba(42,94,128,.16) 0%, transparent 55%)",
    ].join(","),
    display: "flex", alignItems: "center", justifyContent: "center",
    fontFamily: "'Noto Sans JP',sans-serif",
  };

  const handleLogin = async () => {
    if (!email.trim() || !pw.trim()) { setError(t.errEmailPw); return; }
    setLoading(true); setError("");
    try {
      const res = await api.login(email.trim(), pw);
      if (res.access_token) {
        saveSession(res);
        _token = res.access_token;
        localStorage.setItem("app_lang", lang);
        onLogin(res.access_token, res.user, lang);
      } else setError(res.error_description || res.message || "Login failed");
    } catch (e) { setError(String(e.message)); } finally { setLoading(false); }
  };

  const handleRegister = async () => {
    if (!email.trim() || !pw.trim()) { setError(t.errEmailPw); return; }
    if (pw !== pw2) { setError(t.errPwMatch); return; }
    if (pw.length < 6) { setError(t.errPwLen); return; }
    setLoading(true); setError("");
    try {
      const res = await api.signup(email.trim(), pw);
      if (res.error || (res.code && res.code >= 400)) { setError(res.error?.message || res.msg || res.message || t.registerFailed); return; }
      const userId = res.id || res.user?.id || null;
      const hasSession = !!res.access_token;
      const reqBody = {
        email: email.trim(),
        display_name: displayName.trim() || null,
        message: message.trim() || null,
        status: "pending",
      };
      // 未登入 session（需信箱驗證）時 auth.uid() 為空，RLS 只允許 user_id 為 null
      if (hasSession && userId) reqBody.user_id = userId;
      const reqToken = res.access_token || SUPABASE_KEY;
      const reqRes = await fetch(`${SUPABASE_URL}/rest/v1/user_requests`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${reqToken}`, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(reqBody),
      });
      if (!reqRes.ok) throw new Error(parseApiError(await reqRes.text(), reqRes.status));
      setMode("verify");
    } catch (e) { setError(String(e.message) || t.registerFailed); } finally { setLoading(false); }
  };

  if (mode === "verify") return (
    <div style={wrap}><div style={card}>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 40, lineHeight: 1, color: "var(--moegi2)", marginBottom: 12, fontFamily: "'Noto Serif JP',serif" }}>映</div>
        <h2 style={{ fontSize: 18, color: "var(--sumi)", fontFamily: "'Noto Serif JP',serif", fontWeight: 600, marginBottom: 0 }}>{t.verifyTitle}</h2>
      </div>
      <div style={{ background: "var(--moegi3)", border: "1px solid rgba(43,90,76,.18)", borderRadius: 8, padding: "16px 18px", marginBottom: 18 }}>
        <p style={{ fontSize: 13, color: "var(--moegi)", marginBottom: 4, fontWeight: 600 }}>{email}</p>
        <p style={{ fontSize: 12, color: "var(--nezumi)", lineHeight: 1.7, margin: 0 }}>{t.verifyHint}</p>
      </div>
      <p style={{ fontSize: 11, color: "var(--nezumi)", marginBottom: 20, lineHeight: 1.6 }}>{t.verifyContact}</p>
      <button type="button" onClick={() => setMode("login")} style={{ ...pBtn(false), width: "100%" }}>{t.toLoginBtn}</button>
    </div></div>
  );

  return (
    <div style={wrap}><div style={card}>
      {/* ── Brand Mark ── */}
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 42, lineHeight: 1, color: "var(--moegi)", marginBottom: 10, fontFamily: "'Noto Serif JP',serif", letterSpacing: "-0.02em" }}>映</div>
        <h1 style={{ fontSize: 16, fontWeight: 600, color: "var(--sumi)", margin: 0, letterSpacing: "0.08em", fontFamily: "'Noto Serif JP',serif" }}>{t.appName}</h1>
        <p style={{ fontSize: 11, color: "var(--usunezumi)", margin: "5px 0 0", letterSpacing: "0.04em" }}>{mode === "login" ? t.loginTitle : t.registerTitle}</p>
      </div>

      {/* ── Lang lock selector (locked after login) ── */}
      <div style={{ marginBottom: 20 }}>
        <label style={{ display: "block", fontSize: 9.5, fontWeight: 700, color: "var(--nezumi)", marginBottom: 6, letterSpacing: "0.16em", textTransform: "uppercase" }}>{t.langSelectLabel || "Language / 語言 / 言語"}</label>
        <select style={{ ...inpStyle, fontSize: 12 }} value={lang} onChange={(e) => { setLang(e.target.value); localStorage.setItem("app_lang", e.target.value); }} className="wa-input">
          {Object.entries(LANGS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
        </select>
        <p style={{ fontSize: 9.5, color: "var(--usunezumi)", marginTop: 5, lineHeight: 1.5, margin: "5px 0 0" }}>{t.langLockHint || "登入後語系將固定，如需切換請重新登入"}</p>
      </div>

      {/* ── Tab pills ── */}
      <div style={{ display: "flex", background: "var(--washi)", borderRadius: 8, padding: 4, marginBottom: 24 }}>
        {[["login", t.loginBtn], ["register", t.registerTitle]].map(([m, lb]) => (
          <button key={m} type="button" onClick={() => { setMode(m); setError(""); }} style={{
            flex: 1, padding: "8px 0", border: "none", cursor: "pointer",
            fontFamily: "'Noto Sans JP',sans-serif", fontSize: 13,
            fontWeight: mode === m ? 600 : 400,
            color: mode === m ? "var(--sumi)" : "var(--nezumi)",
            background: mode === m ? "var(--shiro)" : "transparent",
            borderRadius: 6,
            boxShadow: mode === m ? "0 1px 4px rgba(0,0,0,.1)" : "none",
            transition: "all .18s",
          }}>{lb}</button>
        ))}
      </div>

      {error && <div style={{ background: "rgba(173,48,48,.06)", color: "var(--shu)", padding: "10px 14px", marginBottom: 18, fontSize: 12, borderRadius: 6, border: "1px solid rgba(173,48,48,.15)", lineHeight: 1.5 }}>{error}</div>}

      {mode === "login" ? (
        <>
          <Field label={t.loginEmail}><input style={inpStyle} type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} className="wa-input" /></Field>
          <Field label={t.loginPw}><input style={inpStyle} type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} className="wa-input" /></Field>
          <button type="button" onClick={handleLogin} disabled={loading} style={{ ...pBtn(loading), width: "100%", marginTop: 10, padding: "11px 0" }}>
            {loading ? <span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> : t.loginBtn}
          </button>
          <div style={{ textAlign: "center", marginTop: 14 }}>
            <button type="button" onClick={() => { setMode("forgot"); setError(""); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 11.5, color: "var(--nezumi)", textDecoration: "underline", fontFamily: "'Noto Sans JP',sans-serif" }}>{t.forgotPw}</button>
          </div>
          <p style={{ fontSize: 10.5, color: "var(--nezumi)", textAlign: "center", marginTop: 10, lineHeight: 1.6 }}>{t.loginHint}</p>
        </>
      ) : mode === "forgot" ? (
        <ForgotPasswordPanel t={t} lang={lang} onBack={() => { setMode("login"); setError(""); }} />
      ) : (
        <>
          <Field label={t.loginEmail}><input style={inpStyle} type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="wa-input" /></Field>
          <Field label={t.loginPw}><input style={inpStyle} type="password" value={pw} onChange={(e) => setPw(e.target.value)} className="wa-input" /></Field>
          <Field label={t.registerPwConfirm}><input style={inpStyle} type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} className="wa-input" /></Field>
          <Field label={t.registerName}><input style={inpStyle} value={displayName} onChange={(e) => setDisplayName(e.target.value)} className="wa-input" /></Field>
          <Field label={t.registerMessage}><textarea style={{ ...inpStyle, resize: "none", lineHeight: 1.6 }} rows={2} value={message} onChange={(e) => setMessage(e.target.value)} placeholder={t.registerMessagePh} className="wa-input" /></Field>
          <button type="button" onClick={handleRegister} disabled={loading} style={{ ...pBtn(loading), width: "100%", marginTop: 10, padding: "11px 0" }}>
            {loading ? <span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> : t.registerBtn}
          </button>
          <p style={{ fontSize: 11, color: "var(--usunezumi)", textAlign: "center", marginTop: 14, lineHeight: 1.6 }}>{t.verifyContact}</p>
        </>
      )}
    </div></div>
  );
}

function ProjectSelector({ user, isSystemOwner, lang, theme, onThemeChange, onLangChange, onSelect }) {
  const t = T[lang];
  const [projects, setProjects] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newDesc, setNewDesc] = useState("");
  const [saving, setSaving] = useState(false);
  const [requests, setRequests] = useState([]);
  const [approveModal, setApproveModal] = useState(null);
  const [toastMsg, showToast] = useToast();

  const load = async () => {
    setLoading(true);
    try {
      if (isSystemOwner) {
        const all = await api.get("projects");
        setProjects(all.map((p) => ({ id: p.id, project_id: p.id, role: "owner", projects: p })));
      } else {
        const up = await api.get("user_projects", `&user_id=eq.${user.id}`);
        if (!up.length) { setProjects([]); setLoading(false); return; }
        const ids = up.map((r) => r.project_id);
        const projs = await sb(`projects?id=in.(${ids.join(",")})`);
        setProjects(up.map((r) => ({ ...r, projects: projs.find((p) => p.id === r.project_id) || { id: r.project_id, name: "—" } })));
      }
    } catch (e) { showToast(e.message); } finally { setLoading(false); }
  };

  const loadRequests = async () => {
    if (!isSystemOwner) return;
    try {
      setRequests(await api.get("user_requests", "&status=eq.pending&order=created_at.desc"));
    } catch (e) {
      console.error(e);
      showToast(e.message || String(e));
    }
  };

  useEffect(() => { load(); if (isSystemOwner) loadRequests(); }, [isSystemOwner]);

  const createProject = async () => {
    if (!newName.trim()) return;
    setSaving(true);
    let createdProjId = null;
    try {
      const inserted = await api.insert("projects", {
        name: newName.trim(),
        description: newDesc || null,
        created_by: user.id,
        base_currency: "TWD",
        display_currency: "TWD",
        exchange_rate: 1,
      });
      const proj = Array.isArray(inserted) ? inserted[0] : inserted;
      if (!proj?.id) throw new Error("建立專案失敗：伺服器未回傳專案資料");
      createdProjId = proj.id;
      const creatorRole = isSystemOwner ? "owner" : "admin";
      try {
        await api.insert("user_projects", { user_id: user.id, project_id: proj.id, role: creatorRole });
      } catch (linkErr) {
        if (creatorRole === "owner") {
          await api.insert("user_projects", { user_id: user.id, project_id: proj.id, role: "admin" });
        } else throw linkErr;
      }
      showToast(t.saved);
      setShowNew(false);
      setNewName("");
      setNewDesc("");
      load();
    } catch (e) {
      if (createdProjId) {
        try { await api.delete("projects", createdProjId); } catch (_) { /* rollback best-effort */ }
      }
      showToast(e.message || String(e));
    } finally {
      setSaving(false);
    }
  };

  const deleteProject = async (projId) => {
    if (!window.confirm(t.deleteProjConfirm)) return;
    try {
      await Promise.all([
        "persons", "flights", "stays", "hotels", "pricing_rules", "roommates", "vehicles", "vehicle_assignments", "user_projects", "daily_dispatches",
      ].map((tbl) => api.deleteWhere(tbl, "project_id", projId).catch(() => {})));
      await api.delete("projects", projId);
      showToast(t.deleted); load();
    } catch (e) { showToast(e.message); }
  };

  const confirmApprove = async () => {
    const { req, projectId, role } = approveModal;
    if (!projectId) { showToast(t.selectProject); return; }
    try {
      await api.update("user_requests", req.id, { status: "approved" });
      let uid = req.user_id;
      if (!uid && req.email) {
        const found = await api.rpc("find_user_id_by_email", { p_email: req.email.trim() });
        uid = typeof found === "string" ? found : (Array.isArray(found) ? found[0] : found?.id || null);
      }
      if (uid) {
        const existing = await api.get("user_projects", `&user_id=eq.${uid}&project_id=eq.${projectId}`);
        if (!existing.length) await api.insert("user_projects", { user_id: uid, project_id: projectId, role });
        else await api.update("user_projects", existing[0].id, { role });
      }
      showToast(t.approved.replace("{email}", req.email));
      setApproveModal(null); loadRequests();
    } catch (e) { showToast(e.message); }
  };

  const hdrBtn = { background: "var(--hdrBtnBg)", color: "var(--hdrText)", border: "1px solid var(--hdrBtnBorder)", padding: "7px 14px", cursor: "pointer", fontSize: 11.5, borderRadius: 4, fontFamily: "'Noto Sans JP',sans-serif", transition: "background .15s" };
  const tSel = T[lang];
  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)", fontFamily: "'Noto Sans JP',sans-serif" }}>
      <Toast msg={toastMsg} />
      {/* ── Header ── */}
      <header style={{
        background: "var(--sumiMid)",
        backgroundImage: "var(--headerGrad)",
        padding: "16px 32px", color: "var(--washi)",
        display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8,
        borderBottom: "1px solid rgba(255,255,255,.04)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ fontSize: 28, fontFamily: "'Noto Serif JP',serif", color: "var(--moegi2)", lineHeight: 1 }}>映</span>
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: "0.06em" }}>{t.appName}</div>
            <div style={{ fontSize: 10, opacity: 0.5, marginTop: 2, letterSpacing: "0.04em" }}>
              {user.email}
              {isSystemOwner && <span style={{ marginLeft: 8, padding: "1px 8px", background: "var(--moegi3)", color: "var(--moegi2)", borderRadius: 10, fontSize: 9, fontWeight: 700, letterSpacing: "0.12em" }}>{t.role_owner}</span>}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <ThemeToggle theme={theme} onChange={onThemeChange} t={tSel} />
          <button type="button" onClick={() => { api.logout(); clearSession(); window.location.reload(); }} style={hdrBtn}>{t.logout}</button>
        </div>
      </header>

      {/* ── Approval requests ── */}
      {isSystemOwner && (
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "28px 24px 0" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <div style={{ width: 3, height: 16, background: "var(--shu)", borderRadius: 2 }} />
            <h2 style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--sumi)", margin: 0 }}>{t.approveTitle}</h2>
            {requests.length > 0 && <span style={{ background: "var(--shu)", color: "var(--shiro)", padding: "2px 8px", fontSize: 10, borderRadius: 10, fontWeight: 700 }}>{requests.length}</span>}
          </div>
          {requests.length === 0 ? (
            <p style={{ color: "var(--usunezumi)", fontSize: 12, marginBottom: 16 }}>{t.noRequests}</p>
          ) : requests.map((req) => (
            <div key={req.id} style={{ background: "var(--shiro)", padding: "16px 20px", marginBottom: 10, borderRadius: 8, border: "1px solid var(--keisenL)", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 10, boxShadow: "0 1px 4px rgba(0,0,0,.04)" }}>
              <div>
                <strong style={{ fontSize: 13, color: "var(--sumi)" }}>{req.display_name || t.noName}</strong>
                <span style={{ color: "var(--nezumi)", fontSize: 12, marginLeft: 8 }}>{req.email}</span>
                {req.message && <div style={{ fontSize: 12, color: "var(--nezumi)", marginTop: 5, lineHeight: 1.5 }}>{req.message}</div>}
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
                <button type="button" onClick={async () => { const all = await api.get("projects"); setApproveModal({ req, projects: all, projectId: all[0]?.id || "", role: "viewer" }); }} style={pBtn(false)}>{t.approve}</button>
                <button type="button" onClick={async () => { if (window.confirm(t.rejectConfirm.replace("{email}", req.email))) { await api.update("user_requests", req.id, { status: "rejected" }); showToast(t.rejected.replace("{email}", req.email)); loadRequests(); } }} style={dBtn}>{t.reject}</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ── Project list ── */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "36px 24px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 28 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 3, height: 20, background: "var(--moegi)", borderRadius: 2 }} />
            <h2 style={{ fontSize: 20, fontWeight: 300, color: "var(--sumi)", fontFamily: "'Noto Serif JP',serif", letterSpacing: "0.04em", margin: 0 }}>{t.projects}</h2>
          </div>
          <button type="button" onClick={() => setShowNew(true)} style={pBtn(false)}>{t.newProject}</button>
        </div>

        {loading ? (
          <p style={{ textAlign: "center", color: "var(--usunezumi)", padding: 60 }}>{t.loading}</p>
        ) : projects.length === 0 ? (
          <div style={{ textAlign: "center", padding: "70px 40px", background: "var(--shiro)", borderRadius: 10, border: "1px solid var(--keisenL)" }}>
            <div style={{ fontSize: 32, fontFamily: "'Noto Serif JP',serif", color: "var(--usunezumi)", marginBottom: 16 }}>映</div>
            <p style={{ marginBottom: 6, fontSize: 14, color: "var(--sumi)" }}>{t.noProject}</p>
            <p style={{ fontSize: 12, color: "var(--nezumi)", marginBottom: 28, lineHeight: 1.6 }}>{t.noProjectHint}</p>
            <button type="button" onClick={() => setShowNew(true)} style={pBtn(false)}>{t.firstProject}</button>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 18 }}>
            {projects.map((up) => (
              <div key={up.id} style={{
                background: "var(--shiro)", borderRadius: 10, overflow: "hidden",
                boxShadow: "0 1px 3px rgba(0,0,0,.05), 0 4px 20px rgba(0,0,0,.05), 0 0 0 1px " + "var(--keisenL)",
                transition: "box-shadow .2s, transform .15s",
              }} className="proj-card">
                {/* Color band based on role */}
                <div style={{ height: 4, background: up.role === "owner" ? "var(--kincha)" : up.role === "admin" ? "var(--shu)" : up.role === "editor" ? "var(--moegi)" : "var(--usunezumi)" }} />
                <div style={{ padding: "20px 22px" }}>
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontWeight: 600, fontSize: 16, color: "var(--sumi)", letterSpacing: "0.02em", marginBottom: 5, fontFamily: "'Noto Serif JP',serif" }}>{up.projects?.name || "—"}</div>
                    {up.projects?.description && <div style={{ fontSize: 12, color: "var(--nezumi)", lineHeight: 1.5 }}>{up.projects.description}</div>}
                  </div>
                  <span style={{ fontSize: 10, padding: "3px 10px", borderRadius: 20, fontWeight: 700, letterSpacing: "0.08em", ...(ROLE_COLORS[up.role] || ROLE_COLORS.viewer) }}>{t[`role_${up.role}`] || up.role}</span>
                </div>
                <div style={{ padding: "12px 22px 20px", display: "flex", gap: 8 }}>
                  <button type="button" onClick={() => onSelect(up.projects, up.role)} style={{ ...pBtn(false), flex: 1, padding: "9px 0", fontSize: 12.5 }}>{t.openProject}</button>
                  {(isSystemOwner || up.role === "admin" || up.role === "owner") && (
                    <button type="button" onClick={() => deleteProject(up.projects?.id || up.project_id)} style={{ ...dBtn, padding: "9px 14px" }}>×</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {approveModal && (
        <Modal title={t.approveTitle} onClose={() => setApproveModal(null)}>
          <Field label={t.approveProject}>
            <select style={inpStyle} value={approveModal.projectId} onChange={(e) => setApproveModal((m) => ({ ...m, projectId: e.target.value }))} className="wa-input">
              {approveModal.projects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label={t.approveRole}>
            <select style={inpStyle} value={approveModal.role} onChange={(e) => setApproveModal((m) => ({ ...m, role: e.target.value }))} className="wa-input">
              <option value="viewer">{t.roleViewerDesc}</option>
              <option value="editor">{t.roleEditorDesc}</option>
              <option value="admin">{t.roleAdminDesc}</option>
            </select>
          </Field>
          <p style={{ fontSize: 11.5, color: "var(--nezumi)", marginBottom: 18, lineHeight: 1.6 }}>{t.approveNote}</p>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button type="button" onClick={() => setApproveModal(null)} style={{ ...eBtn, marginRight: 0, padding: "9px 18px" }}>{t.cancel}</button>
            <button type="button" onClick={confirmApprove} style={pBtn(false)}>{t.confirmApproveBtn}</button>
          </div>
        </Modal>
      )}

      {showNew && (
        <Modal title={t.newProject} onClose={() => setShowNew(false)}>
          <Field label={t.projectName}><input style={inpStyle} value={newName} onChange={(e) => setNewName(e.target.value)} className="wa-input" /></Field>
          <Field label={t.projectDesc}><input style={inpStyle} value={newDesc} onChange={(e) => setNewDesc(e.target.value)} className="wa-input" /></Field>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 8 }}>
            <button type="button" onClick={() => setShowNew(false)} style={{ ...eBtn, marginRight: 0, padding: "9px 18px" }}>{t.cancel}</button>
            <button type="button" onClick={createProject} disabled={saving || !newName.trim()} style={pBtn(saving || !newName.trim())}>{saving ? t.creating : t.create}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ProjectApp({ project, userRole, user, isSystemOwner, lang, theme, onThemeChange, onLangChange, onBack, onProjectUpdate }) {
  const pid = project.id;
  const t = T[lang];
  const canEdit = isSystemOwner || ["owner", "admin", "editor"].includes(userRole);
  const canDelete = isSystemOwner || ["owner", "admin"].includes(userRole);
  const canManageMembers = isSystemOwner || ["owner", "admin"].includes(userRole);

  const allDepts = useMemo(() => [...new Set(persons.map((p) => p.dept).filter(Boolean))], [persons]);
  // 員工編號：純依列表順序（拖移後即更新）
  const personIndex = useMemo(() => Object.fromEntries(persons.map((x, i) => [x.id, i + 1])), [persons]);
  const hotelStatsMap = useMemo(() => computeHotelStats(stays, roommates), [stays, roommates]);

    const sorted = [...deptOrder].sort((a, b) => {

      const kw = debSearchC.toLowerCase();
      const hname = getHotelName(s.hotel_id);
      const rt = s.room_type === "Custom" ? s.room_custom : s.room_type;
      const dispName = s.special_room_name || p?.name_kanji || "";
      const nameOk = !kw || [dispName, p?.last_roman, p?.dept].some((v) => (v || "").toLowerCase().includes(kw));

      const roomOk = !searchCRoom || (rt || "").toLowerCase().includes(searchCRoom.toLowerCase());
      const deptOk = !deptC || (p?.dept === deptC);
      const phaseOk = !activeStayPhase || hotelPhaseMap[+s.hotel_id] === activeStayPhase;

      }
    });
    // Sort: dept → hotel → check_in → check_out
    rows.sort((a, b) => {
      const deptA = (a.person?.dept || "").toLowerCase();
      const deptB = (b.person?.dept || "").toLowerCase();
      if (deptA !== deptB) return deptA.localeCompare(deptB, undefined, { sensitivity: "base" });
      if (a.hotel_id !== b.hotel_id) return (a.hotel_id || 0) - (b.hotel_id || 0);
      const ciA = a.check_in || "";
      const ciB = b.check_in || "";
      if (ciA !== ciB) return ciA.localeCompare(ciB);
      const coA = a.check_out || "";
      const coB = b.check_out || "";
      if (coA !== coB) return coA.localeCompare(coB);
      return (personIndex[a.person_id] || 0) - (personIndex[b.person_id] || 0);

    return rows;

    if (!v) return;
    const current = getAssignmentsForVehicle(vehicleId);
    const seg = segmentLabel || "";
    const segGroup = current.filter((a) => (a.segment_label || "") === seg);
    if (current.some((a) => a.person_id === personId && a.role === role && (a.segment_label || "") === seg)) return;
    const cap = v.capacity || 4;
    if (vehicleOnboardCount(segGroup) >= cap) { showToast(t.vehicleFull); return; }
    if (role === "driver" && segGroup.some((a) => a.role === "driver")) { showToast(t.vehicleFull); return; }
    try {
      if (useAssignmentTable) {
        const [row] = await api.insert("vehicle_assignments", { project_id: pid, vehicle_id: vehicleId, person_id: personId, role, segment_label: segmentLabel, sort_order: current.length });
        setVehicleAssignments((va) => [...va, row]);
      } else {
        const next = [...current.map(({ person_id, role: r, segment_label }) => ({ person_id, role: r, segment_label: segment_label || "" })), { person_id: personId, role, segment_label: segmentLabel }];
        const driver = next.find((a) => a.role === "driver");
        const pids = next.filter((a) => a.role === "passenger").map((a) => a.person_id);
        await api.update("vehicles", vehicleId, { assignments: next, driver_id: driver?.person_id || null, passenger_ids: pids.length ? pids : null });
        setVehicles((vs) => vs.map((x) => x.id === vehicleId ? { ...x, assignments: next, driver_id: driver?.person_id || null, passenger_ids: pids } : x));
      }
    } catch (e) { showToast(e.message); }

    try {
      if (useAssignmentTable && assignment.id && !String(assignment.id).startsWith("legacy")) {
        await api.delete("vehicle_assignments", assignment.id);
        setVehicleAssignments((va) => va.filter((a) => a.id !== assignment.id));
      } else {
        const vid = assignment.vehicle_id;
        const current = getAssignmentsForVehicle(vid).filter((a) => !(a.person_id === assignment.person_id && a.role === assignment.role && (a.segment_label || "") === (assignment.segment_label || "")));
        const next = current.map(({ person_id, role, segment_label }) => ({ person_id, role, segment_label: segment_label || "" }));
        const driver = next.find((a) => a.role === "driver");

      const [r] = await api.insert("stays", payload);
      return r;

    try {

        saved = await doSave(data);

        if (e1.message && (e1.message.includes("location_tag") || e1.message.includes("hide_from"))) {
          const fallback = { ...data };
          delete fallback.location_tag;
          saved = await doSave(fallback);
        } else throw e1;
      }
      let nextStays = stayModal.stayId
        ? stays.map((x) => x.id === stayModal.stayId ? saved : x)

      const csvFormat = staffCsvFormat(rows[0], t);
      if (!csvFormat) { showToast(t.importFormatError); return; }
      const bodyRows = rows.slice(1);
      const importRows = bodyRows.map((row) => ({ row, payload: rowToStaffPerson(row, csvFormat) })).filter((x) => x.payload);
      if (!importRows.length) { showToast(t.importEmpty); return; }
      if (!window.confirm(t.importConfirm.replace("{n}", importRows.length))) return;

      const sorted = [...persons].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
      let ok = 0;
      let fail = 0;
      let nextOrder = sorted.length;

      for (const { row, payload } of importRows) {
        const rawNo = parseInt(String(row[0] ?? "").trim(), 10);
        let existing = !Number.isNaN(rawNo) && rawNo >= 1 ? sorted[rawNo - 1] : null;
        if (!existing && payload.name_kanji) {
          existing = persons.find((p) => (p.name_kanji || "") === payload.name_kanji && (p.dept || "") === payload.dept);
        }
        try {
          if (existing) {
            const [r] = await api.update("persons", existing.id, payload);
            setPersons((prev) => prev.map((x) => x.id === existing.id ? r : x));
            const si = sorted.findIndex((p) => p.id === existing.id);
            if (si >= 0) sorted[si] = { ...sorted[si], ...r };
          } else {
            const [r] = await api.insert("persons", { ...payload, project_id: pid, sort_order: nextOrder++ });
            setPersons((prev) => [...prev, r]);
            sorted.push(r);
          }
          ok++;

          console.error(e);
          fail++;
        }

      const failMsg = fail > 0 ? (t.importFailSuffix || "").replace("{fail}", fail) : "";

                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button type="button" onClick={() => openVehicleReportPrint(vehicles, allAssignments, persons, project, lang, t)} style={{ ...pBtn(false), background: "var(--asagi)", border: "none", fontSize: 12 }}>{t.previewReport}</button>
                      {canEdit && <button type="button" onClick={() => setVehicleModal({ mode: "add" })} style={pBtn(false)}>{t.addVehicle}</button>}
                    </div>
                  </div>
                  {vehicles.length === 0 ? (
                    <div style={{ padding: "50px 40px", textAlign: "center", background: "var(--shiro)", border: "1px solid var(--keisenL)", borderRadius: 8, color: "var(--nezumi)", fontSize: 13 }}>{t.noVehicleHint}</div>
                  ) : (<>
                    {/* ── Vehicle card grid ── */}
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(320px,1fr))", gap: 14 }}>
                      {vehicles.map((v, vi) => {
                        const assigns = getAssignmentsForVehicle(v.id);
                        const cap = v.capacity || 4;
                        const segGroups = {};
                        assigns.forEach((a) => {
                          const k = a.segment_label || "";
                          if (!segGroups[k]) segGroups[k] = [];
                          segGroups[k].push(a);
                        });
                        const onboard = Math.max(0, ...Object.values(segGroups).map((g) => vehicleOnboardCount(g)), 0);
                        const pct = cap ? Math.min(100, (onboard / cap) * 100) : 0;
                        const isFull = onboard >= cap;
                        return (
                          <div key={v.id} style={{ background: "var(--shiro)", borderRadius: 8, border: "1px solid var(--keisenL)", overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.05)" }}>
                            {/* Vehicle header */}
                            <div style={{ background: "var(--sumiMid)", color: "var(--washi)", padding: "14px 18px" }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                                <div>
                                  <strong style={{ fontSize: 14, fontFamily: "'Noto Serif JP',serif" }}>{vehicleDisplayTitle(v, vi)}</strong>
                                  <div style={{ fontSize: 10.5, marginTop: 4, opacity: 0.65, letterSpacing: "0.04em" }}>{v.region} · {v.type} · {onboard}/{cap} {t.passengers_unit}</div>
                                </div>
                                <div style={{ display: "flex", gap: 6 }}>
                                  {canEdit && <button type="button" style={{ ...eBtn, color: "var(--washi)", borderColor: "rgba(253,252,249,.2)", background: "rgba(253,252,249,.08)", marginRight: 0 }} onClick={() => setVehicleModal({ mode: "edit", data: v })}>{t.edit}</button>}
                                  {canDelete && <button type="button" style={{ ...dBtn, color: "#ff9a9a", borderColor: "rgba(255,100,100,.3)", background: "rgba(255,80,80,.08)" }} onClick={async () => { if (window.confirm(t.deleteConfirm)) { await api.deleteWhere("vehicle_assignments", "vehicle_id", v.id).catch(() => {}); await api.delete("vehicles", v.id); setVehicles((x) => x.filter((y) => y.id !== v.id)); } }}>×</button>}
                                </div>
                              </div>
                              {/* Capacity bar */}
                              <div style={{ height: 3, background: "rgba(255,255,255,.15)", marginTop: 10, borderRadius: 2, overflow: "hidden" }}>
                                <div style={{ height: 3, width: pct + "%", background: isFull ? "#ff6b6b" : "var(--moegi2)", borderRadius: 2, transition: "width .4s" }} />
                              </div>
                            </div>
                            <VehicleCardDetails v={v} t={t} lang={lang} />
                            <div style={{ padding: "12px 14px" }}>
                              {assigns.length > 0 && (() => {
                                const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
                                let seq = 0;
                                return (
                                  <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 2px", alignItems: "center", marginBottom: canEdit ? 10 : 0 }}>
                                    {assigns.map((a) => {
                                      const p = persons.find((x) => x.id === a.person_id);
                                      if (!p) return null;
                                      seq += 1;
                                      const num = CIRC[seq - 1] || seq;
                                      const isDriver = a.role === "driver";
                                      return (
                                        <span key={a.id || `${a.person_id}-${a.role}`} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 12.5, color: "var(--sumi)", fontWeight: isDriver ? 700 : 500, padding: "3px 6px", background: isDriver ? "var(--moegi3)" : "transparent", borderRadius: 4 }}>
                                          <span style={{ fontSize: 11, color: isDriver ? "var(--moegi)" : "var(--nezumi)", minWidth: 14 }}>{num}</span>
                                          <span>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</span>
                                          {isDriver && <span style={{ fontSize: 9, color: "var(--moegi)", fontWeight: 700, marginLeft: 2 }}>{t.driver}</span>}
                                          {canEdit && <button type="button" onClick={() => removeAssignment(a)} style={{ marginLeft: 3, background: "none", border: "none", cursor: "pointer", color: "var(--usunezumi)", fontSize: 11, lineHeight: 1, padding: "0 2px" }}>×</button>}
                                        </span>
                                      );
                                    })}
                                  </div>
                                );
                              })()}
                              {canEdit && (
                                <div style={{ marginTop: 10, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                                  <select style={{ ...inpStyle, flex: "2 1 120px", minWidth: 0 }} value={addTripVehicle === v.id ? tripPerson : ""} onChange={(e) => { setAddTripVehicle(v.id); setTripPerson(e.target.value); }}>
                                    <option value="">{t.selectPassenger}</option>
                                    {persons.filter((p) => !p.hide_from_vehicles).map((p) => <option key={p.id} value={p.id}>{p.dept ? `[${p.dept}] ` : ""}{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</option>)}
                                  </select>
                                  <select style={{ ...inpStyle, flex: "1 1 80px", minWidth: 0 }} value={addTripVehicle === v.id ? tripRole : "passenger"} onChange={(e) => { setAddTripVehicle(v.id); setTripRole(e.target.value); }}>
                                    <option value="driver">{t.driver}</option>
                                    <option value="passenger">{t.passengers}</option>
                                  </select>
                                  <button type="button" style={{ ...pBtn(false), flex: "0 0 auto" }} onClick={() => {
                                    if (!tripPerson || addTripVehicle !== v.id) return;
                                    addAssignment(v.id, +tripPerson, tripRole, "");
                                    setAddTripVehicle(null); setTripPerson(""); setTripRole("passenger");
                                  }}>+</button>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>)}
                  </>)}
                  {vehicleSub === "daily" && (() => {
                    const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
                    const todayDispatches = dailyDispatches.filter((d) => dispatchDateKey(d) === dispatchDate);
                    const dailyPersonKey = (vehicleId, personId) => `${vehicleId}:${personId}`;
                    const insertDailyRows = async (records, date) => {
                      const existing = dailyDispatches.filter((d) => dispatchDateKey(d) === date);
                      const existingKeys = new Set(existing.map((d) => dailyPersonKey(d.vehicle_id, d.person_id)));
                      const toInsert = records.filter((r) => !existingKeys.has(dailyPersonKey(r.vehicle_id, r.person_id)));
                      if (!toInsert.length) return 0;
                      const rows = await Promise.all(toInsert.map((r, i) => {
                        const sort = r.sort_order ?? existing.filter((d) => d.vehicle_id === r.vehicle_id).length + i;
                        return api.insert("daily_dispatches", { project_id: pid, dispatch_date: date, vehicle_id: r.vehicle_id, person_id: r.person_id, role: r.role || "passenger", sort_order: sort }).then(([row]) => row);
                      }));
                      setDailyDispatches((d) => [...d, ...rows]);
                      return rows.length;
                    };
                    const importFromConfig = async (silent) => {
                      const template = templateAssignmentsForDaily(allAssignments);
                      if (!template.length) {
                        if (!silent) showToast(t.dispatchNoConfigTemplate);
                        return 0;
                      }
                      const n = await insertDailyRows(template, dispatchDate);
                      if (!silent) {
                        if (n > 0) showToast(t.dispatchImportedFromConfig.replace("{n}", n));
                        else showToast(t.dispatchNothingToImport);
                      }
                      return n;
                    };
                    const addDispatch = async (vehicleId, personId, role) => {
                      try {
                        const [row] = await api.insert("daily_dispatches", { project_id: pid, dispatch_date: dispatchDate, vehicle_id: vehicleId, person_id: +personId, role, sort_order: todayDispatches.filter((d) => d.vehicle_id === vehicleId).length });
                        setDailyDispatches((d) => [...d, row]);
                      } catch (e) { showToast(e.message); }
                    };
                    const removeDispatch = async (rec) => {
                      try { await api.delete("daily_dispatches", rec.id); setDailyDispatches((d) => d.filter((x) => x.id !== rec.id)); }
                      catch (e) { showToast(e.message); }
                    };
                    const copyPrev = async () => {
                      const prevDate = (() => { const d = parseLocalDate(dispatchDate); d.setDate(d.getDate() - 1); return localDateStr(d); })();
                      const prevRecs = dailyDispatches.filter((d) => dispatchDateKey(d) === prevDate);
                      if (prevRecs.length) {
                        try {
                          const n = await insertDailyRows(prevRecs.map((r) => ({ vehicle_id: r.vehicle_id, person_id: r.person_id, role: r.role, sort_order: r.sort_order })), dispatchDate);
                          if (n > 0) showToast(t.dispatchCopied);
                          else showToast(t.dispatchNothingToImport);
                        } catch (e) { showToast(e.message); }
                        return;
                      }
                      const n = await importFromConfig(true);
                      if (n > 0) showToast(t.dispatchFallbackFromConfig.replace("{n}", n));
                      else if (!allAssignments.length) showToast(t.dispatchNoConfigTemplate);
                      else showToast(t.dispatchNoYesterday);
                    };
                    return (
                      <div>
                        <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center", flexWrap: "wrap" }}>
                          <input type="date" style={{ ...inpStyle, width: "auto" }} value={dispatchDate} onChange={(e) => setDispatchDate(e.target.value)} />
                          {canEdit && (
                            <>
                              <button type="button" onClick={copyPrev} style={{ ...pBtn(false), background: "var(--asagi)", border: "none", fontSize: 12 }}>📋 {t.copyPrevDay}</button>
                              <button type="button" onClick={() => importFromConfig(false)} style={{ ...pBtn(false), background: "var(--moegi)", border: "none", fontSize: 12, color: "var(--shiro)" }}>📥 {t.importFromConfig}</button>
                            </>
                          )}
                          <span style={{ fontSize: 11, color: "var(--nezumi)", marginLeft: "auto" }}>{todayDispatches.length} {t.totalAssigned}</span>
                        </div>
                        {vehicles.length === 0 ? (
                          <div style={{ padding: "50px 40px", textAlign: "center", background: "var(--shiro)", border: "1px solid var(--keisenL)", borderRadius: 8, color: "var(--nezumi)", fontSize: 13 }}>{t.noVehicleHint}</div>
                        ) : (
                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(320px,1fr))", gap: 14 }}>
                            {vehicles.map((v, vi) => {
                              const dAssigns = todayDispatches.filter((d) => d.vehicle_id === v.id);
                              const cap = v.capacity || 4;
                              const isFull = dAssigns.length >= cap;
                              const pct = Math.min(100, Math.round((dAssigns.length / cap) * 100));
                              return (
                                <div key={v.id} style={{ background: "var(--shiro)", border: "1px solid var(--keisenL)", borderRadius: 8, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.05)" }}>
                                  <div style={{ background: "var(--sumiMid)", backgroundImage: "var(--theadGrad)", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <div>
                                      <strong style={{ fontSize: 14, fontFamily: "'Noto Serif JP',serif", color: "var(--washi)" }}>{vehicleDisplayTitle(v, vi)}</strong>
                                      <div style={{ fontSize: 10.5, marginTop: 4, opacity: 0.65, color: "var(--washi)", letterSpacing: "0.04em" }}>{v.region} · {v.type} · {dAssigns.length}/{cap} {t.passengers_unit}</div>
                                    </div>
                                  </div>
                                  <div style={{ height: 3, background: "rgba(0,0,0,.08)" }}><div style={{ height: 3, width: pct + "%", background: isFull ? "#ff6b6b" : "var(--moegi2)", transition: "width .4s" }} /></div>
                                  <div style={{ padding: "10px 14px" }}>
                                    {dAssigns.length > 0 && (
                                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 2px", marginBottom: canEdit ? 10 : 0 }}>
                                        {dAssigns.map((a, idx) => {
                                          const p = persons.find((x) => x.id === a.person_id);
                                          if (!p) return null;
                                          const isDriver = a.role === "driver";
                                          return (
                                            <span key={a.id} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 12.5, color: "var(--sumi)", fontWeight: isDriver ? 700 : 500, padding: "3px 6px", background: isDriver ? "var(--moegi3)" : "transparent", borderRadius: 4 }}>
                                              <span style={{ fontSize: 11, color: isDriver ? "var(--moegi)" : "var(--nezumi)", minWidth: 14 }}>{CIRC[idx] || idx + 1}</span>
                                              <span>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</span>
                                              {isDriver && <span style={{ fontSize: 9, color: "var(--moegi)", fontWeight: 700, marginLeft: 2 }}>{t.driver}</span>}
                                              {canEdit && <button type="button" onClick={() => removeDispatch(a)} style={{ marginLeft: 3, background: "none", border: "none", cursor: "pointer", color: "var(--usunezumi)", fontSize: 11, lineHeight: 1, padding: "0 2px" }}>×</button>}
                                            </span>
                                          );
                                        })}
                                      </div>
                                    )}
                                    {dAssigns.length === 0 && <div style={{ fontSize: 11, color: "var(--usunezumi)", padding: "8px 0" }}>{t.noDispatchData}</div>}
                                    {canEdit && !isFull && (
                                      <DailyDispatchAddRow vehicleId={v.id} persons={persons} t={t} onAdd={addDispatch} />
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
                <aside style={{ flex: "0 1 280px", position: "sticky", top: 16 }}>
                  <div style={{ background: "var(--shiro)", border: "1px solid var(--keisenL)" }}>
                    <div style={{ background: personsWithNoTrips.length ? "var(--shu)" : "var(--moegi)", color: "var(--washi)", padding: "12px 16px", display: "flex", justifyContent: "space-between" }}>
                      <span>{t.unassigned}</span><span>{personsWithNoTrips.length}</span>
                    </div>
                    <div style={{ maxHeight: 400, overflowY: "auto" }}>
                      {personsWithNoTrips.map((p) => (
                        <div key={p.id} style={{ padding: "8px 16px", borderBottom: "1px solid var(--keisenL)", fontSize: 12 }}>
                          <div style={{ fontWeight: 600 }}>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</div>
                          <div style={{ fontSize: 10, color: "var(--nezumi)" }}>{p.dept}</div>
                        </div>
                      ))}
                    </div>
                    <p style={{ padding: 10, fontSize: 10, color: "var(--nezumi)" }}>{t.unassignedHint}</p>
                  </div>
                  <div style={{ marginTop: 12, background: "var(--washi)", padding: 12, fontSize: 11, color: "var(--nezumi)", lineHeight: 1.5 }}>
                    {t.personTrips}: {t.segmentMorning} / {t.segmentEvening} / {t.segmentTransfer}
                  </div>
                </aside>
              </div>
            </div>
          )}
        </div>
      )}

      {personModal && <Modal title={personModal.mode === "add" ? t.addStaff : t.editStaff} onClose={() => setPersonModal(null)}><PersonForm init={personModal.data} onSave={savePerson} onClose={() => setPersonModal(null)} t={t} lang={lang} /></Modal>}
      {flightModal && <Modal title={t.flightMgmt} wide onClose={() => setFlightModal(null)}><FlightForm init={flightModal.data} onSave={async (f) => { try { const ex = flights.find((x) => x.person_id === flightModal.pid); const data = buildFlightPayload(f, flightModal.pid, pid); if (ex) { const [r] = await api.update("flights", ex.id, data); setFlights((fl) => fl.map((x) => x.id === ex.id ? r : x)); } else { const [r] = await api.insert("flights", data); setFlights((fl) => [...fl, r]); } showToast(t.saved); setFlightModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setFlightModal(null)} t={t} /></Modal>}
      {showReportExport && <ReportExportModal onClose={() => setShowReportExport(false)} t={t} lang={lang} project={project} persons={persons} flights={flights} stays={stays} flatStays={flatStays} hotels={hotels} pricingRules={pricingRules} vehicles={vehicles} vehicleAssignments={vehicleAssignments} personIndex={personIndex} stayDisplayTotals={stayDisplayTotals} />}
      {stayModal && <Modal title={t.hotelMgmt} onClose={closeStayModal}><HotelStayForm init={stayModal.data} hotels={hotels} pricingRules={pricingRules} onSave={saveStay} onClose={closeStayModal} t={t} project={project} lang={lang} isSpecialRoom={stayModal.special || stayModal.pid === null} defaultPhaseId={stayModal.defaultPhaseId} /></Modal>}
      {hotelModal && <Modal title={hotelModal.mode === "add" ? t.addHotel : t.hotelName} onClose={() => setHotelModal(null)}><HotelMasterForm init={hotelModal.data} shootPhases={shootPhases} onSave={async (f) => { try { if (hotelModal.mode === "add") { const [r] = await api.insert("hotels", { ...f, project_id: pid }); setHotels((h) => [...h, r]); } else { const [r] = await api.update("hotels", hotelModal.data.id, f); setHotels((h) => h.map((x) => x.id === hotelModal.data.id ? r : x)); } showToast(t.saved); setHotelModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setHotelModal(null)} t={t} /></Modal>}
      {priceModal && <Modal title={t.dateException} onClose={() => setPriceModal(null)}><PricingRuleForm init={priceModal.data} hotelId={priceModal.hotelId} hotelName={priceModal.hotelName} onSave={async (f) => { try { const data = { ...f, project_id: pid }; if (priceModal.mode === "add") { const [r] = await api.insert("pricing_rules", data); setPricingRules((rs) => [...rs, r]); } else { const [r] = await api.update("pricing_rules", priceModal.data.id, data); setPricingRules((rs) => rs.map((x) => x.id === priceModal.data.id ? r : x)); } showToast(t.saved); setPriceModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setPriceModal(null)} t={t} project={project} lang={lang} /></Modal>}
      {vehicleModal && <Modal title={vehicleModal.mode === "add" ? t.addVehicle : t.editVehicle} onClose={() => setVehicleModal(null)}><VehicleForm init={vehicleModal.data} onSave={saveVehicle} onClose={() => setVehicleModal(null)} t={t} lang={lang} /></Modal>}
      {roommateModal && <RoommateModal pid={roommateModal.pid} persons={persons} roommates={roommates} stays={flatStays} onSave={async (rpid, partnerIds) => { try { const group = [...new Set([rpid, ...partnerIds])]; for (const gid of group) await api.deleteWhere("roommates", "person_id", gid); if (partnerIds.length) for (const gid of group) { const partners = group.filter((x) => x !== gid); if (partners.length) await api.insert("roommates", partners.map((x) => ({ person_id: gid, partner_id: x, project_id: pid }))); } await loadAll(); showToast(t.saved); setRoommateModal(null); } catch (e) { showToast(e.message); } }} onClose={() => setRoommateModal(null)} t={t} />}
      {showMembers && <MemberManager project={project} user={user} canManage={canManageMembers} onClose={() => setShowMembers(false)} t={t} />}
      {showCurrency && <CurrencySettingsModal project={project} onSave={saveCurrency} onClose={() => setShowCurrency(false)} t={t} />}
    </div>
  );
}

function GlobalStyles() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@300;400;600&display=swap');
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); font-family: 'Noto Sans JP', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: var(--sumi); }
