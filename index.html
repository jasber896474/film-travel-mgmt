        const guestRow = `
        <tr style="break-inside:avoid;">
          <td colspan="${colCount}" style="padding:2px 12px 10px 28px;border-bottom:1px solid #e0ebe4;font-size:9pt;color:#444;">${guestLines}</td>
        </tr>`;
        return _oldRow + mainRows + guestRow;
      }).join("");

      // 刪除的 batch 渲染（快照中有、現在沒有）
      const _deletedRows = _deletedBatches.map((ob) => `
        <tr class="diff-row-deleted diff-mark" style="break-inside:avoid;background:#fff0f0;">
          <td style="padding:8px 12px;border-bottom:1px solid #f0c0c0;color:#c0392b;text-decoration:line-through;">${ob.check_in} ${t.invoiceDateRange} ${ob.check_out}<br><small>(${t.nights || "共"} ${ob.nights} ${t.invoiceNights})</small></td>
          <td style="padding:8px 12px;border-bottom:1px solid #f0c0c0;color:#c0392b;text-decoration:line-through;">${ob.roomLabel}<span style="text-decoration:none;display:inline-block;margin-left:6px;padding:1px 6px;background:#c0392b;color:#fff;border-radius:3px;font-size:7.5pt;font-weight:700;">刪除</span></td>
          <td style="padding:8px 12px;border-bottom:1px solid #f0c0c0;color:#c0392b;text-decoration:line-through;">${ob.roomCount} 間 × ${ob.nights} 晚</td>
          ${includeAmount ? `<td style="padding:8px 12px;border-bottom:1px solid #f0c0c0;text-align:right;color:#c0392b;text-decoration:line-through;font-weight:700;">${formatMoney(convertMoney(ob.batchTotal, project), project, lang)}</td>` : ""}
        </tr>`).join("");

      const pageBreak = idx > 0 ? "page-break-before:always;" : "";
      const subtotalRow = includeAmount ? `
              <tr style="background:#eaf2ec;break-inside:avoid;">
                <td colspan="3" style="padding:10px 12px;font-weight:700;font-size:10pt;">${t.invoiceSubtotal}</td>
                <td style="padding:10px 12px;text-align:right;font-weight:800;font-size:12pt;color:#1a3028;">${formatMoney(convertMoney(hd.hotelTotal, project), project, lang)}</td>
              </tr>` : "";
      const headCols = `<th style="padding:8px 12px;text-align:left;font-size:9pt;font-weight:700;letter-spacing:.06em;">${t.nights}數 / 日期</th>
                <th style="padding:8px 12px;text-align:left;font-size:9pt;font-weight:700;letter-spacing:.06em;">${t.invoiceRoomType}</th>
                <th style="padding:8px 12px;text-align:left;font-size:9pt;font-weight:700;letter-spacing:.06em;">${includeAmount ? t.invoiceFormula : t.invoiceQuantity}</th>${includeAmount ? `
                <th style="padding:8px 12px;text-align:right;font-size:9pt;font-weight:700;letter-spacing:.06em;">${t.invoiceSubtotal}</th>` : ""}`;
      const _hotelBadge = _hotelIsNew
        ? `<span class="diff-mark" style="margin-left:10px;padding:2px 8px;background:#22a959;color:#fff;border-radius:3px;font-size:8pt;font-weight:700;vertical-align:middle;">新飯店</span>`
        : "";
      return `
        <div style="margin-bottom:28px;${pageBreak}">
          <div style="background:linear-gradient(135deg,#1a3028,#2d4a36);color:#fff;padding:10px 16px;border-radius:6px 6px 0 0;font-size:13pt;font-family:'Noto Serif JP',serif;font-weight:600;break-after:avoid;break-inside:avoid;">${hd.hotel?.name || "—"}${_hotelBadge}</div>
          <table style="width:100%;border-collapse:collapse;border:1px solid #e0ebe4;border-top:none;">
            <thead style="display:table-header-group;">
              <tr style="background:#f0f5f1;break-inside:avoid;">${headCols}</tr>
            </thead>
            <tbody>${batchRows}${_deletedRows}${subtotalRow}
            </tbody>
          </table>
        </div>`;
    }).join("");

    const totalBanner = includeAmount ? `
<div style="margin-top:16px;padding:12px 16px;background:linear-gradient(135deg,#1a3028,#2d4a36);color:#fff;border-radius:6px;display:flex;justify-content:space-between;align-items:center;break-inside:avoid;">
  <span style="font-size:12pt;font-weight:700;">${t.totalCost}</span>
  <span style="font-size:18pt;font-family:'Noto Serif JP',serif;font-weight:600;">${formatMoney(convertMoney(printTotal, project), project, lang)}</span>
</div>` : "";

    // 計算整體差異摘要
    const _totalNew = printData.reduce((s, hd) => {
      const snap = _snapHotelMap[String(hd.hid)];
      if (!snap) return s + (hd.batches?.length || 0);
      const dm = _diffBatches(snap.batches, (hd.batches || []).map((b) => ({ key: `${b.check_in}|${b.check_out}|${b.roomLabel}`, check_in: b.check_in, check_out: b.check_out, roomLabel: b.roomLabel, roomCount: b.roomCount, nights: b.nights, batchTotal: b.batchTotal })));
      return s + Object.values(dm).filter((d) => d.status === "new").length;
    }, 0);
    const _totalChanged = printData.reduce((s, hd) => {
      const snap = _snapHotelMap[String(hd.hid)];
      if (!snap) return s;
      const dm = _diffBatches(snap.batches, (hd.batches || []).map((b) => ({ key: `${b.check_in}|${b.check_out}|${b.roomLabel}`, check_in: b.check_in, check_out: b.check_out, roomLabel: b.roomLabel, roomCount: b.roomCount, nights: b.nights, batchTotal: b.batchTotal })));
      return s + Object.values(dm).filter((d) => d.status === "changed").length;
    }, 0);
    const _totalDeleted = printData.reduce((s, hd) => {
      const snap = _snapHotelMap[String(hd.hid)];
      if (!snap) return s;
      const dm = _diffBatches(snap.batches, (hd.batches || []).map((b) => ({ key: `${b.check_in}|${b.check_out}|${b.roomLabel}`, check_in: b.check_in, check_out: b.check_out, roomLabel: b.roomLabel, roomCount: b.roomCount, nights: b.nights, batchTotal: b.batchTotal })));
      return s + Object.values(dm).filter((d) => d.status === "deleted").length;
    }, 0);
    const _hasDiff = _hasSnap && (_totalNew + _totalChanged + _totalDeleted > 0);
    const _diffBar = _hasSnap ? (_hasDiff ? `
<div class="diff-mark" style="margin-bottom:14px;padding:10px 16px;border-radius:6px;border:1px solid #d4c060;background:#fffbe6;display:flex;align-items:center;gap:16px;flex-wrap:wrap;break-inside:avoid;">
  <span style="font-size:8.5pt;color:#7a6010;font-weight:700;">與 ${_snapTime} 版本比較</span>
  ${_totalNew > 0 ? `<span style="padding:2px 9px;background:#22a959;color:#fff;border-radius:3px;font-size:8pt;font-weight:700;">新增 ${_totalNew}</span>` : ""}
  ${_totalChanged > 0 ? `<span style="padding:2px 9px;background:#e6a817;color:#fff;border-radius:3px;font-size:8pt;font-weight:700;">變更 ${_totalChanged}</span>` : ""}
  ${_totalDeleted > 0 ? `<span style="padding:2px 9px;background:#c0392b;color:#fff;border-radius:3px;font-size:8pt;font-weight:700;">刪除 ${_totalDeleted}</span>` : ""}
</div>` : `
<div class="diff-mark" style="margin-bottom:14px;padding:8px 16px;border-radius:6px;border:1px solid #b8d8c0;background:#f0faf3;break-inside:avoid;">
  <span style="font-size:8pt;color:#2a6040;">✓ 與 ${_snapTime} 版本相比，無任何變更</span>
</div>`) : "";

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${_docTitle}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Noto Sans JP',sans-serif;font-size:10pt;color:#1a2820;padding:12mm;}
@page{size:A4 portrait;margin:10mm 12mm;}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style>
</head><body>
<div style="background:linear-gradient(135deg,#1a3028,#2d4a36);color:#fff;padding:14px 18px;border-radius:6px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;break-after:avoid;break-inside:avoid;">
  <div><div style="font-family:'Noto Serif JP',serif;font-size:15pt;font-weight:600;">${t.invoiceTitle}</div><div style="font-size:9pt;opacity:.75;margin-top:4px;">${project?.name || ""} · ${new Date().toLocaleDateString()}</div></div>
</div>
${_diffBar}${rows}${totalBanner}
</body></html>`;
    openReportPreviewWindow(html, { printLabel: t.print, closeLabel: t.cancel });
  };

  const openPrintSelect = () => {
    setPrintSelected(new Set(data.map((hd) => String(hd.hid))));
    setShowPrintSelect(true);
  };

  if (!data.length) {
    return (
      <div style={{ padding: "60px 0", textAlign: "center", color: "var(--usunezumi)", fontSize: 13 }}>
        {t.invoiceNoData}
      </div>
    );
  }

  return (
    <div>
      {/* 模式切換 + 白話說明 */}
      <div style={{ marginBottom: 16, padding: "12px 16px", background: "var(--washi)", borderRadius: 8, border: "1px solid var(--keisenL)" }}>
        <div style={{ display: "inline-flex", gap: 4, padding: 3, background: "var(--keisenL)", borderRadius: 8, marginBottom: 10 }}>
          {modeBtn("merged", t.invoiceModeMerged)}
          {modeBtn("perRoom", t.invoiceModePerRoom)}
        </div>
        <p style={{ margin: 0, fontSize: 12, color: "var(--sumi)", lineHeight: 1.65 }}>{modeHint}</p>
        {totalsDiffer && (
          <p style={{ margin: "8px 0 0", fontSize: 11, color: "var(--kincha)", lineHeight: 1.6 }}>{t.invoiceModeDiffHint}</p>
        )}
      </div>

      {/* 頁首 Banner */}
      <div style={{ background: "var(--sumiMid)", backgroundImage: "var(--headerGrad)", color: "var(--washi)", padding: "14px 20px", marginBottom: 20, borderRadius: 8, display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 2px 12px rgba(0,0,0,.1)" }}>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, fontFamily: "'Noto Serif JP',serif", letterSpacing: "0.04em" }}>{t.invoiceTitle}</div>
          <div style={{ fontSize: 10, opacity: 0.65, marginTop: 3 }}>{t.invoiceSubtitle}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, opacity: 0.65 }}>{t.totalCost}</div>
            <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Noto Serif JP',serif" }}>{formatMoney(convertMoney(grandTotal, project), project, lang)}</div>
          </div>
          <button type="button" onClick={openPrintSelect} style={{ background: "rgba(255,255,255,.12)", color: "var(--washi)", border: "1px solid rgba(255,255,255,.22)", borderRadius: 6, padding: "8px 16px", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>🖨 {t.invoicePrint}</button>
        </div>
      </div>

      {/* 各飯店表格 */}
      {data.length > 0 && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
          <CollapseAllButton sectionKeys={data.map((hd) => `invoice:${hd.hid}`)} collapsedHotels={collapsedHotels} onToggle={setManyCollapsed} t={t} />
        </div>
      )}
      {data.map((hd) => {
        const sectionKey = `invoice:${hd.hid}`;
        const isCollapsed = collapsedHotels.has(sectionKey);
        return (
        <section key={hd.hid} style={{ marginBottom: 32, background: "var(--shiro)", borderRadius: 8, border: "1px solid var(--keisenL)", overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.05)" }}>
          {/* 飯店標題列 */}
          <div
            onClick={() => toggleHotelCollapsed(sectionKey)}
            style={{ background: "var(--sumiMid)", backgroundImage: "var(--theadGrad)", padding: "12px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", userSelect: "none" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 20, height: 20, border: "1px solid rgba(255,255,255,.3)", borderRadius: 4, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 13, color: "var(--washi)", lineHeight: 1, flexShrink: 0 }}>
                {isCollapsed ? "+" : "−"}
              </span>
              <h3 style={{ margin: 0, fontSize: 14, fontWeight: 700, color: "var(--washi)", fontFamily: "'Noto Serif JP',serif", letterSpacing: "0.03em" }}>{hd.hotel?.name || "—"}</h3>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <span style={{ fontSize: 11, color: "var(--washi)", opacity: 0.75 }}>{hd.batches.length} {t.invoiceBatch}</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: "var(--washi)", fontFamily: "'Noto Serif JP',serif" }}>{formatMoney(convertMoney(hd.hotelTotal, project), project, lang)}</span>
            </div>
          </div>

          {/* 批次表格 */}
          {!isCollapsed && (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", tableLayout: "fixed" }}>
              <colgroup>
                <col style={{ width: "28%" }} />
                <col style={{ width: "18%" }} />
                <col style={{ width: "34%" }} />
                <col style={{ width: "20%" }} />
              </colgroup>
              <thead>
                <tr style={{ background: "var(--washi)", borderBottom: "2px solid var(--keisenM)" }}>
                  {[t.nights + " / " + t.checkIn + "〜" + t.checkOut, t.invoiceRoomType, t.invoiceFormula, t.invoiceSubtotal].map((h, i) => (
                    <th key={i} style={{ padding: "9px 14px", fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", color: "var(--nezumi)", textAlign: i === 3 ? "right" : "left", whiteSpace: "nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {hd.batches.map((b, i) => {
                  const rowKey = `${hd.hid}-${i}`;
                  const segments = b.segments || [b];
                  const multiSeg = segments.length > 1;
                  const roomGroups = b.roomGroups;
                  const expandable = multiSeg || !!roomGroups;
                  const isExpanded = expandable && expandedBatch === rowKey;
                  return (
                    <React.Fragment key={rowKey}>
                      <tr
                        style={{ background: i % 2 === 0 ? "var(--shiro)" : "var(--washi)", borderBottom: "1px solid var(--keisenL)", cursor: expandable ? "pointer" : "default" }}
                        onClick={expandable ? () => setExpandedBatch((prev) => prev === rowKey ? null : rowKey) : undefined}
                      >
                        <td style={{ padding: "11px 14px", verticalAlign: "top" }}>
                          <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--sumi)", fontVariantNumeric: "tabular-nums" }}>
                            {fmtDate(b.check_in, lang)} {t.invoiceDateRange} {fmtDate(b.check_out, lang)}
                          </div>
                          <div style={{ fontSize: 10.5, color: "var(--moegi)", marginTop: 3, fontWeight: 600 }}>{b.nights} {t.invoiceNights}</div>
                        </td>
                        <td style={{ padding: "11px 14px", fontSize: 12.5, color: "var(--sumi)", verticalAlign: "top" }}>
                          {b.roomLabel}
                          {b.subLabel && <div style={{ fontSize: 10.5, color: "var(--nezumi)", marginTop: 3 }}>{b.subLabel}</div>}
                        </td>
                        <td style={{ padding: "11px 14px", fontSize: 12, color: "var(--nezumi)", fontVariantNumeric: "tabular-nums", verticalAlign: "top" }}>
                          {!multiSeg ? (
                            <>
                              <span style={{ color: "var(--asagi)", fontWeight: 600 }}>{formatMoney(convertMoney(segments[0].unitPrice, project), project, lang)}</span>
                              <span style={{ margin: "0 5px", color: "var(--usunezumi)" }}>×</span>
                              <span style={{ color: "var(--sumi)", fontWeight: 600 }}>{b.roomCount} {t.invoiceRooms}</span>
                              <span style={{ margin: "0 5px", color: "var(--usunezumi)" }}>×</span>
                              <span style={{ color: "var(--sumi)", fontWeight: 600 }}>{b.nights} {t.invoiceNights}</span>
                            </>
                          ) : (
                            <>
                              <span style={{ color: "var(--sumi)", fontWeight: 600 }}>{b.roomCount} {t.invoiceRooms}</span>
                              <span style={{ margin: "0 5px", color: "var(--usunezumi)" }}>×</span>
                              <span style={{ color: "var(--sumi)", fontWeight: 600 }}>{b.nights} {t.invoiceNights}</span>
                              <div style={{ fontSize: 10, color: "var(--usunezumi)", marginTop: 3 }}>{t.invoiceMultiRate}</div>
                            </>
                          )}
                        </td>
                        <td style={{ padding: "11px 14px", textAlign: "right", fontWeight: 700, fontSize: 13, color: "var(--asagi)", fontVariantNumeric: "tabular-nums", verticalAlign: "top" }}>
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8 }}>
                            {formatMoney(convertMoney(b.batchTotal, project), project, lang)}
                            {expandable && (
                              <span style={{ fontSize: 12, color: "var(--nezumi)", transition: "transform .2s", display: "inline-block", transform: isExpanded ? "rotate(90deg)" : "none" }}>›</span>
                            )}
                          </div>
                        </td>
                      </tr>
                      {isExpanded && (
                        <tr style={{ background: "var(--washi)", borderBottom: "1px solid var(--keisenL)" }}>
                          <td colSpan={4} style={{ padding: "10px 18px 12px 24px" }}>
                            {multiSeg && (
                              <div style={{ marginBottom: roomGroups ? 12 : 0 }}>
                                <div style={{ fontSize: 10, fontWeight: 700, color: "var(--nezumi)", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 6 }}>{t.invoiceFormula}</div>
                                {segments.map((seg, si) => (
                                  <div key={si} style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12, padding: "5px 0", borderBottom: "1px solid var(--keisenL)", fontSize: 12 }}>
                                    <span style={{ color: "var(--sumi)", fontVariantNumeric: "tabular-nums" }}>
                                      {fmtDate(seg.check_in, lang)} {t.invoiceDateRange} {fmtDate(seg.check_out, lang)}（{seg.nights} {t.invoiceNights}）
                                    </span>
                                    <span style={{ color: "var(--nezumi)", fontVariantNumeric: "tabular-nums" }}>
                                      <span style={{ color: "var(--asagi)", fontWeight: 600 }}>{formatMoney(convertMoney(seg.unitPrice, project), project, lang)}</span>
                                      {" × "}{b.roomCount} {t.invoiceRooms}{" × "}{seg.nights} {t.invoiceNights}
                                      {" = "}<span style={{ fontWeight: 700, color: "var(--asagi)" }}>{formatMoney(convertMoney(seg.batchTotal, project), project, lang)}</span>
                                    </span>
                                  </div>
                                ))}
                              </div>
                            )}
                            {roomGroups && (
                              <div>
                                <div style={{ fontSize: 10, fontWeight: 700, color: "var(--nezumi)", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 8 }}>{b.roomCount} {t.invoiceRooms}</div>
                                {roomGroups.map((g) => (
                                  <div key={g.label} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "4px 0", borderBottom: "1px solid var(--keisenL)" }}>
                                    <span style={{ fontSize: 11, padding: "2px 7px", border: "1px solid var(--keisenM)", borderRadius: 3, color: "var(--nezumi)", fontWeight: 600, minWidth: 36, textAlign: "center", flexShrink: 0, marginTop: 1 }}>{g.label}</span>
                                    <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 10px", alignItems: "center" }}>
                                      {g.stays.map((s, si) => (
                                        <React.Fragment key={s.id}>
                                          {si > 0 && <span style={{ color: "var(--keisenM)", fontSize: 13 }}>·</span>}
                                          <span style={{ fontSize: 12, color: "var(--sumi)" }}>
                                            {s.special_room_name ? `🏷 ${s.special_room_name}` : (s._personName || "—")}
                                            {s.check_out && <span style={{ fontSize: 10, color: "var(--usunezumi)", marginLeft: 4 }}>～{fmtDate(s.check_out, lang)}</span>}
                                          </span>
                                        </React.Fragment>
                                      ))}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
                {/* 小計列 */}
                <tr style={{ background: "var(--moegi3)", borderTop: "2px solid var(--moegi)" }}>
                  <td colSpan={3} style={{ padding: "11px 14px", fontWeight: 700, fontSize: 12.5, color: "var(--moegi)" }}>{t.invoiceSubtotal}</td>
                  <td style={{ padding: "11px 14px", textAlign: "right", fontWeight: 800, fontSize: 15, color: "var(--moegi)", fontFamily: "'Noto Serif JP',serif", fontVariantNumeric: "tabular-nums" }}>
                    {formatMoney(convertMoney(hd.hotelTotal, project), project, lang)}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          )}
        </section>
        );
      })}

      {/* 全域總計 */}
      <div style={{ background: "var(--sumiMid)", backgroundImage: "var(--headerGrad)", color: "var(--washi)", padding: "14px 20px", borderRadius: 8, display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 2px 12px rgba(0,0,0,.1)" }}>
        <span style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.04em" }}>{t.totalCost}</span>
        <span style={{ fontSize: 22, fontWeight: 700, fontFamily: "'Noto Serif JP',serif" }}>{formatMoney(convertMoney(grandTotal, project), project, lang)}</span>
      </div>

      {showPrintSelect && (
        <Modal title={t.printSelectHotels} onClose={() => setShowPrintSelect(false)}>
          <p style={{ fontSize: 12, color: "var(--nezumi)", lineHeight: 1.6, marginTop: 0 }}>{t.printSelectHint}</p>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <button type="button" onClick={() => setPrintSelected(new Set(data.map((hd) => String(hd.hid))))} style={{ fontSize: 11.5, padding: "5px 12px", borderRadius: 6, border: "1px solid var(--keisenM)", background: "var(--shiro)", color: "var(--nezumi)", cursor: "pointer" }}>{t.selectAll}</button>
            <button type="button" onClick={() => setPrintSelected(new Set())} style={{ fontSize: 11.5, padding: "5px 12px", borderRadius: 6, border: "1px solid var(--keisenM)", background: "var(--shiro)", color: "var(--nezumi)", cursor: "pointer" }}>{t.deselectAll}</button>
          </div>
          {invoiceMode === "merged" && (
            <label style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", border: "1px solid var(--keisenL)", borderRadius: 6, marginBottom: 12, cursor: "pointer", background: "var(--washi)" }}>
              <input type="checkbox" checked={printShowGuests} onChange={(e) => setPrintShowGuests(e.target.checked)} style={{ marginTop: 2 }} />
              <span>
                <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--sumi)" }}>{t.printShowGuests}</span>
                <span style={{ display: "block", fontSize: 11, color: "var(--nezumi)", lineHeight: 1.6, marginTop: 2 }}>{t.printShowGuestsHint}</span>
              </span>
            </label>
          )}
          <label style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", border: "1px solid var(--keisenL)", borderRadius: 6, marginBottom: 12, cursor: "pointer", background: "var(--washi)" }}>
            <input type="checkbox" checked={printIncludeAmount} onChange={(e) => setPrintIncludeAmount(e.target.checked)} style={{ marginTop: 2 }} />
            <span>

              <span style={{ display: "block", fontSize: 11, color: "var(--nezumi)", lineHeight: 1.6, marginTop: 2 }}>{t.printIncludeAmountHint}</span>
            </span>
          </label>
          {invoiceMode === "merged" && printIncludeAmount && (
            <label style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", border: "1px solid var(--keisenL)", borderRadius: 6, marginBottom: 12, cursor: "pointer", background: "var(--washi)" }}>
              <input type="checkbox" checked={printShowSegments} onChange={(e) => setPrintShowSegments(e.target.checked)} style={{ marginTop: 2 }} />
              <span>
                <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--sumi)" }}>{t.printShowSegments}</span>
                <span style={{ display: "block", fontSize: 11, color: "var(--nezumi)", lineHeight: 1.6, marginTop: 2 }}>{t.printShowSegmentsHint}</span>
              </span>
            </label>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: "50vh", overflowY: "auto", marginBottom: 16 }}>
            {data.map((hd) => {
              const hid = String(hd.hid);
              const checked = printSelected ? printSelected.has(hid) : true;
              return (
                <label key={hid} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "8px 12px", border: "1px solid var(--keisenL)", borderRadius: 6, cursor: "pointer", background: checked ? "var(--washi)" : "var(--shiro)" }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <input
                      type="checkbox" checked={checked}
                      onChange={() => setPrintSelected((prev) => {
                        const next = new Set(prev);
                        if (next.has(hid)) next.delete(hid); else next.add(hid);
                        return next;
                      })}
                    />
                    <span style={{ fontSize: 13, fontWeight: 600, fontFamily: "'Noto Serif JP',serif" }}>{hd.hotel?.name || "—"}</span>
                  </span>
                  <span style={{ fontSize: 12, fontWeight: 600, color: "var(--asagi)", fontVariantNumeric: "tabular-nums" }}>{formatMoney(convertMoney(hd.hotelTotal, project), project, lang)}</span>

              );

          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button type="button" onClick={() => setShowPrintSelect(false)} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer", borderRadius: 6 }}>{t.cancel}</button>
            <button
              type="button"
              disabled={!printSelected || printSelected.size === 0}
              onClick={() => { handlePrint(printSelected, printShowGuests, printIncludeAmount, printShowSegments); setShowPrintSelect(false); }}
              style={{ ...pBtn(false), opacity: (!printSelected || printSelected.size === 0) ? 0.4 : 1, cursor: (!printSelected || printSelected.size === 0) ? "not-allowed" : "pointer" }}
            >{t.confirmPrint}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function DailyDispatchAddRow({ vehicleId, persons, t, onAdd }) {
  const [person, setPerson] = React.useState("");
  const [role, setRole] = React.useState("passenger");
  const [query, setQuery] = React.useState("");
  const [showDropdown, setShowDropdown] = React.useState(false);
  const [activeIdx, setActiveIdx] = React.useState(-1);
  const wrapRef = React.useRef(null);

  const eligible = persons.filter((p) => !p.hide_from_vehicles);
  const personLabel = (p) => `${p.dept ? `[${p.dept}] ` : ""}${p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}`;
  const selectedPerson = eligible.find((p) => String(p.id) === String(person));

  const filtered = React.useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return eligible.slice(0, 50);
    return eligible.filter((p) => {
      const name = (p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()).toLowerCase();
      const roman = `${p.last_roman || ""} ${p.first_roman || ""}`.trim().toLowerCase();
      const dept = (p.dept || "").toLowerCase();
      return name.includes(q) || roman.includes(q) || dept.includes(q);
    }).slice(0, 50);
  }, [query, eligible]);

  React.useEffect(() => {
    const onDocClick = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setShowDropdown(false); };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, []);

  const choosePerson = (p) => {
    setPerson(String(p.id));
    setQuery(personLabel(p));
    setShowDropdown(false);
    setActiveIdx(-1);
  };

  const handleKeyDown = (e) => {
    if (!showDropdown) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx((i) => Math.min(i + 1, filtered.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); if (activeIdx >= 0 && filtered[activeIdx]) choosePerson(filtered[activeIdx]); }
    else if (e.key === "Escape") { setShowDropdown(false); }
  };

  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
      <div ref={wrapRef} style={{ position: "relative", flex: "2 1 160px", minWidth: 0 }}>
        <input
          type="text"
          style={{ ...inpStyle, width: "100%", paddingLeft: 28, boxSizing: "border-box" }}
          placeholder={t.selectPassenger}
          value={query}
          onChange={(e) => { setQuery(e.target.value); setPerson(""); setShowDropdown(true); setActiveIdx(-1); }}
          onFocus={() => setShowDropdown(true)}
          onKeyDown={handleKeyDown}
        />
        <i className="ti ti-search" aria-hidden="true" style={{ position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", fontSize: 13, color: "var(--nezumi)", pointerEvents: "none" }} />
        {showDropdown && filtered.length > 0 && (
          <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "var(--shiro)", border: "1px solid var(--keisenM)", borderRadius: 6, maxHeight: 200, overflowY: "auto", zIndex: 20, boxShadow: "0 4px 16px rgba(0,0,0,.08)" }}>
            {filtered.map((p, i) => (
              <div
                key={p.id}
                onMouseDown={() => choosePerson(p)}
                style={{ padding: "7px 10px", fontSize: 12.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, background: i === activeIdx ? "var(--washi)" : "transparent" }}
                onMouseEnter={() => setActiveIdx(i)}
              >
                {p.dept && <span style={{ fontSize: 10, color: "var(--nezumi)", padding: "1px 5px", border: "1px solid var(--keisenL)", borderRadius: 3, flexShrink: 0 }}>{p.dept}</span>}
                <span>{p.name_kanji || `${p.last_roman} ${p.first_roman}`.trim()}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <select style={{ ...inpStyle, flex: "1 1 80px", minWidth: 0 }} value={role} onChange={(e) => setRole(e.target.value)}>
        <option value="driver">{t.driver}</option>
        <option value="passenger">{t.passengers}</option>
      </select>
      <button type="button" style={{ ...pBtn(false), flex: "0 0 auto" }} onClick={() => {
        if (!person) return;
        onAdd(vehicleId, person, role);
        setPerson(""); setQuery(""); setRole("passenger");
      }}>+</button>
    </div>
  );
}

function ShootPhaseBar({ phases, active, onSelect, onAdd, onDelete, t, canEdit }) {
  const [name, setName] = useState("");
  const [pendingDelete, setPendingDelete] = useState(null);

  const phaseChipStyle = (selected) => ({
    padding: "8px 14px",
    border: "none",
    cursor: "pointer",
    fontSize: 12,
    fontWeight: selected ? 700 : 500,
    color: selected ? "var(--shiro)" : "var(--sumi)",
    background: selected ? "var(--moegi)" : "var(--washi)",
    minHeight: 36,
    lineHeight: 1.3,
    fontFamily: "inherit",
  });

  const phaseBoxStyle = (selected) => ({
    display: "inline-flex",
    alignItems: "stretch",
    borderRadius: 4,
    overflow: "hidden",
    border: `1px solid ${selected ? "var(--moegi)" : "var(--keisenM)"}`,
    boxShadow: selected ? "0 0 0 1px var(--moegi)" : "none",
  });

  if (!phases.length && !canEdit) return null;
  return (
    <div style={{ marginBottom: 14, padding: "12px 14px", background: "var(--shiro)", borderRadius: 4, border: "1px solid var(--keisenL)" }}>
      <div style={{ fontSize: 10, fontWeight: 700, color: "var(--nezumi)", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 8 }}>{t.manageShootPhases}</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <div style={phaseBoxStyle(!active)}>
          <button type="button" onClick={() => onSelect("")} style={phaseChipStyle(!active)}>{t.allPhases}</button>
        </div>
        {phases.map((p) => {
          const selected = active === p.id;
          return (
            <div key={p.id} style={phaseBoxStyle(selected)}>
              <button type="button" onClick={() => onSelect(p.id)} style={phaseChipStyle(selected)}>{p.name}</button>
              {canEdit && (
                <button
                  type="button"
                  aria-label={t.delete}
                  title={t.delete}
                  onClick={(e) => { e.stopPropagation(); setPendingDelete(p); }}
                  style={{
                    width: 32, minWidth: 32, border: "none", borderLeft: `1px solid ${selected ? "rgba(255,255,255,.25)" : "var(--keisenM)"}`,
                    cursor: "pointer", background: selected ? "rgba(0,0,0,.12)" : "var(--washi)",
                    color: selected ? "rgba(255,255,255,.85)" : "var(--usunezumi)", fontSize: 16, lineHeight: 1,
                    fontFamily: "inherit", padding: 0,
                  }}
                >×</button>
              )}
            </div>
          );
        })}
      </div>
      {canEdit && phases.length < 4 && (
        <div style={{ display: "flex", gap: 6, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input style={{ ...inpStyle, flex: "1 1 140px", minWidth: 0, borderRadius: 4 }} value={name} onChange={(e) => setName(e.target.value)} placeholder={t.shootPhaseNamePh} onKeyDown={(e) => { if (e.key === "Enter" && name.trim()) { onAdd(name.trim()); setName(""); } }} />
          <button type="button" style={{ ...pBtn(!name.trim()), borderRadius: 4 }} disabled={!name.trim()} onClick={() => { onAdd(name.trim()); setName(""); }}>+ {t.addShootPhase}</button>
          <span style={{ fontSize: 10, color: "var(--usunezumi)" }}>{t.maxPhasesHint}</span>
        </div>
      )}
      {pendingDelete && (
        <Modal title={t.deleteShootPhaseTitle} onClose={() => setPendingDelete(null)}>
          <p style={{ fontSize: 13, lineHeight: 1.65, color: "var(--sumi)", margin: "0 0 18px" }}>
            {t.deleteShootPhaseConfirm.replace("{name}", pendingDelete.name)}
          </p>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button type="button" onClick={() => setPendingDelete(null)} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer", borderRadius: 4 }}>{t.cancel}</button>
            <button type="button" onClick={() => { onDelete(pendingDelete.id); setPendingDelete(null); }} style={{ ...dBtn, borderRadius: 4, padding: "8px 16px" }}>{t.delete}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function HotelMasterForm({ init, onSave, onClose, t, shootPhases }) {
  const blank = { name: "", address: "", tel: "", shoot_phase_id: "", check_in_time: "15:00", check_out_time: "11:00", inventory_enabled: false, room_type_inventory: {} };
  const [f, setF] = useState(init ? { ...blank, ...init, shoot_phase_id: init.shoot_phase_id || "", check_in_time: init.check_in_time || "15:00", check_out_time: init.check_out_time || "11:00", inventory_enabled: init.inventory_enabled || false, room_type_inventory: init.room_type_inventory || {} } : blank);
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

  const initRates = init?.room_type_rates || {};
  const isInitUniform = "All" in initRates;
  const [uniformPrice, setUniformPrice] = useState(isInitUniform);
  const [uniformRate, setUniformRate] = useState(String(initRates["All"] ?? ""));
  const [typeRates, setTypeRates] = useState(
    Object.fromEntries(ROOM_TYPES_FOR_RATES.map((r) => [r, String(initRates[r] ?? "")]))
  );
  const [customTypes, setCustomTypes] = useState(() =>
    Object.entries(initRates)
      .filter(([k, v]) => k !== "All" && !ROOM_TYPES_FOR_RATES.includes(k) && v != null && v !== "")
      .map(([name, price]) => ({ name, price: String(price) }))
  );

  const buildRates = () => {
    if (uniformPrice) return uniformRate !== "" ? { All: +uniformRate } : {};
    const out = {};
    Object.entries(typeRates).forEach(([k, v]) => { if (v !== "") out[k] = +v; });
    customTypes.forEach(({ name, price }) => {
      const n = (name || "").trim();
      if (n && price !== "") out[n] = +price;
    });
    return out;
  };

  const buildInventory = () => {
    const src = f.room_type_inventory || {};
    const validKeys = uniformPrice ? ["All"] : [...ROOM_TYPES_FOR_RATES, ...customTypes.map((c) => c.name).filter(Boolean)];
    const out = {};
    validKeys.forEach((k) => { if (src[k] != null && src[k] !== "") out[k] = +src[k]; });
    return out;
  };

  return (
    <div>
      <Field label={t.hotelName}><input style={inpStyle} value={f.name} onChange={set("name")} /></Field>
      <Field label={t.hotelAddr}><input style={inpStyle} value={f.address} onChange={set("address")} /></Field>
      <Field label={t.hotelTel}><input style={inpStyle} value={f.tel} onChange={set("tel")} /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 4 }}>
        <Field label={t.checkInTime}>
          <input type="time" style={inpStyle} value={f.check_in_time || "15:00"} onChange={set("check_in_time")} />
          <p style={{ fontSize: 10, color: "var(--nezumi)", marginTop: 4, margin: "4px 0 0" }}>{"未填預設 15:00"}</p>
        </Field>
        <Field label={t.checkOutTime}>
          <input type="time" style={inpStyle} value={f.check_out_time || "11:00"} onChange={set("check_out_time")} />
          <p style={{ fontSize: 10, color: "var(--nezumi)", marginTop: 4, margin: "4px 0 0" }}>{"未填預設 11:00"}</p>
        </Field>
      </div>
      {shootPhases?.length > 0 && (
        <Field label={t.assignShootPhase}>
          <select style={inpStyle} value={f.shoot_phase_id || ""} onChange={(e) => setF((p) => ({ ...p, shoot_phase_id: e.target.value }))}>
            <option value="">{t.shootPhaseUnset}</option>
            {shootPhases.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </Field>
      )}

      <div style={{ marginTop: 18, borderTop: "1px solid var(--keisenL)", paddingTop: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <div style={{ width: 3, height: 14, background: "var(--asagi)", borderRadius: 2 }} />
          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", color: "var(--sumi)" }}>{t.roomTypeRates}</span>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--nezumi)", cursor: "pointer", marginLeft: "auto" }}>
            <input type="checkbox" checked={uniformPrice} onChange={(e) => setUniformPrice(e.target.checked)} />
            {t.allSamePrice}
          </label>
        </div>
        {uniformPrice ? (
          <Field label={t.pricePerNight}>
            <input type="number" min="0" style={inpStyle} placeholder="0" value={uniformRate} onChange={(e) => setUniformRate(e.target.value)} />
          </Field>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {ROOM_TYPES_FOR_RATES.map((rt) => (
              <Field key={rt} label={rt}>
                <input type="number" min="0" style={inpStyle} placeholder="0"
                  value={typeRates[rt] || ""}
                  onChange={(e) => setTypeRates((p) => ({ ...p, [rt]: e.target.value }))} />
              </Field>
            ))}
          </div>
        )}
        {!uniformPrice && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: "var(--sumi)", letterSpacing: "0.04em" }}>{t.hotelCustomRoomTypes}</span>
            <button type="button" style={{ ...aBtn, margin: 0, fontSize: 10 }} onClick={() => setCustomTypes((p) => [...p, { name: "", price: "" }])}>{t.addCustomRoomType}</button>
          </div>
          {customTypes.length === 0 ? (
            <p style={{ fontSize: 10, color: "var(--usunezumi)", margin: 0, lineHeight: 1.5 }}>{t.hotelCustomRoomTypesHint}</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {customTypes.map((row, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 120px 32px", gap: 8, alignItems: "end" }}>
                  <Field label={i === 0 ? t.customRoomTypeName : ""}>
                    <input style={inpStyle} value={row.name} placeholder="和洋室 / 連通房…"
                      onChange={(e) => setCustomTypes((p) => p.map((x, j) => j === i ? { ...x, name: e.target.value } : x))} />
                  </Field>
                  <Field label={i === 0 ? t.pricePerNight : ""}>
                    <input type="number" min="0" style={inpStyle} placeholder="0" value={row.price}
                      onChange={(e) => setCustomTypes((p) => p.map((x, j) => j === i ? { ...x, price: e.target.value } : x))} />
                  </Field>
                  <button type="button" style={{ ...dBtn, margin: 0, padding: "8px 0", height: 38 }} aria-label="remove"
                    onClick={() => setCustomTypes((p) => p.filter((_, j) => j !== i))}>×</button>
                </div>
              ))}
            </div>
          )}
        </div>
        )}
        <p style={{ fontSize: 10, color: "var(--usunezumi)", margin: "8px 0 0", lineHeight: 1.5 }}>{t.dateExceptionHint}</p>
      </div>

      <div style={{ marginTop: 18, borderTop: "1px solid var(--keisenL)", paddingTop: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <div style={{ width: 3, height: 14, background: "var(--kincha)", borderRadius: 2 }} />
          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", color: "var(--sumi)" }}>庫存管理</span>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--nezumi)", cursor: "pointer", marginLeft: "auto" }}>
            <input type="checkbox" checked={!!f.inventory_enabled} onChange={(e) => setF((p) => ({ ...p, inventory_enabled: e.target.checked }))} />
            啟用庫存管控
          </label>
        </div>
        {f.inventory_enabled && (
          <div>
            <p style={{ fontSize: 10, color: "var(--usunezumi)", margin: "0 0 10px", lineHeight: 1.5 }}>為每個房型填入可用間數。留空表示不限制。</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              {(uniformPrice ? ["All"] : [...ROOM_TYPES_FOR_RATES, ...customTypes.map((c) => c.name).filter(Boolean)]).map((rt) => (
                <Field key={rt} label={rt === "All" ? "所有房型" : rt}>
                  <input type="number" min="0" style={inpStyle} placeholder="不限"
                    value={f.room_type_inventory?.[rt] ?? ""}
                    onChange={(e) => setF((p) => ({ ...p, room_type_inventory: { ...p.room_type_inventory, [rt]: e.target.value === "" ? undefined : +e.target.value } }))} />
                </Field>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
        <button type="button" onClick={onClose} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer" }}>{t.cancel}</button>
        <button type="button" onClick={() => onSave({ ...f, room_type_rates: buildRates(), shoot_phase_id: f.shoot_phase_id || null, check_in_time: f.check_in_time || "15:00", check_out_time: f.check_out_time || "11:00", inventory_enabled: f.inventory_enabled || false, room_type_inventory: buildInventory() })} disabled={!f.name.trim()} style={pBtn(!f.name.trim())}>{t.save}</button>
      </div>
    </div>
  );
}

// 配房輔助：判斷兩段住宿是否同飯店且日期重疊
function staysOverlap(a, b) {
  return a.hotel_id && b.hotel_id && String(a.hotel_id) === String(b.hotel_id) &&
    a.check_in < b.check_out && b.check_in < a.check_out;
}

function RoommateModal({ pid, persons, roommates, stays, onSave, onClose, t }) {
  const current = roommates.filter((r) => r.person_id === pid).map((r) => r.partner_id);
  const [selected, setSelected] = useState(current);
  const [showAll, setShowAll] = useState(false);
  const person = persons.find((p) => p.id === pid);
  const myStays = stays.filter((s) => s.person_id === pid);

  // Smart filter: only persons with overlapping hotel stays
  const sameHotelIds = useMemo(() => {
    if (!myStays.length) return new Set();
    return new Set(
      persons
        .filter((p) => p.id !== pid)
        .filter((p) => stays.filter((s) => s.person_id === p.id).some((s) => myStays.some((ms) => staysOverlap(ms, s))))
        .map((p) => p.id)
    );
  }, [pid, myStays, persons, stays]);

  const candidates = showAll
    ? persons.filter((p) => p.id !== pid)
    : persons.filter((p) => p.id !== pid && (sameHotelIds.has(p.id) || selected.includes(p.id)));

  const toggle = (id) => setSelected((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);

  return (
    <Modal title={`${t.roommateSet} — ${person?.name_kanji || ""}`} onClose={onClose}>
      {/* My stays context */}
      {myStays.length > 0 && (
        <div style={{ background: "var(--moegi3)", border: "1px solid rgba(43,90,76,.15)", borderRadius: 6, padding: "8px 12px", marginBottom: 12, fontSize: 11, color: "var(--moegi)", lineHeight: 1.6 }}>
          {myStays.map((s) => <div key={s.id}>{s.hotelName || s.hotel_id} · {s.check_in} – {s.check_out} ({s.roomLabel || s.room_type})</div>)}
        </div>
      )}
      {/* Filter toggle */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 10.5, color: "var(--usunezumi)" }}>
          {showAll ? `全部 ${persons.length - 1} 人` : `同飯店重疊日期 ${sameHotelIds.size} 人`}
        </span>
        <button type="button" onClick={() => setShowAll((v) => !v)}
          style={{ fontSize: 10.5, background: "none", border: "none", cursor: "pointer", color: "var(--moegi)", textDecoration: "underline", fontFamily: "'Noto Sans JP',sans-serif" }}>
          {showAll ? "只顯示同飯店" : "顯示全部"}
        </button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto" }}>
        {candidates.length === 0 && (
          <div style={{ padding: "20px", textAlign: "center", color: "var(--usunezumi)", fontSize: 12 }}>
            {showAll ? "無其他成員" : "無同飯店重疊住宿成員，請點「顯示全部」"}
          </div>
        )}
        {candidates.map((p) => {
          const pStays = stays.filter((s) => s.person_id === p.id && myStays.some((ms) => staysOverlap(ms, s)));
          const isSelected = selected.includes(p.id);
          return (
            <label key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", border: `1px solid ${isSelected ? "var(--moegi)" : "var(--keisenM)"}`, borderRadius: 6, cursor: "pointer", background: isSelected ? "var(--moegi3)" : "var(--shiro)", transition: "all .12s" }}>
              <input type="checkbox" checked={isSelected} onChange={() => toggle(p.id)} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name_kanji}
                  <span style={{ fontSize: 11, color: "var(--nezumi)", fontWeight: 400, marginLeft: 8 }}>{p.dept}</span>
                </div>
                {pStays.length > 0 && <div style={{ fontSize: 10, color: "var(--moegi)", marginTop: 1 }}>{pStays[0].hotelName || ""} {pStays[0].check_in}–{pStays[0].check_out}</div>}
              </div>
            </label>
          );
        })}
      </div>
      <div style={{ marginTop: 10, padding: "8px 12px", background: "var(--washi)", fontSize: 11.5, borderRadius: 4, color: "var(--sumi)" }}>
        {selected.length === 0 ? <span style={{ color: "var(--usunezumi)" }}>{t.roommateNone}</span>
          : selected.map((id) => persons.find((p) => p.id === id)?.name_kanji).filter(Boolean).join("、")}
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 14 }}>
        <button type="button" onClick={onClose} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer" }}>{t.cancel}</button>
        <button type="button" onClick={() => onSave(pid, selected)} style={pBtn(false)}>{t.save}</button>
      </div>
    </Modal>
  );
}

function MemberManager({ project, user, canManage, onClose, t }) {
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [userId, setUserId] = useState("");
  const [role, setRole] = useState("editor");
  const [saving, setSaving] = useState(false);
  const [toastMsg, showToast] = useToast();
  const load = async () => {
    setLoading(true);
    try { setMembers(await api.get("user_projects", `&project_id=eq.${project.id}`)); } catch (e) { showToast(e.message); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);
  const addMember = async () => {
    if (!userId.trim()) return;
    setSaving(true);
    try {
      if (members.find((m) => m.user_id === userId.trim())) { showToast(t.memberAlready); return; }
      await api.insert("user_projects", { user_id: userId.trim(), project_id: project.id, role });
      showToast(t.saved); setUserId(""); load();
    } catch (e) { showToast(e.message); } finally { setSaving(false); }
  };
  return (
    <Modal title={`${t.members} — ${project.name}`} onClose={onClose} wide>
      <Toast msg={toastMsg} />
      <div style={{ background: "var(--washi)", padding: 18, marginBottom: 20, border: "1px solid var(--keisenL)" }}>
        <div style={{ fontWeight: 600, fontSize: 11, marginBottom: 8 }}>{t.memberAdd}</div>
        <p style={{ fontSize: 12, color: "var(--nezumi)", marginBottom: 10 }}>{t.memberUidHint}</p>

          <input style={{ ...inpStyle, flex: 2, minWidth: 200 }} value={userId} onChange={(e) => setUserId(e.target.value)} placeholder="UUID" />
          <select value={role} onChange={(e) => setRole(e.target.value)} style={inpStyle}>
            <option value="admin">{t.role_admin}</option>
            <option value="editor">{t.role_editor}</option>
            <option value="viewer">{t.role_viewer}</option>
          </select>
          <button type="button" onClick={addMember} disabled={saving || !userId.trim()} style={pBtn(saving || !userId.trim())}>{t.memberAddBtn}</button>
        </div>
      </div>
      <div style={{ fontWeight: 600, fontSize: 11, marginBottom: 12 }}>{t.memberCurrent.replace("{n}", members.length)}</div>
      {loading ? <div style={{ textAlign: "center", color: "var(--usunezumi)" }}>…</div> : members.map((m) => {
        const isMe = m.user_id === user.id;
        const canModify = canManage && !isMe && m.role !== "owner";
        return (
          <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: 12, border: "1px solid var(--keisenL)", marginBottom: 8 }}>
            <div>
              <span style={{ fontSize: 11, padding: "2px 8px", ...(ROLE_COLORS[m.role] || ROLE_COLORS.viewer) }}>{t[`role_${m.role}`] || m.role}</span>
              {isMe && <span style={{ fontSize: 9, marginLeft: 6, color: "var(--moegi)" }}>{t.me}</span>}
              <div style={{ fontSize: 11, color: "var(--usunezumi)", fontFamily: "monospace", marginTop: 4 }}>{m.user_id}</div>
            </div>
            {canModify && (
              <div style={{ display: "flex", gap: 8 }}>
                <select value={m.role} onChange={async (e) => { await api.update("user_projects", m.id, { role: e.target.value }); load(); }} style={{ ...inpStyle, width: "auto" }}>
                  <option value="admin">{t.role_admin}</option>
                  <option value="editor">{t.role_editor}</option>
                  <option value="viewer">{t.role_viewer}</option>

                <button type="button" style={dBtn} onClick={async () => { if (window.confirm(t.deleteConfirm)) { await api.delete("user_projects", m.id); load(); } }}>{t.delete}</button>
              </div>
            )}

        );
      })}
      <p style={{ fontSize: 11, color: "var(--kincha)", marginTop: 12 }}>{t.memberUidLabel}: {t.memberUidInfo}</p>
    </Modal>

}

  return (
    <div style={wrap}><div style={card}>

      </div>
      {error && <div style={{ background: "rgba(173,48,48,.06)", color: "var(--shu)", padding: "10px 14px", marginBottom: 18, fontSize: 12, borderRadius: 6, border: "1px solid rgba(173,48,48,.15)" }}>{error}</div>}
      <Field label={t.newPw}><input style={inpStyle} type="password" value={pw} onChange={(e) => setPw(e.target.value)} className="wa-input" /></Field>
      <Field label={t.confirmNewPw}><input style={inpStyle} type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleReset()} className="wa-input" /></Field>
      <button type="button" onClick={handleReset} disabled={loading} style={{ ...pBtn(loading), width: "100%", padding: "11px 0", marginTop: 4 }}>
