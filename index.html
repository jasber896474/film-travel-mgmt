function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [message, setMessage] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [lang, setLang] = useState(() => localStorage.getItem("app_lang") || "zh-TW");
  const t = T[lang];
  const card = {
    background: "var(--shiro)", borderRadius: 12, padding: "44px 48px",
    width: 440, maxWidth: "95vw",
    boxShadow: "0 24px 80px rgba(0,0,0,.26), 0 0 0 1px rgba(255,255,255,.06)",
    maxHeight: "92vh", overflowY: "auto",
  };
  const wrap = {
    minHeight: "100vh",
    background: "var(--sumiMid)",
    backgroundImage: [
      "radial-gradient(ellipse 80% 60% at 20% 80%, rgba(43,90,76,.22) 0%, transparent 60%)",
      "radial-gradient(ellipse 60% 40% at 80% 20%, rgba(42,94,128,.16) 0%, transparent 55%)",
    ].join(","),
    display: "flex", alignItems: "center", justifyContent: "center",
    fontFamily: "'Noto Sans JP',sans-serif",
  };

  const handleLogin = async () => {
    if (!email.trim() || !pw.trim()) { setError(t.errEmailPw); return; }
    setLoading(true); setError("");
    try {
      const res = await api.login(email.trim(), pw);
      if (res.access_token) {
        saveSession(res);
        _token = res.access_token;
        localStorage.setItem("app_lang", lang);
        onLogin(res.access_token, res.user, lang);
      } else if (res.error_code === "email_not_confirmed") {
        setError(t.errEmailNotConfirmed);
      } else setError(res.error_description || res.msg || res.message || t.errLoginFailed);
    } catch (e) { setError(String(e.message)); } finally { setLoading(false); }
  };

  const handleRegister = async () => {
    if (!email.trim() || !pw.trim()) { setError(t.errEmailPw); return; }
    if (pw !== pw2) { setError(t.errPwMatch); return; }
    if (pw.length < 6) { setError(t.errPwLen); return; }
    setLoading(true); setError("");
    try {
      const res = await api.signup(email.trim(), pw);
      if (res.error || (res.code && res.code >= 400)) { setError(res.error?.message || res.msg || res.message || t.registerFailed); return; }
      const userId = res.id || res.user?.id || null;
      const hasSession = !!res.access_token;
      const reqBody = {
        email: email.trim(),
        display_name: displayName.trim() || null,
        message: message.trim() || null,
        status: "pending",
      };
      // 未登入 session（需信箱驗證）時 auth.uid() 為空，RLS 只允許 user_id 為 null
      if (hasSession && userId) reqBody.user_id = userId;
      const reqToken = res.access_token || SUPABASE_KEY;
      const reqRes = await fetch(`${SUPABASE_URL}/rest/v1/user_requests`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${reqToken}`, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(reqBody),
      });
      if (!reqRes.ok) throw new Error(parseApiError(await reqRes.text(), reqRes.status));
      setMode("verify");
    } catch (e) { setError(String(e.message) || t.registerFailed); } finally { setLoading(false); }
  };

  if (mode === "verify") return (
    <div style={wrap}><div style={card}>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 40, lineHeight: 1, color: "var(--moegi2)", marginBottom: 12, fontFamily: "'Noto Serif JP',serif" }}>映</div>
        <h2 style={{ fontSize: 18, color: "var(--sumi)", fontFamily: "'Noto Serif JP',serif", fontWeight: 600, marginBottom: 0 }}>{t.verifyTitle}</h2>
      </div>
      <div style={{ background: "var(--moegi3)", border: "1px solid rgba(43,90,76,.18)", borderRadius: 8, padding: "16px 18px", marginBottom: 18 }}>
        <p style={{ fontSize: 13, color: "var(--moegi)", marginBottom: 4, fontWeight: 600 }}>{email}</p>
        <p style={{ fontSize: 12, color: "var(--nezumi)", lineHeight: 1.7, margin: 0 }}>{t.verifyHint}</p>
      </div>
      <p style={{ fontSize: 11, color: "var(--nezumi)", marginBottom: 20, lineHeight: 1.6 }}>{t.verifyContact}</p>
      <button type="button" onClick={() => setMode("login")} style={{ ...pBtn(false), width: "100%" }}>{t.toLoginBtn}</button>
    </div></div>
  );

  return (
    <div style={wrap}><div style={card}>
      {/* ── Brand Mark ── */}
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 42, lineHeight: 1, color: "var(--moegi)", marginBottom: 10, fontFamily: "'Noto Serif JP',serif", letterSpacing: "-0.02em" }}>映</div>
        <h1 style={{ fontSize: 16, fontWeight: 600, color: "var(--sumi)", margin: 0, letterSpacing: "0.08em", fontFamily: "'Noto Serif JP',serif" }}>{t.appName}</h1>
        <p style={{ fontSize: 11, color: "var(--usunezumi)", margin: "5px 0 0", letterSpacing: "0.04em" }}>{mode === "login" ? t.loginTitle : t.registerTitle}</p>
      </div>

      {/* ── Lang lock selector (locked after login) ── */}
      <div style={{ marginBottom: 20 }}>
        <label style={{ display: "block", fontSize: 9.5, fontWeight: 700, color: "var(--nezumi)", marginBottom: 6, letterSpacing: "0.16em", textTransform: "uppercase" }}>{t.langSelectLabel || "Language / 語言 / 言語"}</label>
        <select style={{ ...inpStyle, fontSize: 12 }} value={lang} onChange={(e) => { setLang(e.target.value); localStorage.setItem("app_lang", e.target.value); }} className="wa-input">
          {Object.entries(LANGS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
        </select>
        <p style={{ fontSize: 9.5, color: "var(--usunezumi)", marginTop: 5, lineHeight: 1.5, margin: "5px 0 0" }}>{t.langLockHint || "登入後語系將固定，如需切換請重新登入"}</p>
      </div>

      {/* ── Tab pills ── */}
      <div style={{ display: "flex", background: "var(--washi)", borderRadius: 8, padding: 4, marginBottom: 24 }}>
        {[["login", t.loginBtn], ["register", t.registerTitle]].map(([m, lb]) => (
          <button key={m} type="button" onClick={() => { setMode(m); setError(""); }} style={{
            flex: 1, padding: "8px 0", border: "none", cursor: "pointer",
            fontFamily: "'Noto Sans JP',sans-serif", fontSize: 13,
            fontWeight: mode === m ? 600 : 400,
            color: mode === m ? "var(--sumi)" : "var(--nezumi)",
            background: mode === m ? "var(--shiro)" : "transparent",
            borderRadius: 6,
            boxShadow: mode === m ? "0 1px 4px rgba(0,0,0,.1)" : "none",
            transition: "all .18s",
          }}>{lb}</button>
        ))}
      </div>

      {error && <div style={{ background: "rgba(173,48,48,.06)", color: "var(--shu)", padding: "10px 14px", marginBottom: 18, fontSize: 12, borderRadius: 6, border: "1px solid rgba(173,48,48,.15)", lineHeight: 1.5 }}>{error}</div>}

      {mode === "login" ? (
        <>
          <Field label={t.loginEmail}><input style={inpStyle} type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} className="wa-input" /></Field>
          <Field label={t.loginPw}><input style={inpStyle} type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} className="wa-input" /></Field>
          <button type="button" onClick={handleLogin} disabled={loading} style={{ ...pBtn(loading), width: "100%", marginTop: 10, padding: "11px 0" }}>
            {loading ? <span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> : t.loginBtn}
          </button>
          <div style={{ textAlign: "center", marginTop: 14 }}>
            <button type="button" onClick={() => { setMode("forgot"); setError(""); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 11.5, color: "var(--nezumi)", textDecoration: "underline", fontFamily: "'Noto Sans JP',sans-serif" }}>{t.forgotPw}</button>
          </div>
          <p style={{ fontSize: 10.5, color: "var(--nezumi)", textAlign: "center", marginTop: 10, lineHeight: 1.6 }}>{t.loginHint}</p>
        </>
      ) : mode === "forgot" ? (
        <ForgotPasswordPanel t={t} lang={lang} onBack={() => { setMode("login"); setError(""); }} />
      ) : (
        <>
          <Field label={t.loginEmail}><input style={inpStyle} type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="wa-input" /></Field>
          <Field label={t.loginPw}><input style={inpStyle} type="password" value={pw} onChange={(e) => setPw(e.target.value)} className="wa-input" /></Field>
          <Field label={t.registerPwConfirm}><input style={inpStyle} type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} className="wa-input" /></Field>
          <Field label={t.registerName}><input style={inpStyle} value={displayName} onChange={(e) => setDisplayName(e.target.value)} className="wa-input" /></Field>
          <Field label={t.registerMessage}><textarea style={{ ...inpStyle, resize: "none", lineHeight: 1.6 }} rows={2} value={message} onChange={(e) => setMessage(e.target.value)} placeholder={t.registerMessagePh} className="wa-input" /></Field>
          <button type="button" onClick={handleRegister} disabled={loading} style={{ ...pBtn(loading), width: "100%", marginTop: 10, padding: "11px 0" }}>
            {loading ? <span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> : t.registerBtn}
          </button>
          <p style={{ fontSize: 11, color: "var(--usunezumi)", textAlign: "center", marginTop: 14, lineHeight: 1.6 }}>{t.verifyContact}</p>
        </>
      )}
    </div></div>
  );
}

function ProjectSelector({ user, isSystemOwner, lang, theme, onThemeChange, onLangChange, onSelect, lastActivityRef }) {
  const t = T[lang];
  const [projects, setProjects] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newDesc, setNewDesc] = useState("");
  const [saving, setSaving] = useState(false);
  const [requests, setRequests] = useState([]);
  const [approveModal, setApproveModal] = useState(null);
  const [toastMsg, showToast] = useToast();

  const load = async () => {
    setLoading(true);
    try {
      if (isSystemOwner) {
        const all = await api.get("projects");
        setProjects(all.map((p) => ({ id: p.id, project_id: p.id, role: "owner", projects: p })));
      } else {
        const up = await api.get("user_projects", `&user_id=eq.${user.id}`);
        if (!up.length) { setProjects([]); setLoading(false); return; }
        const ids = up.map((r) => r.project_id);
        const projs = await sb(`projects?id=in.(${ids.join(",")})`);
        setProjects(up.map((r) => ({ ...r, projects: projs.find((p) => p.id === r.project_id) || { id: r.project_id, name: "—" } })));
      }
    } catch (e) { showToast(e.message); } finally { setLoading(false); }
  };

  const loadRequests = async () => {
    if (!isSystemOwner) return;
    try {
      setRequests(await api.get("user_requests", "&status=eq.pending&order=created_at.desc"));
    } catch (e) {
      console.error(e);
      showToast(e.message || String(e));
    }
  };

  useEffect(() => { load(); if (isSystemOwner) loadRequests(); }, [isSystemOwner]);

  const createProject = async () => {
    if (!newName.trim()) return;
    setSaving(true);
    let createdProjId = null;
    try {
      const inserted = await api.insert("projects", {
        name: newName.trim(),
        description: newDesc || null,
        created_by: user.id,
        base_currency: "TWD",
        display_currency: "TWD",
        exchange_rate: 1,
      });
      const proj = Array.isArray(inserted) ? inserted[0] : inserted;
      if (!proj?.id) throw new Error("建立專案失敗：伺服器未回傳專案資料");
      createdProjId = proj.id;
      const creatorRole = isSystemOwner ? "owner" : "admin";
      try {
        await api.insert("user_projects", { user_id: user.id, project_id: proj.id, role: creatorRole });
      } catch (linkErr) {
        if (creatorRole === "owner") {
          await api.insert("user_projects", { user_id: user.id, project_id: proj.id, role: "admin" });
        } else throw linkErr;
      }
      showToast(t.saved);
      setShowNew(false);
      setNewName("");
      setNewDesc("");
      load();
    } catch (e) {
      if (createdProjId) {
        try { await api.delete("projects", createdProjId); } catch (_) { /* rollback best-effort */ }
      }
      showToast(e.message || String(e));
    } finally {
      setSaving(false);
    }
  };

  const deleteProject = async (projId) => {
    if (!window.confirm(t.deleteProjConfirm)) return;
    try {
      await Promise.all([
        "persons", "flights", "stays", "hotels", "pricing_rules", "roommates", "vehicles", "vehicle_assignments", "user_projects", "daily_dispatches",
      ].map((tbl) => api.deleteWhere(tbl, "project_id", projId).catch(() => {})));
      await api.delete("projects", projId);
      showToast(t.deleted); load();
    } catch (e) { showToast(e.message); }
  };

  const confirmApprove = async () => {
    const { req, projectId, role } = approveModal;
    if (!projectId) { showToast(t.selectProject); return; }
    try {
      await api.update("user_requests", req.id, { status: "approved" });
      let uid = req.user_id;
      if (!uid && req.email) {
        const found = await api.rpc("find_user_id_by_email", { p_email: req.email.trim() });
        uid = typeof found === "string" ? found : (Array.isArray(found) ? found[0] : found?.id || null);
      }
      if (uid) {
        const existing = await api.get("user_projects", `&user_id=eq.${uid}&project_id=eq.${projectId}`);
        if (!existing.length) await api.insert("user_projects", { user_id: uid, project_id: projectId, role });
        else await api.update("user_projects", existing[0].id, { role });
      }
      showToast(t.approved.replace("{email}", req.email));
      setApproveModal(null); loadRequests();
    } catch (e) { showToast(e.message); }
  };

  const hdrBtn = { background: "var(--hdrBtnBg)", color: "var(--hdrText)", border: "1px solid var(--hdrBtnBorder)", padding: "7px 14px", cursor: "pointer", fontSize: 11.5, borderRadius: 4, fontFamily: "'Noto Sans JP',sans-serif", transition: "background .15s" };
  const tSel = T[lang];
  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)", fontFamily: "'Noto Sans JP',sans-serif" }}>
      <Toast msg={toastMsg} />
      {/* ── Header ── */}
      <header style={{
        background: "var(--sumiMid)",
        backgroundImage: "var(--headerGrad)",
        padding: "16px 32px", color: "var(--washi)",
        display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8,
        borderBottom: "1px solid rgba(255,255,255,.04)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ fontSize: 28, fontFamily: "'Noto Serif JP',serif", color: "var(--moegi2)", lineHeight: 1 }}>映</span>
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: "0.06em" }}>{t.appName}</div>
            <div style={{ fontSize: 10, opacity: 0.5, marginTop: 2, letterSpacing: "0.04em" }}>
              {user.email}
              {isSystemOwner && <span style={{ marginLeft: 8, padding: "1px 8px", background: "var(--moegi3)", color: "var(--moegi2)", borderRadius: 10, fontSize: 9, fontWeight: 700, letterSpacing: "0.12em" }}>{t.role_owner}</span>}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <IdleBadge lastActivityRef={lastActivityRef} t={t} baseStyle={hdrBtn} />
          <ThemeToggle theme={theme} onChange={onThemeChange} t={tSel} />
          <button type="button" onClick={() => { api.logout(); clearSession(); window.location.reload(); }} style={hdrBtn}>{t.logout}</button>
        </div>
      </header>

      {/* ── Approval requests ── */}
      {isSystemOwner && (
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "28px 24px 0" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <div style={{ width: 3, height: 16, background: "var(--shu)", borderRadius: 2 }} />
            <h2 style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--sumi)", margin: 0 }}>{t.approveTitle}</h2>
            {requests.length > 0 && <span style={{ background: "var(--shu)", color: "var(--shiro)", padding: "2px 8px", fontSize: 10, borderRadius: 10, fontWeight: 700 }}>{requests.length}</span>}
          </div>
          {requests.length === 0 ? (
            <p style={{ color: "var(--usunezumi)", fontSize: 12, marginBottom: 16 }}>{t.noRequests}</p>
          ) : requests.map((req) => (
            <div key={req.id} style={{ background: "var(--shiro)", padding: "16px 20px", marginBottom: 10, borderRadius: 8, border: "1px solid var(--keisenL)", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 10, boxShadow: "0 1px 4px rgba(0,0,0,.04)" }}>
              <div>
                <strong style={{ fontSize: 13, color: "var(--sumi)" }}>{req.display_name || t.noName}</strong>
                <span style={{ color: "var(--nezumi)", fontSize: 12, marginLeft: 8 }}>{req.email}</span>
                {req.message && <div style={{ fontSize: 12, color: "var(--nezumi)", marginTop: 5, lineHeight: 1.5 }}>{req.message}</div>}
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
                <button type="button" onClick={async () => { const all = await api.get("projects"); setApproveModal({ req, projects: all, projectId: all[0]?.id || "", role: "viewer" }); }} style={pBtn(false)}>{t.approve}</button>
                <button type="button" onClick={async () => { if (window.confirm(t.rejectConfirm.replace("{email}", req.email))) { await api.update("user_requests", req.id, { status: "rejected" }); showToast(t.rejected.replace("{email}", req.email)); loadRequests(); } }} style={dBtn}>{t.reject}</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ── Project list ── */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "36px 24px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 28 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 3, height: 20, background: "var(--moegi)", borderRadius: 2 }} />
            <h2 style={{ fontSize: 20, fontWeight: 300, color: "var(--sumi)", fontFamily: "'Noto Serif JP',serif", letterSpacing: "0.04em", margin: 0 }}>{t.projects}</h2>
          </div>
          <button type="button" onClick={() => setShowNew(true)} style={pBtn(false)}>{t.newProject}</button>
        </div>

        {loading ? (
          <p style={{ textAlign: "center", color: "var(--usunezumi)", padding: 60 }}>{t.loading}</p>
        ) : projects.length === 0 ? (
          <div style={{ textAlign: "center", padding: "70px 40px", background: "var(--shiro)", borderRadius: 10, border: "1px solid var(--keisenL)" }}>
            <div style={{ fontSize: 32, fontFamily: "'Noto Serif JP',serif", color: "var(--usunezumi)", marginBottom: 16 }}>映</div>
            <p style={{ marginBottom: 6, fontSize: 14, color: "var(--sumi)" }}>{t.noProject}</p>
            <p style={{ fontSize: 12, color: "var(--nezumi)", marginBottom: 28, lineHeight: 1.6 }}>{t.noProjectHint}</p>
            <button type="button" onClick={() => setShowNew(true)} style={pBtn(false)}>{t.firstProject}</button>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 18 }}>
            {projects.map((up) => (
              <div key={up.id} style={{
                background: "var(--shiro)", borderRadius: 10, overflow: "hidden",
                boxShadow: "0 1px 3px rgba(0,0,0,.05), 0 4px 20px rgba(0,0,0,.05), 0 0 0 1px " + "var(--keisenL)",
                transition: "box-shadow .2s, transform .15s",
              }} className="proj-card">
                {/* Color band based on role */}
                <div style={{ height: 4, background: up.role === "owner" ? "var(--kincha)" : up.role === "admin" ? "var(--shu)" : up.role === "editor" ? "var(--moegi)" : "var(--usunezumi)" }} />
                <div style={{ padding: "20px 22px" }}>
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontWeight: 600, fontSize: 16, color: "var(--sumi)", letterSpacing: "0.02em", marginBottom: 5, fontFamily: "'Noto Serif JP',serif" }}>{up.projects?.name || "—"}</div>
                    {up.projects?.description && <div style={{ fontSize: 12, color: "var(--nezumi)", lineHeight: 1.5 }}>{up.projects.description}</div>}
                  </div>
                  <span style={{ fontSize: 10, padding: "3px 10px", borderRadius: 20, fontWeight: 700, letterSpacing: "0.08em", ...(ROLE_COLORS[up.role] || ROLE_COLORS.viewer) }}>{t[`role_${up.role}`] || up.role}</span>
                </div>
                <div style={{ padding: "12px 22px 20px", display: "flex", gap: 8 }}>
                  <button type="button" onClick={() => onSelect(up.projects, up.role)} style={{ ...pBtn(false), flex: 1, padding: "9px 0", fontSize: 12.5 }}>{t.openProject}</button>
                  {(isSystemOwner || up.role === "admin" || up.role === "owner") && (
                    <button type="button" onClick={() => deleteProject(up.projects?.id || up.project_id)} style={{ ...dBtn, padding: "9px 14px" }}>×</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {approveModal && (
        <Modal title={t.approveTitle} onClose={() => setApproveModal(null)}>
          <Field label={t.approveProject}>
            <select style={inpStyle} value={approveModal.projectId} onChange={(e) => setApproveModal((m) => ({ ...m, projectId: e.target.value }))} className="wa-input">
              {approveModal.projects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label={t.approveRole}>
            <select style={inpStyle} value={approveModal.role} onChange={(e) => setApproveModal((m) => ({ ...m, role: e.target.value }))} className="wa-input">
              <option value="viewer">{t.roleViewerDesc}</option>
              <option value="editor">{t.roleEditorDesc}</option>
              <option value="admin">{t.roleAdminDesc}</option>
            </select>
          </Field>
          <p style={{ fontSize: 11.5, color: "var(--nezumi)", marginBottom: 18, lineHeight: 1.6 }}>{t.approveNote}</p>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button type="button" onClick={() => setApproveModal(null)} style={{ ...eBtn, marginRight: 0, padding: "9px 18px" }}>{t.cancel}</button>
            <button type="button" onClick={confirmApprove} style={pBtn(false)}>{t.confirmApproveBtn}</button>
          </div>
        </Modal>
      )}

      {showNew && (
        <Modal title={t.newProject} onClose={() => setShowNew(false)}>
          <Field label={t.projectName}><input style={inpStyle} value={newName} onChange={(e) => setNewName(e.target.value)} className="wa-input" /></Field>
          <Field label={t.projectDesc}><input style={inpStyle} value={newDesc} onChange={(e) => setNewDesc(e.target.value)} className="wa-input" /></Field>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 8 }}>
            <button type="button" onClick={() => setShowNew(false)} style={{ ...eBtn, marginRight: 0, padding: "9px 18px" }}>{t.cancel}</button>
            <button type="button" onClick={createProject} disabled={saving || !newName.trim()} style={pBtn(saving || !newName.trim())}>{saving ? t.creating : t.create}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ProjectApp({ project, userRole, user, isSystemOwner, lang, theme, onThemeChange, onLangChange, onBack, onProjectUpdate, lastActivityRef }) {
  const pid = project.id;
  const t = T[lang];
  const canEdit = isSystemOwner || ["owner", "admin", "editor"].includes(userRole);
  const canDelete = isSystemOwner || ["owner", "admin"].includes(userRole);
  const canManageMembers = isSystemOwner || ["owner", "admin"].includes(userRole);

  const [tab, setTab] = useState("A");
  const [accSub, setAccSub] = useState("stays");
  const [loading, setLoading] = useState(true);
  const [toastMsg, showToast] = useToast();

  const [persons, setPersons] = useState([]);
  const [flights, setFlights] = useState([]);
  const [stays, setStays] = useState([]);
  const [hotels, setHotels] = useState([]);
  const [pricingRules, setPricingRules] = useState([]);
  const [roommates, setRoommates] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [vehicleAssignments, setVehicleAssignments] = useState([]);
  const [dailyDispatches, setDailyDispatches] = useState([]);
  const [vehicleSub, setVehicleSub] = useState("config");
  const [dispatchDate, setDispatchDate] = useState(() => localDateStr());
  const [useAssignmentTable, setUseAssignmentTable] = useState(true);

  const [searchA, setSearchA] = useState("");
  const [deptA, setDeptA] = useState("");
  const [searchB, setSearchB] = useState("");
  const [deptB, setDeptB] = useState("");
  const [searchC, setSearchC] = useState("");
  const [deptC, setDeptC] = useState("");
  const [searchCHotel, setSearchCHotel] = useState("");
  const [searchCRoom, setSearchCRoom] = useState("");
  const [activeStayPhase, setActiveStayPhase] = useState("");
  const [statsDate, setStatsDate] = useState("");
  const [statsHotelId, setStatsHotelId] = useState("");
  const [searchD, setSearchD] = useState("");
  const [showFlightAdv, setShowFlightAdv] = useState(false);
  const [searchBRoman, setSearchBRoman] = useState("");
  const [searchBAirline, setSearchBAirline] = useState("");
  const [searchBStatus, setSearchBStatus] = useState("");
  const [collapsedHotels, setCollapsedHotels] = useState(() => {
    try {
      const raw = localStorage.getItem("collapsedHotelSections");
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch { return new Set(); }
  });
  const toggleHotelCollapsed = (key) => {
    setCollapsedHotels((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      try { localStorage.setItem("collapsedHotelSections", JSON.stringify([...next])); } catch {}
      return next;
    });
  };
  // 批次摺疊/展開一組 key：若全部已收起則展開全部，否則收起全部
  const setManyCollapsed = (keys) => {
    setCollapsedHotels((prev) => {
      const next = new Set(prev);
      const allCollapsed = keys.length > 0 && keys.every((k) => next.has(k));
      keys.forEach((k) => { if (allCollapsed) next.delete(k); else next.add(k); });
      try { localStorage.setItem("collapsedHotelSections", JSON.stringify([...next])); } catch {}
      return next;
    });
  };
  const [flightLegFilter, setFlightLegFilter] = useState("all");
  const [flightGroupByDept, setFlightGroupByDept] = useState(false);
  const [flightSameDiffFilter, setFlightSameDiffFilter] = useState(null);
  const [showWarnDropdown, setShowWarnDropdown] = useState(false);
  const [flightWarnFilters, setFlightWarnFilters] = useState([]);
  const warnDropdownRef = useRef(null);

  useEffect(() => {
    if (!showWarnDropdown) return;
    const handler = (e) => {
      if (warnDropdownRef.current && !warnDropdownRef.current.contains(e.target)) {
        setShowWarnDropdown(false);
      }
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [showWarnDropdown]);

  const debSearchA = useDebounced(searchA);
  const debSearchB = useDebounced(searchB);
  const debSearchC = useDebounced(searchC);

  const [selectedIds, setSelectedIds] = useState([]);
  const dragItem = useRef(null);
  const dragOver = useRef(null);
  const staffImportRef = useRef(null);
  const [staffImporting, setStaffImporting] = useState(false);

  const [personModal, setPersonModal] = useState(null);
  const [flightModal, setFlightModal] = useState(null);
  const [stayModal, setStayModal] = useState(null);
  const [hotelModal, setHotelModal] = useState(null);
  const [priceModal, setPriceModal] = useState(null);
  const [roommateModal, setRoommateModal] = useState(null);
  const [vehicleModal, setVehicleModal] = useState(null);
  const [showMembers, setShowMembers] = useState(false);
  const [showCurrency, setShowCurrency] = useState(false);
  const [addStayPerson, setAddStayPerson] = useState("");
  const [showReportExport, setShowReportExport] = useState(false);
  const [addTripVehicle, setAddTripVehicle] = useState(null);
  const [tripPerson, setTripPerson] = useState("");
  const [tripRole, setTripRole] = useState("passenger");
  // tripSegment removed — simplified direct add without segment selection
  const firstLoadDone = useRef(false);
  const contentReadyRef = useRef(false);
  const stayScrollAnchorId = useRef(null);
  const pendingScrollY = useRef(null);

  useLayoutEffect(() => {
    if (stayModal) return;
    const anchorId = stayScrollAnchorId.current;
    if (anchorId != null) {
      stayScrollAnchorId.current = null;
      const el = document.querySelector(`[data-stay-row="${CSS.escape(String(anchorId))}"]`);
      if (el) {
        el.scrollIntoView({ block: "nearest", inline: "nearest" });
        return;
      }
    }
    if (pendingScrollY.current != null) {
      const y = pendingScrollY.current;
      pendingScrollY.current = null;
      window.scrollTo(0, y);
    }
  }, [stayModal, stays, persons, flights]);

  const modalOpen = !!(personModal || flightModal || stayModal || hotelModal || priceModal || roommateModal || vehicleModal || showMembers || showCurrency || showReportExport);
  useLayoutEffect(() => {
    if (!modalOpen) return;
    const html = document.documentElement;
    const body = document.body;
    const prevHtmlOverflow = html.style.overflow;
    const prevBodyOverflow = body.style.overflow;
    html.style.overflow = "hidden";
    body.style.overflow = "hidden";
    return () => {
      html.style.overflow = prevHtmlOverflow;
      body.style.overflow = prevBodyOverflow;
    };
  }, [modalOpen]);

  const loadAll = useCallback(async () => {
    const isRefresh = firstLoadDone.current;
    const scrollY = isRefresh ? readScrollPosition() : null;
    if (!isRefresh) setLoading(true);
    try {
      const pf = `&project_id=eq.${pid}`;
      const [p, f, s, h, pr, rm, vh, va, dd] = await Promise.all([
        api.get("persons", pf + "&order=sort_order.asc,id.asc"),
        api.get("flights", pf),
        api.get("stays", pf),
        api.get("hotels", pf),
        api.get("pricing_rules", pf),
        api.get("roommates", pf),
        api.get("vehicles", pf + "&order=created_at.asc").catch(() => []),
        api.get("vehicle_assignments", pf + "&order=sort_order.asc,id.asc").catch(() => null),
        api.get("daily_dispatches", pf + "&order=dispatch_date.asc,sort_order.asc,id.asc").catch(() => []),
      ]);
      setPersons(p);
      setFlights(f); setHotels(h); setPricingRules(pr); setRoommates(rm); setVehicles(vh || []);
      let nextStays = s;
      if (canEdit && s.length && h.length) {
        try { nextStays = await persistStayAmountsFromAllocations(s, pr, h, api); } catch (_) { /* 載入時同步失敗不阻擋 */ }
      }
      setStays(nextStays);
      if (va === null) { setUseAssignmentTable(false); setVehicleAssignments([]); }
      else { setUseAssignmentTable(true); setVehicleAssignments(va); }
      setDailyDispatches(Array.isArray(dd) ? dd : []);
    } catch (e) { showToast(e.message); } finally {
      if (!isRefresh) {
        setLoading(false);
        firstLoadDone.current = true;
        contentReadyRef.current = true;
      } else if (scrollY != null) {
        pendingScrollY.current = scrollY;
      }
    }
  }, [pid, canEdit]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const getAssignmentsForVehicle = useCallback((vehicleId) => {
    if (useAssignmentTable) return vehicleAssignments.filter((a) => a.vehicle_id === vehicleId);
    const v = vehicles.find((x) => x.id === vehicleId);
    if (!v) return [];
    if (v.assignments?.length) return v.assignments.map((a, i) => ({ ...a, id: `legacy-${vehicleId}-${i}`, vehicle_id: vehicleId }));
    return legacyAssignmentsFromVehicle(v).map((a, i) => ({ ...a, id: `legacy-${vehicleId}-${i}`, vehicle_id: vehicleId }));
  }, [useAssignmentTable, vehicleAssignments, vehicles]);

  const allAssignments = useMemo(() => {
    if (useAssignmentTable) return vehicleAssignments;
    return vehicles.flatMap((v) => getAssignmentsForVehicle(v.id));
  }, [useAssignmentTable, vehicleAssignments, vehicles, getAssignmentsForVehicle]);

  // 配車卡片排序：若任一車輛已設定 sort_order，視為「已鎖定」並依此排序；
  // 否則自動排序（依車號數字優先，沒有車號的維持原始順序）
  const vehicleOrderLocked = useMemo(() => vehicles.some((v) => v.sort_order != null), [vehicles]);
  const sortedVehicles = useMemo(() => {
    if (vehicleOrderLocked) {
      return [...vehicles].sort((a, b) => (a.sort_order ?? 999999) - (b.sort_order ?? 999999));
    }
    return [...vehicles].sort((a, b) => {
      const pa = parseInt(String(a.vehicle_no ?? "").replace(/^#/, ""), 10);
      const pb = parseInt(String(b.vehicle_no ?? "").replace(/^#/, ""), 10);
      const va = !Number.isNaN(pa) ? pa : Infinity;
      const vb = !Number.isNaN(pb) ? pb : Infinity;
      return va - vb;
    });
  }, [vehicles, vehicleOrderLocked]);

  const persistVehicleOrder = async (orderedVehicles) => {
    const updates = orderedVehicles.map((v, i) => ({ id: v.id, sort_order: i }));
    setVehicles((vs) => vs.map((v) => {
      const u = updates.find((x) => x.id === v.id);
      return u ? { ...v, sort_order: u.sort_order } : v;
    }));
    try {
      await Promise.all(updates.map((u) => api.update("vehicles", u.id, { sort_order: u.sort_order })));
    } catch (e) { showToast(e.message); }
  };

  const toggleVehicleOrderLock = async () => {
    if (vehicleOrderLocked) {
      setVehicles((vs) => vs.map((v) => ({ ...v, sort_order: null })));
      try {
        await Promise.all(vehicles.filter((v) => v.sort_order != null).map((v) => api.update("vehicles", v.id, { sort_order: null })));
        showToast(t.orderUnlocked);
      } catch (e) { showToast(e.message); }
    } else {
      await persistVehicleOrder(sortedVehicles);
      showToast(t.orderLocked);
    }
  };

  const vehicleDragItem = useRef(null);
  const vehicleDragOver = useRef(null);
  const handleVehicleDragEnd = () => {
    const from = vehicleDragItem.current;
    const to = vehicleDragOver.current;
    vehicleDragItem.current = null;
    vehicleDragOver.current = null;
    if (from == null || to == null || from === to) return;
    const arr = [...sortedVehicles];
    const [moved] = arr.splice(from, 1);
    arr.splice(to, 0, moved);
    persistVehicleOrder(arr);
  };
  const moveVehicle = (index, dir) => {
    const to = index + dir;
    if (to < 0 || to >= sortedVehicles.length) return;
    const arr = [...sortedVehicles];
    const [moved] = arr.splice(index, 1);
    arr.splice(to, 0, moved);
    persistVehicleOrder(arr);
  };

  const cleanupPersonVehicles = async (personId) => {
    if (useAssignmentTable) {
      await api.deleteWhere("vehicle_assignments", "person_id", personId).catch(() => {});
      setVehicleAssignments((va) => va.filter((a) => a.person_id !== personId));
    }
    for (const v of vehicles) {
      const needs = v.driver_id === personId || (v.passenger_ids || []).includes(personId);
      if (needs) {
        const pids = (v.passenger_ids || []).filter((id) => id !== personId);
        await api.update("vehicles", v.id, { driver_id: v.driver_id === personId ? null : v.driver_id, passenger_ids: pids.length ? pids : null }).catch(() => {});
      }
    }
    setVehicles((vs) => vs.map((v) => ({
      ...v,
      driver_id: v.driver_id === personId ? null : v.driver_id,
      passenger_ids: (v.passenger_ids || []).filter((id) => id !== personId),
    })));
  };

  const getStatus = useCallback((id) => {
    const fl = flights.find((x) => x.person_id === id);
    const hasOut = fl && (fl.airline || fl.flight_no);
    const hasRet = fl && (fl.ret_airline || fl.ret_flight_no);
    if (hasOut && hasRet) return "arranged";
    if (hasOut && !hasRet) return "missing-ret";
    if (!hasOut && hasRet) return "missing-out";
    return "none";
  }, [flights]);

  const shootPhases = useMemo(() => getShootPhases(project), [project]);
  const hotelPhaseMap = useMemo(() => Object.fromEntries(hotels.map((h) => [+h.id, h.shoot_phase_id || ""])), [hotels]);
  const activePhaseName = useMemo(() => shootPhases.find((p) => p.id === activeStayPhase)?.name || "", [shootPhases, activeStayPhase]);

  const personsMissingPhaseStay = useMemo(() => {
    const visible = persons.filter((p) => !p.hide_from_stays);
    if (!activeStayPhase) {
      return visible.filter((p) => !stays.some((s) => s.person_id === p.id));
    }
    return visible.filter((p) => !personHasStayInPhase(p.id, activeStayPhase, stays, hotels));
  }, [persons, stays, activeStayPhase, hotels]);

  const showStayModal = (payload) => {
    if (payload.stayId != null) stayScrollAnchorId.current = payload.stayId;
    else pendingScrollY.current = readScrollPosition();
    setStayModal({ defaultPhaseId: activeStayPhase || undefined, ...payload });
  };
  const openStayModal = showStayModal;
  const closeStayModal = () => setStayModal(null);

  const saveShootPhases = async (nextPhases) => {
    try {
      const [updated] = await api.update("projects", pid, { shoot_phases: nextPhases });
      onProjectUpdate(updated);
      showToast(t.saved);
    } catch (e) { showToast(e.message); }
  };

  const addShootPhase = (name) => {
    if (!name || shootPhases.length >= 4) return;
    saveShootPhases([...shootPhases, { id: `ph${Date.now()}`, name }]);
  };

  const deleteShootPhase = async (phaseId) => {
    await saveShootPhases(shootPhases.filter((p) => p.id !== phaseId));
    const affected = hotels.filter((h) => h.shoot_phase_id === phaseId);
    for (const h of affected) {
      try {
        const [r] = await api.update("hotels", h.id, { shoot_phase_id: null });
        setHotels((list) => list.map((x) => x.id === h.id ? r : x));
      } catch (e) { showToast(e.message); }
    }
    if (activeStayPhase === phaseId) setActiveStayPhase("");
  };

  const allDepts = useMemo(() => [...new Set(persons.map((p) => p.dept).filter(Boolean))], [persons]);
  // 員工編號：純依列表順序（拖移後即更新）
  const personIndex = useMemo(() => Object.fromEntries(persons.map((x, i) => [x.id, i + 1])), [persons]);
  const hotelStatsMap = useMemo(() => computeHotelStats(stays, roommates), [stays, roommates]);
  const hotelCumulativeStats = useMemo(() => computeHotelStatsCumulative(stays, roommates, pricingRules, hotels), [stays, roommates, pricingRules, hotels]);
  const stayDisplayAllocations = useMemo(() => computeStayDisplayAllocations(stays, pricingRules, hotels), [stays, pricingRules, hotels]);
  const stayDisplayTotals = stayDisplayAllocations.totals;
  const staySoloNights = stayDisplayAllocations.soloNights;
  const stayNightDates = useMemo(() => collectStayNightDates(stays), [stays]);
  const hotelStatsByDateMap = useMemo(
    () => (statsDate ? computeHotelStatsForDate(stays, roommates, statsDate, pricingRules, hotels) : {}),
    [stays, roommates, statsDate, pricingRules, hotels],
  );
  const hotelStatsHotelsOnDate = useMemo(() => hotels
    .filter((h) => (hotelStatsByDateMap[h.id] || hotelStatsByDateMap[+h.id])?.guests > 0)
    .sort((a, b) => (a.name || "").localeCompare(b.name || "")),
  [hotels, hotelStatsByDateMap]);
  const selectedHotelDayStats = useMemo(() => {
    if (!statsHotelId || !statsDate) return null;
    const hotel = hotels.find((h) => String(h.id) === String(statsHotelId));
    if (!hotel) return null;
    const st = hotelStatsByDateMap[hotel.id] || hotelStatsByDateMap[+hotel.id];
    if (!st || st.guests <= 0) return null;
    return { hotel, st };
  }, [statsHotelId, statsDate, hotels, hotelStatsByDateMap]);
  const hotelStatsDayCostFmt = useMemo(
    () => formatMoney(convertMoney(selectedHotelDayStats?.st.cost || 0, project), project, lang),
    [selectedHotelDayStats, project, lang],
  );
  useEffect(() => {
    if (!stayNightDates.length) {
      setStatsDate("");
      return;
    }
    setStatsDate((prev) => {
      if (prev && stayNightDates.includes(prev)) return prev;
      const today = todayStr();
      if (stayNightDates.includes(today)) return today;
      return stayNightDates[0];
    });
  }, [stayNightDates]);
  useEffect(() => {
    if (!statsDate) return;
    setStatsHotelId((prev) => {
      if (prev && hotelStatsHotelsOnDate.some((h) => String(h.id) === String(prev))) return prev;
      if (hotelStatsHotelsOnDate[0]) return String(hotelStatsHotelsOnDate[0].id);
      if (prev && hotels.some((h) => String(h.id) === String(prev))) return prev;
      return hotels[0] ? String(hotels[0].id) : "";
    });
  }, [statsDate, hotelStatsHotelsOnDate, hotels]);
  const totalHotelCost = useMemo(
    () => Object.values(hotelCumulativeStats).reduce((s, v) => s + (v.cost || 0), 0),
    [hotelCumulativeStats],
  );

  const personsWithNoTrips = useMemo(() => {
    const has = new Set(allAssignments.map((a) => a.person_id));
    return persons.filter((p) => !p.hide_from_vehicles && !has.has(p.id));
  }, [persons, allAssignments]);

  const progressStats = useMemo(() => {
    const total = persons.length;
    const flightEligible = persons.filter((p) => !p.hide_from_flights);
    const stayEligible = persons.filter((p) => !p.hide_from_stays);
    const vehicleEligible = persons.filter((p) => !p.hide_from_vehicles);
    const flightDone = flightEligible.filter((p) => { const fl = flights.find((x) => x.person_id === p.id); return fl && fl.airline && fl.flight_no; }).length;
    const hotelDone = stayEligible.filter((p) => stays.some((s) => s.person_id === p.id && s.hotel_id)).length;
    const tripPersons = new Set(allAssignments.map((a) => a.person_id));
    return {
      total,
      flightTotal: flightEligible.length,
      flightDone,
      hotelTotal: stayEligible.length,
      hotelDone,
      vehicleTotal: vehicleEligible.length,
      vehicleAssigned: [...tripPersons].filter((id) => vehicleEligible.some((p) => p.id === id)).length,
      unassignedVehicle: vehicleEligible.filter((p) => !tripPersons.has(p.id)).length,
    };
  }, [persons, flights, stays, allAssignments]);

  const getRoommateNames = (id) => roommates.filter((r) => r.person_id === id).map((r) => persons.find((p) => p.id === r.partner_id)?.name_kanji).filter(Boolean).join("、");
  const getHotelName = (id) => hotels.find((h) => h.id == id)?.name || "—";

  const filterPersons = (q, dept) => persons.filter((p) => {
    const kw = q.toLowerCase();
    const ok = !kw || [p.name_kanji, p.last_roman, p.first_roman, p.dept, p.title_kanji, p.title_other, p.passport].some((v) => (v || "").toLowerCase().includes(kw));
    return ok && (!dept || p.dept === dept);
  });

  const filteredFlightPersons = useMemo(() => persons.filter((p) => {
    if (p.hide_from_flights) return false;
    const fl = flights.find((x) => x.person_id === p.id);
    const kw = debSearchB.toLowerCase();
    const nameOk = !kw || [p.name_kanji, p.last_roman, p.first_roman, p.dept].some((v) => (v || "").toLowerCase().includes(kw));
    const romanOk = !searchBRoman || [p.last_roman, p.first_roman].some((v) => (v || "").toLowerCase().includes(searchBRoman.toLowerCase()));
    const airlineOk = !searchBAirline || (fl?.airline || "").toLowerCase().includes(searchBAirline.toLowerCase());
    const st = getStatus(p.id);
    const statusOk = !searchBStatus || st === searchBStatus;
    return nameOk && romanOk && airlineOk && statusOk && (!deptB || p.dept === deptB);
  }), [persons, flights, debSearchB, deptB, searchBRoman, searchBAirline, searchBStatus, getStatus]);

  const flightSameDiffMap = useMemo(() => buildFlightSameDiffMap(persons, flights), [persons, flights]);

  const displayFlightPersons = useMemo(() => filteredFlightPersons.filter((p) => {
    const fl = flights.find((x) => x.person_id === p.id);
    if (getVisibleFlightLegs(fl, flightLegFilter).length === 0) return false;
    if (flightSameDiffFilter) {
      const sd = flightSameDiffMap.get(p.id);
      const legsToCheck = flightLegFilter === "out" ? ["out"] : flightLegFilter === "ret" ? ["ret"] : ["out", "ret"];
      const matches = legsToCheck.some((leg) => sd && sd[leg] === flightSameDiffFilter);
      if (!matches) return false;
    }
    return true;
  }), [filteredFlightPersons, flights, flightLegFilter, flightSameDiffFilter, flightSameDiffMap]);

  const flightTableSections = useMemo(
    () => buildFlightTableSections(displayFlightPersons, flights, flightLegFilter, t, lang),
    [displayFlightPersons, flights, flightLegFilter, t, lang],
  );

  const flightDeptGroups = useMemo(() => {
    if (!flightGroupByDept) return null;
    const deptOrder = [];
    const deptMap = {};
    displayFlightPersons.forEach((p) => {
      const d = p.dept || "";
      if (!deptMap[d]) { deptMap[d] = []; deptOrder.push(d); }
      deptMap[d].push(p);
    });
    const sorted = [...deptOrder].sort((a, b) => {
      if (!a) return 1;
      if (!b) return -1;
      return a.localeCompare(b, "zh-TW");
    });
    return sorted.map((d) => ({ dept: d, persons: deptMap[d] }));
  }, [flightGroupByDept, displayFlightPersons]);

  // 目前畫面上實際存在的可摺疊區塊 key（依部門時=各部門；否則=各航班分組區塊）
  const currentFlightSectionKeys = useMemo(() => {
    if (flightDeptGroups) return flightDeptGroups.map(({ dept }) => `flight:dept:${dept}`);
    return flightTableSections.map((s) => `flight:section:${s.key}`);
  }, [flightDeptGroups, flightTableSections]);

  // 從現有航班資料學習「班機號 → 機場」對應，供編輯表單自動帶入（僅機場，不含航廈）
  const flightRouteMemory = useMemo(() => buildFlightRouteMemory(flights), [flights]);

  const flatStays = useMemo(() => {
    const rows = [];
    stays.forEach((s) => {
      const p = s.person_id ? persons.find((x) => x.id === s.person_id) : null;
      if (!p && !s.special_room_name) return;
      const kw = debSearchC.toLowerCase();
      const hname = getHotelName(s.hotel_id);
      const rt = s.room_type === "Custom" ? s.room_custom : s.room_type;
      const dispName = s.special_room_name || p?.name_kanji || "";
      const nameOk = !kw || [dispName, p?.last_roman, p?.dept].some((v) => (v || "").toLowerCase().includes(kw));
      const hotelOk = !searchCHotel || hname.toLowerCase().includes(searchCHotel.toLowerCase());
      const roomOk = !searchCRoom || (rt || "").toLowerCase().includes(searchCRoom.toLowerCase());
      const deptOk = !deptC || (p?.dept === deptC);
      const phaseOk = !activeStayPhase || hotelPhaseMap[+s.hotel_id] === activeStayPhase;
      if (nameOk && hotelOk && roomOk && deptOk && phaseOk) {
        rows.push({ ...s, person: p || { dept: "", name_kanji: s.special_room_name, last_roman: "", first_roman: "" }, hotelName: hname, roomLabel: rt, isSpecialRoom: !!s.special_room_name });
      }
    });
    // Sort tier: 0=normal+room, 1=special+room, 2=normal+noroom, 3=noStay, 4=special+noroom
    rows.sort((a, b) => {
      const tierA = a.isSpecialRoom ? (a.room_number ? 1 : 4) : (a.room_number ? 0 : 2);
      const tierB = b.isSpecialRoom ? (b.room_number ? 1 : 4) : (b.room_number ? 0 : 2);
      if (tierA !== tierB) return tierA - tierB;
      const noA = personIndex[a.person_id] || 9999;
      const noB = personIndex[b.person_id] || 9999;
      if (noA !== noB) return noA - noB;
      const dA = (a.person?.dept || "").toLowerCase();
      const dB = (b.person?.dept || "").toLowerCase();
      if (dA !== dB) return dA.localeCompare(dB, undefined, { sensitivity: "base" });
      const ciA = a.check_in || ""; const ciB = b.check_in || "";
      if (ciA !== ciB) return ciA.localeCompare(ciB);
      return (a.check_out || "").localeCompare(b.check_out || "");
    });
    return rows;
  }, [stays, persons, debSearchC, searchCHotel, searchCRoom, deptC, activeStayPhase, hotelPhaseMap, personIndex, hotels]);

  // Room group colours (cycle through palette for each unique hotel+room_number key)
  const ROOM_COLORS = ["#2b5a4c", "#6b4c9a", "#8b4513", "#1a5276", "#7b241c", "#117a65", "#6e2f1a", "#1b4f72"];
  const roomGroupColorMap = useMemo(() => {
    const map = {};
    let idx = 0;
    flatStays.forEach((row) => {
      if (!row.room_number) return;
      const key = `${row.hotel_id}::${row.room_number}`;
      if (!(key in map)) map[key] = ROOM_COLORS[idx++ % ROOM_COLORS.length];
    });
    return map;
  }, [flatStays]);

  const saveRoomNumber = async (stayId, hotelId, newRoomNo) => {
    stayScrollAnchorId.current = stayId;
    try {
      const trimmed = newRoomNo.trim();
      await api.update("stays", stayId, { room_number: trimmed || null });
      let nextStays = stays.map((s) => s.id === stayId ? { ...s, room_number: trimmed || null } : s);
      nextStays = await persistStayAmountsFromAllocations(nextStays, pricingRules, hotels, api);
      setStays(nextStays);
    } catch (e) { showToast(e.message); }
  };

  const addAssignment = async (vehicleId, personId, role, segmentLabel = "") => {
    const v = vehicles.find((x) => x.id === vehicleId);
    if (!v) return;
    const current = getAssignmentsForVehicle(vehicleId);
    const seg = segmentLabel || "";
    const segGroup = current.filter((a) => (a.segment_label || "") === seg);
    if (current.some((a) => a.person_id === personId && a.role === role && (a.segment_label || "") === seg)) return;
    const cap = v.capacity || 4;
    if (vehicleOnboardCount(segGroup) >= cap) { showToast(t.vehicleFull); return; }
    if (role === "driver" && segGroup.some((a) => a.role === "driver")) { showToast(t.vehicleFull); return; }
    try {
      if (useAssignmentTable) {
        const [row] = await api.insert("vehicle_assignments", { project_id: pid, vehicle_id: vehicleId, person_id: personId, role, segment_label: segmentLabel, sort_order: current.length });
        setVehicleAssignments((va) => [...va, row]);
      } else {
        const next = [...current.map(({ person_id, role: r, segment_label }) => ({ person_id, role: r, segment_label: segment_label || "" })), { person_id: personId, role, segment_label: segmentLabel }];
        const driver = next.find((a) => a.role === "driver");

      const [r] = await api.insert("stays", payload);
      return r;
    };
    try {
      let saved;
      try {
        saved = await doSave(data);
      } catch (e1) {
        if (e1.message && (e1.message.includes("location_tag") || e1.message.includes("hide_from"))) {
          const fallback = { ...data };
          delete fallback.location_tag;
          saved = await doSave(fallback);
        } else throw e1;
      }
      let nextStays = stayModal.stayId
        ? stays.map((x) => x.id === stayModal.stayId ? saved : x)
        : [...stays, saved];

      const rows = parseCSV(await file.text());
      if (rows.length < 2) { showToast(t.importEmpty); return; }
      const csvFormat = staffCsvFormat(rows[0], t);
      if (!csvFormat) { showToast(t.importFormatError); return; }
      const bodyRows = rows.slice(1);
      const importRows = bodyRows.map((row) => ({ row, payload: rowToStaffPerson(row, csvFormat) })).filter((x) => x.payload);
      if (!importRows.length) { showToast(t.importEmpty); return; }
      if (!window.confirm(t.importConfirm.replace("{n}", importRows.length))) return;

      const sorted = [...persons].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
      let ok = 0;
      let fail = 0;
      let nextOrder = sorted.length;

      for (const { row, payload } of importRows) {
        const rawNo = parseInt(String(row[0] ?? "").trim(), 10);
        let existing = !Number.isNaN(rawNo) && rawNo >= 1 ? sorted[rawNo - 1] : null;
        if (!existing && payload.name_kanji) {
          existing = persons.find((p) => (p.name_kanji || "") === payload.name_kanji && (p.dept || "") === payload.dept);
        }
        try {
          if (existing) {
            const [r] = await api.update("persons", existing.id, payload);
            setPersons((prev) => prev.map((x) => x.id === existing.id ? r : x));
            const si = sorted.findIndex((p) => p.id === existing.id);
            if (si >= 0) sorted[si] = { ...sorted[si], ...r };
          } else {
            const [r] = await api.insert("persons", { ...payload, project_id: pid, sort_order: nextOrder++ });
            setPersons((prev) => [...prev, r]);
            sorted.push(r);
          }
          ok++;
        } catch (e) {
          console.error(e);
          fail++;
        }
      }
      await loadAll();
      const failMsg = fail > 0 ? (t.importFailSuffix || "").replace("{fail}", fail) : "";
      showToast(t.importDone.replace("{ok}", ok).replace("{fail}", failMsg));

                        style={{ width: "100%" }}
                      />
                    )}
                    {canEdit && (
                      <button type="button" style={{ ...pBtn(!addStayPerson), width: "100%" }} disabled={!addStayPerson} onClick={() => { openStayModal({ pid: +addStayPerson, stayId: null, data: null }); setAddStayPerson(""); }}>{t.addSegment}</button>
                    )}
                    {canEdit && (
                      <button type="button" style={{ ...pBtn(false), width: "100%", background: "var(--asagi2)", color: "var(--asagi)", border: "1px solid rgba(74,127,165,.3)" }} onClick={() => showStayModal({ pid: null, stayId: null, data: { special_room_name: "" }, special: true })}>{t.addSpecialRoom}</button>
                    )}
                    {/* 功能四：顯示篩選飯店的總金額 */}
                    {searchCHotel.trim() && (() => {
                      const matchedHotel = hotels.find((h) => (h.name || "").toLowerCase().includes(searchCHotel.toLowerCase()));
                      if (!matchedHotel) return null;
                      const cs = hotelCumulativeStats[matchedHotel.id] || hotelCumulativeStats[+matchedHotel.id] || {};
                      const roomNights = cs.roomNights || 0;
                      const guestNights = cs.guestNights || 0;
                      const cost = cs.cost || 0;
                      return (
                        <div style={{ gridColumn: "1 / -1", background: "linear-gradient(135deg,rgba(43,90,76,.12),rgba(74,127,165,.08))", border: "1px solid var(--keisenM)", borderRadius: 8, padding: "10px 14px", display: "flex", flexWrap: "wrap", gap: 16, alignItems: "center" }}>

                            <span style={{ color: "var(--nezumi)" }}>{t.guestNights}: <strong style={{ color: "var(--sumi)" }}>{guestNights}</strong></span>
                            <span style={{ color: "var(--nezumi)", fontWeight: 600 }}>{t.totalAmt}: <strong style={{ fontSize: 14, color: "var(--asagi)", fontFamily: "'Noto Serif JP',serif" }}>{formatMoney(convertMoney(cost, project), project, lang)}</strong></span>
                          </div>
                        </div>
                      );
                    })()}
                    <span style={{ fontSize: 11, color: "var(--nezumi)", gridColumn: "1 / -1" }}>{t.resultsCount.replace("{n}", flatStays.length).replace("{total}", stays.length)}</span>
                  </div>
                  {(() => {
                    const sortStayRows = (rows) => [...rows].sort((a, b) => {
                      const aHas = a.room_number ? 0 : 1;
                      const bHas = b.room_number ? 0 : 1;
                      if (aHas !== bHas) return aHas - bHas;
                      if (a.room_number && b.room_number && a.room_number !== b.room_number)
                        return a.room_number.localeCompare(b.room_number, undefined, { numeric: true });
                      return (personIndex[a.person_id] || 0) - (personIndex[b.person_id] || 0);
                    });

                    const hotelGroups = [];
                    const groupMap = new Map();
                    flatStays.forEach((row) => {
                      const hid = row.hotel_id ?? "none";
                      if (!groupMap.has(hid)) {
                        const g = { hotelId: hid, hotelName: row.hotelName || t.noData, rows: [] };
                        groupMap.set(hid, g);
                        hotelGroups.push(g);
                      }
                      groupMap.get(hid).rows.push(row);
                    });
                    hotelGroups.sort((a, b) => {
                      const ma = computeHotelGroupMeta(a.rows);
                      const mb = computeHotelGroupMeta(b.rows);
                      if (ma.minIn && mb.minIn && ma.minIn !== mb.minIn) return ma.minIn.localeCompare(mb.minIn);
                      return a.hotelName.localeCompare(b.hotelName, lang === "ja" ? "ja" : "zh-Hant");
                    });

                    const personsNoStay = personsMissingPhaseStay;
                    const stayHeaderDefs = [
                      { key: "no", label: t.no, align: "center" },
                      { key: "dept", label: t.dept, align: "left" },
                      { key: "kanji", label: t.nameKanji, align: "left" },
                      { key: "roman", label: t.nameEnglish, align: "left" },
                      { key: "seg", label: t.staySegment, align: "left" },
                      { key: "room", label: t.roomNo, align: "center" },
                      { key: "type", label: t.roomType, align: "left" },
                      { key: "in", label: t.checkIn, align: "center" },
                      { key: "out", label: t.checkOut, align: "center" },
                      { key: "nights", label: t.nights, align: "center" },
                      { key: "amt", label: t.totalAmt, align: "center" },
                      { key: "act", label: t.action, align: "center" },

                        <div>

                            <div style={{ fontSize: 10, color: "var(--nezumi)", fontWeight: 400, marginTop: 2 }}>
                              {t.soloStayNights.replace("{n}", staySoloNights[rowId])}
                            </div>
                          )}
                        </div>
                      )
                    );

                    const stayRow = (row) => {
                      const roomKey = row.room_number ? `${row.hotel_id}::${row.room_number}` : null;
                      const groupColor = roomKey ? roomGroupColorMap[roomKey] : null;
                      const dispTotal = stayDisplayTotals[row.id] ?? 0;
                      const isZeroPrice = dispTotal === 0;
                      if (row.isSpecialRoom) {
                        return (
                          <tr key={row.id} data-stay-row={row.id} style={{ background: "rgba(74,127,165,.04)" }}>
                            <td className="td-num col-center" style={{ ...tdS({ maxWidth: "none" }), borderLeft: "3px solid var(--asagi)" }}>—</td>
                            <td className="col-text" style={tdEllipsis({ color: "var(--asagi)", fontStyle: "italic" })}>—</td>
                            <td className="col-text" colSpan={2} style={tdEllipsis({ fontWeight: 600, color: "var(--asagi)" })}>
                              <span style={{ fontSize: 11, marginRight: 6, opacity: 0.75 }}>🏷</span>{row.special_room_name}
                            </td>
                            <td className="col-text" style={tdEllipsis()} title={row.stay_label || ""}>{row.stay_label || "—"}</td>
                            <td className="room-no-cell" style={tdS({ maxWidth: "none" })}>
                              {canEdit ? (
                                <input className="room-no-input wa-input" defaultValue={row.room_number || ""} placeholder={t.roomNoPending} style={{ ...inpStyle, padding: "4px 6px", fontSize: 12 }} onBlur={(e) => { if (e.target.value !== (row.room_number || "")) saveRoomNumber(row.id, row.hotel_id, e.target.value); }} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} />
                              ) : (
                                <span className="room-no-read" style={{ color: "var(--nezumi)" }}>{row.room_number || t.roomNoPending}</span>
                              )}
                            </td>
                            <td className="col-text" style={tdEllipsis()} title={row.roomLabel}>{row.roomLabel}</td>
                            <td className="col-center" style={tdS({ maxWidth: "none" })}>{fmtDate(row.check_in, lang)}</td>
                            <td className="col-center" style={tdS({ maxWidth: "none" })}>{fmtDate(row.check_out, lang)}</td>
                            <td className="col-center" style={tdS({ maxWidth: "none" })}>{row.nights}</td>
                            <td className="td-amt col-center" style={tdS({ maxWidth: "none", fontWeight: 600, color: dispTotal ? "var(--asagi)" : "var(--usunezumi)" })}>
                              {stayAmtCell(row.id, dispTotal, !dispTotal)}
                            </td>
                            <td className="col-actions" style={tdS({ maxWidth: "none" })}>
                              <div className="tbl-actions">
                                {canEdit && <button type="button" style={eBtn} onClick={() => showStayModal({ pid: null, stayId: row.id, data: stayFormInit(row), special: true })}>{t.edit}</button>}
                                {canDelete && <button type="button" style={dBtn} onClick={async () => { if (window.confirm(t.deleteConfirm)) { await api.delete("stays", row.id); setStays((s) => s.filter((x) => x.id !== row.id)); showToast(t.deleted); } }}>×</button>}
                              </div>
                            </td>
                          </tr>
                        );
                      }
                      return (
                        <tr key={row.id} data-stay-row={row.id} style={{ background: groupColor ? `${groupColor}0d` : "transparent" }}>
                          <td className="td-num col-center" style={{ ...tdS({ maxWidth: "none" }), borderLeft: groupColor ? `3px solid ${groupColor}` : "3px solid transparent" }}>
                            {personIndex[row.person_id]}
                          </td>
                          <td className="col-text" style={tdEllipsis()} title={row.person.dept}>{row.person.dept}</td>
                          <td className="col-text" style={tdEllipsis({ fontWeight: 600 })} title={row.person.name_kanji}>{row.person.name_kanji}</td>
                          <td style={tdS({ textAlign: "left", maxWidth: "none" })}><RomanNameCell last={row.person.last_roman} first={row.person.first_roman} /></td>
                          <td className="col-text" style={tdEllipsis()} title={row.stay_label || ""}>{row.stay_label || "—"}</td>

                            </div>
                          </td>
                        </tr>

                      return <p style={{ fontSize: 13, color: "var(--nezumi)", padding: "24px 0" }}>{t.noData}</p>;

                    return (
                      <div>
                        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
                          <CollapseAllButton sectionKeys={allStaySectionKeys} collapsedHotels={collapsedHotels} onToggle={setManyCollapsed} t={t} />
                        </div>
                        {hotelGroups.map((group) => {
                          const rows = sortStayRows(group.rows);
                          const assigned = rows.filter((r) => r.room_number);
                          const unassigned = rows.filter((r) => !r.room_number);
                          const cs = hotelCumulativeStats[group.hotelId] || hotelCumulativeStats[+group.hotelId] || {};
                          const meta = computeHotelGroupMeta(rows);
                          const displayCost = cs.cost != null ? cs.cost : rows.reduce((s, r) => s + (stayDisplayTotals[r.id] || 0), 0);
                          const sectionKey = `stay:${group.hotelId}`;
                          const isCollapsed = collapsedHotels.has(sectionKey);
                          return (
                            <section key={String(group.hotelId)} style={{ marginBottom: 32 }}>
                              <HotelSectionHeader
                                collapsed={isCollapsed}
                                onToggle={() => toggleHotelCollapsed(sectionKey)}
                                hotelName={group.hotelName}
                                dateRange={meta.minIn && meta.maxOut ? `${fmtDate(meta.minIn, lang)} ～ ${fmtDate(meta.maxOut, lang)}` : null}
                                meta={{ guestCount: meta.guestCount, roomCount: meta.roomCount, roomNights: cs.roomNights }}
                                displayCost={displayCost}
                                project={project} lang={lang} t={t}
                              />
                              {!isCollapsed && (
                              <div style={{ overflowX: "auto" }}>
                                <table style={tblW} className="data-table stay-table">
                                  <colgroup>
                                    {STAY_COL_WIDTHS.map((w, i) => <col key={i} style={{ width: w }} />)}
                                  </colgroup>
                                  <thead><tr style={thead}>
                                    {stayHeaderDefs.map(({ key, label, align }) => (
                                      <th key={key} style={{ ...thS, textAlign: align || "center" }}>{label}</th>
                                    ))}
                                  </tr></thead>
                                  <tbody>
                                    {assigned.map(stayRow)}
                                    {unassigned.length > 0 && (
                                      <tr>
                                        <td colSpan={colSpan} className="pending-banner" style={{ padding: "6px 12px", fontSize: 11, fontWeight: 700, color: "var(--kincha)", borderTop: "2px dashed var(--kincha)", letterSpacing: "0.06em" }}>
                                          {t.unassignedRoomSection} ({unassigned.length})
                                        </td>
                                      </tr>
                                    )}
                                    {groupByDeptLabel(unassigned, (r) => r.person.dept, lang, t.deptUnset).map((g) => (
                                      <React.Fragment key={g.label}>
                                        <tr className="stay-dept-banner">
                                          <td colSpan={colSpan}>{g.label} ({g.items.length})</td>
                                        </tr>
                                        {[...g.items].sort((a, b) => (personIndex[a.person_id] || 0) - (personIndex[b.person_id] || 0)).map(stayRow)}
                                      </React.Fragment>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                              )}
                            </section>
                          );
                        })}

                        <UnassignedRoomsPanel
                          personsNoStay={personsNoStay}
                          activeStayPhase={activeStayPhase}
                          activePhaseName={activePhaseName}
                          t={t} lang={lang}
                          personIndex={personIndex}
                          canEdit={canEdit}
                          openStayModal={openStayModal}
                        />
                      </div>
                    );
                  })()}
                  <HotelStatsByDatePanel
                    t={t}
                    lang={lang}
                    project={project}
                    statsDate={statsDate}
                    setStatsDate={setStatsDate}
                    statsHotelId={statsHotelId}
                    setStatsHotelId={setStatsHotelId}
                    stayNightDates={stayNightDates}
                    hotels={hotels}
                    selectedHotelDayStats={selectedHotelDayStats}
                    hotelStatsDayCostFmt={hotelStatsDayCostFmt}
                    stays={stays}
                    persons={persons}
                    roommates={roommates}
                  />
                </>
              )}

              {accSub === "hotels" && (
                <>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
                    <SearchBar value={searchD} onChange={setSearchD} placeholder={t.searchHotelList} />
                    {canEdit && <button type="button" onClick={() => setHotelModal({ mode: "add" })} style={pBtn(false)}>{t.addHotel}</button>}
                  </div>
                  {hotels.filter((h) => !searchD || [h.name, h.address, h.tel].some((v) => (v || "").toLowerCase().includes(searchD.toLowerCase()))).map((h) => {
                    const hRules = pricingRules.filter((r) => +r.hotel_id === h.id).sort((a, b) => a.date > b.date ? 1 : -1);
                    const rates = h.room_type_rates || {};
                    const rateEntries = Object.entries(rates);
                    return (
                      <div key={h.id} style={{ background: "var(--shiro)", borderRadius: 8, border: "1px solid var(--keisenL)", marginBottom: 14, padding: "18px 20px", boxShadow: "0 1px 4px rgba(0,0,0,.04)" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div>
                            <strong style={{ fontSize: 14, color: "var(--sumi)", fontFamily: "'Noto Serif JP',serif" }}>{h.name}</strong>
                            {h.shoot_phase_id && shootPhases.find((p) => p.id === h.shoot_phase_id) && (
                              <span style={{ marginLeft: 8, fontSize: 10, padding: "2px 8px", borderRadius: 10, background: "var(--moegi3)", color: "var(--moegi)", fontWeight: 700 }}>
                                {shootPhases.find((p) => p.id === h.shoot_phase_id)?.name}
                              </span>
                            )}
                            <div style={{ fontSize: 11.5, color: "var(--nezumi)", marginTop: 3 }}>{h.address}{h.tel ? ` · ${h.tel}` : ""}</div>
                          </div>
                          {canEdit && <>
                            <button type="button" style={eBtn} onClick={() => setHotelModal({ mode: "edit", data: h })}>{t.edit}</button>
                            {canDelete && <button type="button" style={dBtn} onClick={async () => { if (window.confirm(t.deleteConfirm)) { await api.delete("hotels", h.id); setHotels((x) => x.filter((y) => y.id !== h.id)); } }}>{t.delete}</button>}
                          </>}
                        </div>

                        {/* Room Type Default Rates */}
                        <div style={{ marginTop: 12, padding: "10px 14px", background: "var(--washi)", borderRadius: 6, border: "1px solid var(--keisenL)" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: rateEntries.length ? 8 : 0 }}>
                            <span style={{ fontSize: 11, fontWeight: 700, color: "var(--asagi)", letterSpacing: "0.04em" }}>{t.roomTypeRates}</span>
                            {canEdit && <button type="button" onClick={() => setHotelModal({ mode: "edit", data: h })} style={{ ...aBtn, margin: 0, fontSize: 10 }}>{t.edit}</button>}
                          </div>
                          {rateEntries.length === 0 ? (
                            <span style={{ fontSize: 11, color: "var(--usunezumi)", fontStyle: "italic" }}>{t.noData}</span>
                          ) : (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 16px" }}>
                              {rateEntries.map(([rt, price]) => (
                                <span key={rt} style={{ fontSize: 11.5, color: "var(--sumi)" }}>
                                  <span style={{ color: "var(--nezumi)", marginRight: 4 }}>{rt === "All" ? t.allSamePrice : rt}</span>

                                <col style={{ width: "30%" }} />

                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>

                        </div>
                      </div>
                    );
                  })}
                </>
              )}

              {accSub === "invoice" && (
                <HotelGroupInvoicePanel
                  stays={stays}

                  project={project}
                  lang={lang}
                  t={t}
                  persons={persons}
                  personIndex={personIndex}
                  collapsedHotels={collapsedHotels}
                  toggleHotelCollapsed={toggleHotelCollapsed}
                  setManyCollapsed={setManyCollapsed}
