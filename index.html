function getHotelRoomInventory(hotel, roomLabel, allStays, roommates, checkIn, checkOut, excludeStayId) {
  if (!hotel?.inventory_enabled || !hotel?.room_type_inventory) return null;
  const inv = hotel.room_type_inventory;
  const key = inv["All"] !== undefined ? "All" : roomLabel;
  const total = inv[key];
  if (total == null || total === "") return null;
  // 日期區間尚未填齊時，無法判斷是否重疊，先不顯示庫存狀態
  if (!checkIn || !checkOut) return null;
  const ci = String(checkIn).slice(0, 10);
  const co = String(checkOut).slice(0, 10);
  const rmGroups = roommates && roommates.length ? buildRoommateGroups(roommates) : null;
  const getRoommateRoot = (pid) => {
    if (!rmGroups) return `person:${pid}`;
    let root = `person:${pid}`;
    Object.entries(rmGroups).forEach(([, members]) => {
      if (members.has(+pid)) root = `rmgroup:${[...members].sort((a,b)=>a-b).join(",")}`;
    });
    return root;
  };
  const used = new Set();
  (allStays || []).forEach((s) => {
    if (+s.hotel_id !== +hotel.id) return;
    if (excludeStayId != null && s.id === excludeStayId) return;
    const sl = s.room_type === "Custom" ? (s.room_custom || "Custom") : (s.room_type || "");
    const matchKey = inv["All"] !== undefined ? true : sl === roomLabel;
    if (!matchKey) return;
    // 日期區間重疊判斷：退房當天視為「不重疊」，可立即讓下一位入住
    const sCi = String(s.check_in || "").slice(0, 10);
    const sCo = String(s.check_out || "").slice(0, 10);
    if (!sCi || !sCo) return;
    const overlaps = sCi < co && ci < sCo;
    if (!overlaps) return;
    if (s.special_room_name) used.add(`special:${s.id}`);
    else if ((s.room_number || "").trim()) used.add(`room:${(s.room_number||"").trim()}`);
    else if (s.person_id != null) used.add(getRoommateRoot(s.person_id));
  });
  return { total: +total, used: used.size, remaining: +total - used.size };
}

function HotelStayForm({ init, hotels, pricingRules, onSave, onClose, t, project, lang, isSpecialRoom, defaultPhaseId, allStays, roommates }) {
  const phaseHotels = defaultPhaseId ? hotels.filter((h) => h.shoot_phase_id === defaultPhaseId) : hotels;
  const defaultHotelId = phaseHotels.length === 1 ? String(phaseHotels[0].id) : "";
  const blank = { hotel_id: defaultHotelId, room_type: "Single", room_custom: "", check_in: todayStr(), check_out: addDaysToDateStr(todayStr(), 1), stay_label: "", room_number: "", special_room_name: "" };
  const [f, setF] = useState(() => (init ? { ...blank, ...stayFormInit(init) } : blank));
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const handleCheckInChange = (e) => {
    const checkIn = e.target.value;
    setF((p) => {
      if (!checkIn) return { ...p, check_in: "" };
      return { ...p, check_in: checkIn, check_out: addDaysToDateStr(checkIn, 1) };
    });
  };
  const handleCheckOutChange = (e) => {
    const checkOut = e.target.value;
    setF((p) => {
      if (!checkOut || !p.check_in) return { ...p, check_out: checkOut };
      if (diffDays(p.check_in, checkOut) <= 0) return { ...p, check_out: addDaysToDateStr(p.check_in, 1) };
      return { ...p, check_out: checkOut };
    });
  };

  const selectedHotel = hotels.find((h) => +h.id === +f.hotel_id);
  const roomTypeOptions = useMemo(() => {
    const opts = getHotelRoomTypeOptions(selectedHotel, pricingRules);
    const current = stayFormRoomLabel(f);
    if (current && !opts.includes(current)) return [...opts, current];
    return opts;
  }, [selectedHotel, pricingRules, f.room_type, f.room_custom]);
  const roomSelectValue = stayFormRoomLabel(f) || roomTypeOptions[0] || "Single";

  const handleHotelChange = (e) => {
    const hotelId = e.target.value;
    const hotel = hotels.find((h) => String(h.id) === hotelId);
    const opts = getHotelRoomTypeOptions(hotel, pricingRules);
    const currentLabel = stayFormRoomLabel(f);
    const nextRoom = opts.includes(currentLabel)
      ? applyRoomLabelToForm(currentLabel)
      : applyRoomLabelToForm(opts[0] || "Single");
    setF((p) => ({ ...p, hotel_id: hotelId, ...nextRoom }));
  };

  const handleRoomTypeChange = (e) => {
    setF((p) => ({ ...p, ...applyRoomLabelToForm(e.target.value) }));
  };

  const nights = diffDays(f.check_in, f.check_out);
  const { totalAmount, breakdown } = useMemo(() => {
    if (!f.check_in || !f.check_out || nights === 0) return { totalAmount: 0, breakdown: [] };
    const roomLabel = stayFormRoomLabel(f);
    const selectedHotel = hotels.find((h) => +h.id === +f.hotel_id);
    let total = 0; const bd = [];
    for (let i = 0; i < nights; i++) {
      const d = parseLocalDate(f.check_in); d.setDate(d.getDate() + i);
      const ds = localDateStr(d);
      const rule = findPricingRule(pricingRules, f.hotel_id, ds, roomLabel);
      const rtr = !rule ? findRoomTypeRate(selectedHotel, roomLabel) : null;
      const price = rule ? (+rule.final_price || 0) : (rtr != null ? rtr : 0);
      total += price; bd.push({ date: ds, price, fromRule: !!rule, fromRoomRate: !rule && rtr != null });
    }
    return { totalAmount: total, breakdown: bd };
  }, [f, nights, pricingRules, hotels]);
  const canSave = !!f.hotel_id && !!f.check_in && !!f.check_out && diffDays(f.check_in, f.check_out) > 0 && (isSpecialRoom ? !!f.special_room_name.trim() : true);
  const dispTotal = convertMoney(totalAmount, project);
  return (
    <div>
      {isSpecialRoom && (
        <div style={{ background: "rgba(74,127,165,.08)", padding: "8px 14px", marginBottom: 12, fontSize: 12, color: "var(--asagi)", borderRadius: 4, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 16 }}>🏷</span>
          <span style={{ fontWeight: 600 }}>{t.specialRoom}</span>
          <span style={{ opacity: 0.75 }}>— 入住人次不計算，客室數與費用正常累加</span>
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {isSpecialRoom ? (
          <Field label={t.specialRoomName}><input style={inpStyle} value={f.special_room_name} onChange={set("special_room_name")} placeholder="器材間 / 梳化間…" /></Field>
        ) : (
          <Field label={t.staySegment}><input style={inpStyle} value={f.stay_label} onChange={set("stay_label")} /></Field>
        )}
        <Field label={t.hotel}><select style={inpStyle} value={f.hotel_id} onChange={handleHotelChange}><option value="">--</option>{phaseHotels.map((h) => <option key={h.id} value={String(h.id)}>{h.name}</option>)}</select></Field>
        <Field label={t.roomType}>
          <select style={inpStyle} value={roomSelectValue} onChange={handleRoomTypeChange} disabled={!f.hotel_id}>
            {!f.hotel_id && <option value="">--</option>}
            {roomTypeOptions.map((rt) => {
              const inv = getHotelRoomInventory(selectedHotel, rt, allStays, roommates, f.check_in, f.check_out, init?.id);
              const isFull = inv && inv.remaining <= 0;
              const label = inv ? (isFull ? `${rt} ⛔ 已滿 ${inv.used}/${inv.total}` : inv.remaining <= 2 ? `${rt} ⚠ 剩 ${inv.remaining} 間` : `${rt} (${inv.remaining} 間)`) : rt;
              return <option key={rt} value={rt} disabled={isFull}>{label}</option>;
            })}
          </select>
          {(() => {
            const inv = getHotelRoomInventory(selectedHotel, roomSelectValue, allStays, roommates, f.check_in, f.check_out, init?.id);
            if (!inv) return null;
            const isFull = inv.remaining <= 0;
            const isWarn = !isFull && inv.remaining <= 2;
            return (
              <p style={{ fontSize: 10, margin: "4px 0 0", color: isFull ? "var(--kincha)" : isWarn ? "#8B6914" : "var(--moegi)", fontWeight: 600 }}>
                {isFull ? `⛔ 已滿（${inv.used}/${inv.total} 間）` : isWarn ? `⚠ 剩餘 ${inv.remaining} 間（已用 ${inv.used}/${inv.total}）` : `✓ 剩餘 ${inv.remaining} 間（已用 ${inv.used}/${inv.total}）`}
              </p>
            );
          })()}
        </Field>
        {!isSpecialRoom && <Field label={t.roomNo}><input style={inpStyle} value={f.room_number} onChange={set("room_number")} placeholder={t.roomNoPending} /></Field>}
        {isSpecialRoom && <div />}
        <Field label={t.checkIn}><input type="date" style={inpStyle} value={f.check_in || ""} onChange={handleCheckInChange} /></Field>
        <Field label={t.checkOut}><input type="date" style={inpStyle} value={f.check_out || ""} onChange={handleCheckOutChange} /></Field>
        <Field label={t.totalAmt}><input style={{ ...inpStyle, background: "var(--washi)", fontWeight: 700, color: "var(--asagi)" }} value={totalAmount ? formatMoney(dispTotal, project, lang) : "—"} readOnly /></Field>
        <Field label={t.nights}><input style={{ ...inpStyle, background: "var(--washi)", textAlign: "center" }} value={nights || ""} readOnly /></Field>
      </div>
      {breakdown.length > 0 && (
        <div style={{ marginTop: 10, background: "var(--washi)", padding: 10 }}>
          <div style={{ fontSize: 9, fontWeight: 600, color: "var(--nezumi)", marginBottom: 6 }}>{t.breakdownTitle}</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
            {breakdown.map((b) => <span key={b.date} style={{ fontSize: 10, padding: "3px 8px", border: "1px solid var(--keisenL)", background: b.fromRule ? "rgba(74,127,165,.08)" : b.fromRoomRate ? "rgba(43,90,76,.07)" : "transparent" }}>{b.date.slice(5)} {formatMoney(convertMoney(b.price, project), project, lang)}{b.fromRule ? " *" : ""}</span>)}
          </div>
        </div>
      )}
      {!canSave && <p style={{ fontSize: 11, color: "var(--shu)" }}>{t.stayRequired}</p>}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
        <button type="button" onClick={onClose} style={{ padding: "8px 16px", border: "1px solid var(--keisenM)", background: "var(--shiro)", cursor: "pointer" }}>{t.cancel}</button>
        <button type="button" onClick={() => onSave({ ...f, nights, total_amount: totalAmount, base_price: null })} disabled={!canSave} style={pBtn(!canSave)}>{t.save}</button>
      </div>
    </div>
  );
}

const VEHICLE_REPORT_CIRC = [
  '①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳',
  '㉑','㉒','㉓','㉔','㉕','㉖','㉗','㉘','㉙','㉚','㉛','㉜','㉝','㉞','㉟',
  '㊱','㊲','㊳','㊴','㊵','㊶','㊷','㊸','㊹','㊺','㊻','㊼','㊽','㊾','㊿'
];

/** 1-100：1-50 用 Unicode 圈圈字，51-100 回傳數字字串，由呼叫端套用 CSS 圓形徽章 */
function vehicleCircLabel(n) {
  if (n >= 1 && n <= VEHICLE_REPORT_CIRC.length) return { text: VEHICLE_REPORT_CIRC[n - 1], css: false };
  if (n > VEHICLE_REPORT_CIRC.length && n <= 100) return { text: String(n), css: true };
  return { text: String(n), css: true };
}

function vehicleNoCirc(vehicleNo, index) {
  const raw = String(vehicleNo ?? "").trim();
  if (raw) {
    const n = parseInt(raw.replace(/^#/, ""), 10);
    if (!Number.isNaN(n) && n >= 1) return vehicleCircLabel(n);
    const m = raw.match(/\d+/);
    if (m) {
      const d = parseInt(m[0], 10);
      if (d >= 1) return vehicleCircLabel(d);
    }
  }
  if (index != null && index >= 0) return vehicleCircLabel(index + 1);
  return { text: "", css: false };
}

/** 渲染 vehicleCircLabel 結果：Unicode 直接顯示，51-100 用圓形徽章 */
function CircBadge({ label, isDriver }) {
  if (!label || !label.text) return null;
  if (!label.css) return <span>{label.text}</span>;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", justifyContent: "center",
      width: 20, height: 20, borderRadius: "50%", fontSize: 11, fontWeight: 600,
      border: `1px solid ${isDriver ? "var(--moegi)" : "var(--keisenM)"}`,
      color: isDriver ? "var(--moegi)" : "var(--nezumi)", flexShrink: 0, lineHeight: 1,
    }}>{label.text}</span>
  );
}

function vehicleDisplayTitle(v, index) {
  const name = (typeof v === "string" ? v : v?.name) || "—";
  const no = typeof v === "object" ? v?.vehicle_no : "";
  const circ = vehicleNoCirc(no, index);
  const prefix = circ.text ? (circ.css ? `(${circ.text})` : circ.text) : "";
  return `${prefix}${name}`;
}

function escReportHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function injectReportPreviewToolbar(html, printLabel, closeLabel) {
  const hasDiff = html.includes('class="diff-mark"');
  const diffToggleBtn = hasDiff ? `
<button type="button" id="diff-toggle-btn" onclick="(function(){
  var on = document.body.classList.toggle('diff-hidden');
  document.getElementById('diff-toggle-btn').style.background = on ? 'rgba(255,255,255,.12)' : '#e6a817';
  document.getElementById('diff-toggle-btn').textContent = on ? '👁 顯示差異' : '👁 隱藏差異';
})()" style="padding:8px 16px;border:1px solid rgba(255,255,255,.28);border-radius:6px;background:#e6a817;color:#fff;font-size:13px;cursor:pointer;font-weight:600;">👁 隱藏差異</button>` : "";
  const bar = `<div id="report-preview-bar" style="position:sticky;top:0;z-index:9999;display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 16px;background:#1a3028;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);font-family:'Noto Sans JP',sans-serif;">
<button type="button" onclick="window.print()" style="padding:8px 22px;border:none;border-radius:6px;background:#3e8470;color:#fff;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.04em;">🖨 ${escReportHtml(printLabel)}</button>
${diffToggleBtn}
<button type="button" onclick="window.close()" style="padding:8px 16px;border:1px solid rgba(255,255,255,.28);border-radius:6px;background:transparent;color:#fff;font-size:13px;cursor:pointer;">${escReportHtml(closeLabel)}</button>
</div>`;
  const diffHideStyle = `.diff-hidden .diff-mark{display:none!important;}.diff-hidden tr.diff-row td{background:white!important;}.diff-hidden tr.diff-row-deleted{display:none!important;}`;
  const printHide = `@media print{#report-preview-bar{display:none!important;}}`;
  let out = html.includes("</head>") ? html.replace("</head>", `<style>${printHide}\n${diffHideStyle}</style></head>`) : html;
  if (/<body[^>]*>/i.test(out)) return out.replace(/<body([^>]*)>/i, `<body$1>${bar}`);
  return bar + out;
}

function openReportPreviewWindow(html, { printLabel = "列印", closeLabel = "關閉" } = {}) {
  const doc = injectReportPreviewToolbar(html, printLabel, closeLabel);
  const w = window.open("", "_blank");
  if (w) {
    w.document.write(doc);
    w.document.close();
  } else {
    // 瀏覽器封鎖彈出視窗時，改用 Blob URL 在同頁籤開啟
    try {
      const blob = new Blob([doc], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    } catch (_) {
      alert("請允許瀏覽器開啟彈出視窗，或至瀏覽器設定將此頁面加入允許清單後再試一次。");
    }
  }
}

function VehicleRoutePreviewLine({ seg, lang, compact }) {
  const dur = formatVehicleTravelDuration(seg.pickup_time, seg.arrival_time, lang);
  const pickup = [seg.pickup_time, seg.pickup_location].filter(Boolean);
  const arrival = [seg.arrival_time, seg.arrival_location].filter(Boolean);
  if (!pickup.length && !arrival.length) return null;
  const timeStyle = compact
    ? { fontSize: 12, fontWeight: 700, color: "var(--sumiMid)", fontVariantNumeric: "tabular-nums" }
    : { fontSize: 16, fontWeight: 700, color: "var(--sumiMid)", letterSpacing: "0.03em", fontVariantNumeric: "tabular-nums" };
  const locStyle = compact
    ? { fontSize: 11.5, fontWeight: 600, color: "var(--sumi)" }
    : { fontSize: 14, fontWeight: 600, color: "var(--sumi)" };
  const durStyle = compact
    ? { fontSize: 12, fontWeight: 700, color: "var(--asagi)", whiteSpace: "nowrap", flexShrink: 0 }
    : { fontSize: 13, fontWeight: 700, color: "var(--asagi)", whiteSpace: "nowrap", flexShrink: 0 };
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10, lineHeight: 1.45, ...(compact ? { marginTop: 8, padding: "7px 10px", background: "rgba(43,90,76,.06)", borderRadius: 4 } : { marginTop: 4 }) }}>
      <span style={{ display: "inline-flex", alignItems: "baseline", flexWrap: "wrap", gap: 6, minWidth: 0 }}>
        {pickup.length > 0 && (
          <>
            {seg.pickup_time && <span style={timeStyle}>{seg.pickup_time}</span>}
            {seg.pickup_location && <span style={locStyle}>{seg.pickup_location}</span>}
          </>
        )}
        {pickup.length > 0 && arrival.length > 0 && <span style={{ fontSize: compact ? 11 : 13, color: "var(--nezumi)" }}>→</span>}
        {arrival.length > 0 && (
          <>
            {seg.arrival_time && <span style={timeStyle}>{seg.arrival_time}</span>}
            {seg.arrival_location && <span style={locStyle}>{seg.arrival_location}</span>}
          </>
        )}
      </span>
      {dur && <span style={durStyle}>({dur})</span>}
    </div>
  );
}

function VehicleCardDetails({ v, t, lang }) {
  const segs = normalizeVehicleRouteSegments(v);
  const totalDur = formatTotalVehicleTravelDuration(segs, lang);
  const hasMeta = v.driver_phone || v.license_plate || (totalDur && segs.length > 1);
  const hasBody = hasMeta || segs.length || v.note;
  if (!hasBody) return null;

  return (
    <div style={{ padding: "8px 14px", background: "var(--washi)", borderBottom: "1px solid var(--keisenL)", fontSize: 10.5, color: "var(--sumi)", lineHeight: 1.6 }}>
      {hasMeta && (
        <div style={{ opacity: 0.85 }}>
          {v.driver_phone && <span style={{ marginRight: 12 }}><strong>{t.driverPhone}:</strong> {v.driver_phone}</span>}
          {v.license_plate && <span style={{ marginRight: 12 }}><strong>{t.licensePlate}:</strong> {v.license_plate}</span>}
          {totalDur && segs.length > 1 && <span style={{ marginRight: 12 }}><strong>{t.totalTravelDuration}:</strong> {totalDur}</span>}
        </div>
      )}
      {segs.map((seg, i) => <VehicleRoutePreviewLine key={i} seg={seg} lang={lang} />)}
      {v.note && <div style={{ marginTop: 6, fontSize: 11, color: "var(--nezumi)" }}><strong>{t.vehicleNote}:</strong> {v.note}</div>}
    </div>
  );
}

function buildVehicleReportCards(vehicles, assignments, persons, lang, t) {
  return vehicles.map((v, vi) => {
    const assigns = assignments.filter((a) => a.vehicle_id === v.id);
    const cap = v.capacity || 4;
    const onboard = vehicleOnboardCount(assigns);
    const pax = assigns.map((a, i) => {
      const p = persons.find((x) => x.id === a.person_id);
      if (!p) return null;
      return {
        num: vehicleCircLabel(i + 1).css ? `(${i + 1})` : VEHICLE_REPORT_CIRC[i],
        name: p.name_kanji || `${p.last_roman || ""} ${p.first_roman || ""}`.trim() || "—",
        dept: (p.dept || "").trim(),
        isDriver: a.role === "driver",
      };
    }).filter(Boolean);
    const depts = [...new Set(pax.map((x) => x.dept).filter(Boolean))];
    const segments = normalizeVehicleRouteSegments(v);
    return {
      title: vehicleDisplayTitle(v, vi),
      sub: `${v.region || "—"} · ${v.type || "—"} · ${onboard}/${cap}${t.passengers_unit ? ` ${t.passengers_unit}` : ""}`,
      driverPhone: (v.driver_phone || "").trim(),
      licensePlate: (v.license_plate || "").trim(),
      totalDuration: formatTotalVehicleTravelDuration(segments, lang),
      segments,
      note: (v.note || "").trim(),
      pax,
      depts,
      paxCount: pax.length,
    };
  });
}

function generateVehicleReportHTML(cards, project, lang, t) {
  const projectName = escReportHtml(project?.name || "");

  const now = new Date().toLocaleDateString(lang === "ja" ? "ja-JP" : lang?.startsWith("zh") ? "zh-TW" : "en-US");
  const totalPax = cards.reduce((s, c) => s + c.paxCount, 0);
  const headerGrad = "linear-gradient(135deg,#1a3028 0%,#2d4a36 60%,#1a3028 100%)";
  const _vNow = new Date();
  const _vMm = String(_vNow.getMonth() + 1).padStart(2, "0");
  const _vDd = String(_vNow.getDate()).padStart(2, "0");
  const _rDocTitle = `${_vMm}月${_vDd}日_${t.reportTypeVehicle || "配車表"}_${project?.name || ""}`;

  const blocks = cards.map((c) => {
    const paxHtml = c.pax.length
      ? c.pax.map((p) => {
          const label = escReportHtml(p.name) + (p.dept && !p.isDriver ? `<span class="dept">(${escReportHtml(p.dept)})</span>` : "");
          return p.isDriver
            ? `<span class="drv">${p.num}${label}[${escReportHtml(t.driver)}]</span>`
            : `<span>${p.num}${label}</span>`;
        }).join('<span class="sep">·</span>')
      : `<span class="empty">—</span>`;
    const metaParts = [];
    if (c.driverPhone) metaParts.push(`<span class="lbl">${escReportHtml(t.driverPhone)}:</span> ${escReportHtml(c.driverPhone)}`);

    if (c.totalDuration && c.segments.length > 1) metaParts.push(`<span class="lbl">${escReportHtml(t.totalTravelDuration)}:</span> ${escReportHtml(c.totalDuration)}`);
    const meta = metaParts.length ? `<div class="ln meta">${metaParts.join('<span class="dot"> · </span>')}</div>` : "";
    const routes = vehicleRouteLinesHtml(c.segments, lang);
    const note = c.note ? `<div class="ln note"><span class="lbl">${escReportHtml(t.vehicleNote)}:</span> ${escReportHtml(c.note)}</div>` : "";
    return `<article class="card">
      <div class="hdr"><span class="nm">${escReportHtml(c.title)}</span><span class="sub">${escReportHtml(c.sub)}</span></div>
      <div class="body">${meta}${routes}<div class="pax">${paxHtml}</div>${note}</div>

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${_rDocTitle}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">

function openVehicleReportPrint(vehicles, assignments, persons, project, lang, t) {

function generateReportHTML({ type, cols, data, project, lang, t, vehicleCards, hotelSummary, diffInfo }) {
  const isLandscape = cols.length > 6;
  const pageDir = isLandscape ? "landscape" : "portrait";
  const projectName = project?.name || "";
  const now = new Date().toLocaleDateString(lang === "ja" ? "ja-JP" : lang?.startsWith("zh") ? "zh-TW" : "en-US");
  const typeLabel = { stay: t.reportTypeStay, flight: t.reportTypeFlight, staff: t.reportTypeStaff, vehicle: t.reportTypeVehicle }[type] || type;
  const _rNow = new Date();
  const _rMm = String(_rNow.getMonth() + 1).padStart(2, "0");
  const _rDd = String(_rNow.getDate()).padStart(2, "0");
  const _rDate = `${_rMm}月${_rDd}日`;
  const _rDocTitle = type === "flight"
    ? `${_rDate}_flight_${projectName}`
    : type === "staff"
      ? `${_rDate}_staff list_${projectName}`
      : `${typeLabel} — ${projectName}`;

  const headerGrad = "linear-gradient(135deg,#1a3028 0%,#2d4a36 60%,#1a3028 100%)";

  if (type === "vehicle" && vehicleCards) {
    return generateVehicleReportHTML(vehicleCards, project, lang, t);
  }

  // Legacy vehicle table (fallback)
  if (type === "vehicle") {
    const vehicles = [...new Set(data.map((r) => r.vehicle))].filter(Boolean);
    const vehicleBlocks = vehicles.map((vName) => {
      const passengers = data.filter((r) => r.vehicle === vName);
      const chips = passengers.map((r, i) => {
        const isDriver = r.role === (t.driver || "Driver") || r.role === "driver";
        const lbl = vehicleCircLabel(i + 1);
        const num = lbl.css ? `(${lbl.text})` : lbl.text;
        return `<span style="display:inline-flex;align-items:center;gap:3px;padding:4px 9px;margin:2px;border-radius:5px;font-size:9.5pt;background:${isDriver ? "rgba(43,90,76,.12)" : "#f4f9f5"};border:1px solid ${isDriver ? "rgba(43,90,76,.3)" : "#d8eed8"};font-weight:${isDriver ? 700 : 500};">
          <span style="font-size:9pt;color:${isDriver ? "#2b5a4c" : "#888"};">${num}</span>
          <span style="color:#1a2820;">${r.name_kanji || "—"}</span>
          ${isDriver ? `<span style="font-size:7.5pt;color:#2b5a4c;font-weight:700;margin-left:2px;">${t.driver}</span>` : ""}
        </span>`;
      }).join("");
      return `<div style="margin-bottom:14px;break-inside:avoid;">
        <div style="background:${headerGrad};color:#fff;padding:8px 14px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-family:'Noto Serif JP',serif;font-size:11.5pt;font-weight:600;letter-spacing:.03em;">${vName}</span>
          <span style="font-size:8.5pt;opacity:.75;">${passengers.length} ${t.passengers_unit}</span>
        </div>
        <div style="padding:8px 12px;border:1px solid #d8eed8;border-top:none;border-radius:0 0 6px 6px;background:#fff;line-height:1.8;">${chips || "<span style='color:#aaa;font-size:9pt;'>—</span>"}</div>
      </div>`;
    }).join("");
    const cols2 = isLandscape ? "columns:2;column-gap:14mm;" : "";
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${_rDocTitle}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">

<body>

<div style="text-align:right;font-size:8pt;opacity:.75;"><div>${now}</div><div>${vehicles.length} vehicles · ${data.length} pax</div></div></div>

  // Generic table report (stay / flight / staff)
  const thStyle = `padding:8px 12px;font-size:8pt;font-weight:700;letter-spacing:.07em;text-align:left;border-right:1px solid rgba(255,255,255,.15);white-space:nowrap;`;
  const tdStyle = `padding:7px 12px;font-size:9pt;border-bottom:1px solid #e0ebe4;border-right:1px solid #eaf0eb;vertical-align:top;line-height:1.7;`;

  const thead = `<tr style="background:${headerGrad};color:#fff;">${cols.map((c) => `<th style="${thStyle}">${c.label}</th>`).join("")}</tr>`;

  const amtColIdx = cols.findIndex((c) => c.key === "total_amt");
  const subtotalRowHtml = (label, amt, isGrand) => {
    const labelSpan = amtColIdx >= 0 ? amtColIdx : Math.max(cols.length - 1, 1);

    const cells = [];
    cells.push(`<td colspan="${labelSpan}" style="padding:9px 12px;font-weight:700;font-size:${isGrand?"10pt":"9pt"};background:${bg};color:${color};border-right:1px solid rgba(0,0,0,.06);">${label}</td>`);

  };

  const rows = []; let prevTier = -1; let tIdx = 0; let prevHotelKey = undefined; let groupSum = 0;

      if (prevHotelKey !== undefined && prevHotelKey !== "none") {
        rows.push(subtotalRowHtml(t.invoiceSubtotal || "小計", groupSum, false));

      groupSum = 0;
      if (row._hotelKey === "none") {
        rows.push(`<tr><td colspan="${cols.length}" style="${bannerS("#FAEEDA","#854F0B","#EF9F27")}">${t.unassignedRoomSection || "未安排住宿"} (${data.filter(r=>r._hotelKey==="none").length})</td></tr>`);
      } else {
        rows.push(hotelBannerHtml(row._hotelName || "—"));
      }

      prevTier = -1; tIdx = 0;

    if (type === "stay" && tier !== prevTier) {

      prevTier = tier; tIdx = 0;
    }
    const isAmber = tier === 2 || tier === 3;
    const isBlue  = tier === 1 || tier === 4;
    const bg = isAmber ? (tIdx%2===0?"#fffbf0":"#fff8e8") : isBlue ? (tIdx%2===0?"#f0f6ff":"#e8f0fb") : (tIdx%2===0?"#ffffff":"#f5faf6");
    // diff 標示（flight / staff）
    const _dEntry = (diffInfo && row._pid) ? diffInfo.map[row._pid] : null;
    const _dBg = _dEntry === "new" ? "background:#edfbf0;" : _dEntry === "changed" ? "background:#fffbe6;" : "";
    const _dBadge = _dEntry === "new"
      ? `<span class="diff-mark" style="display:inline-block;margin-left:5px;padding:1px 5px;background:#22a959;color:#fff;border-radius:3px;font-size:7pt;font-weight:700;vertical-align:middle;">新增</span>`

    tIdx++;

  if (type === "stay" && hotelSummary && hotelSummary.length) {

  let summaryHtml = "";
  if (type === "stay" && hotelSummary && hotelSummary.length) {
    const sumGuests = hotelSummary.reduce((s, h) => s + (h.guestCount || 0), 0);
    const sumRooms = hotelSummary.reduce((s, h) => s + (h.roomCount || 0), 0);
    const sumNights = hotelSummary.reduce((s, h) => s + (h.roomNights || 0), 0);
    const sumCost = hotelSummary.reduce((s, h) => s + (h.cost || 0), 0);
    const sumRows = hotelSummary.map((h) => `
      <tr>
        <td style="padding:6px 12px;font-size:8.5pt;font-weight:600;border-bottom:1px solid #e0ebe4;">${h.hotelName}</td>
        <td style="padding:6px 12px;font-size:8pt;color:#789;border-bottom:1px solid #e0ebe4;white-space:nowrap;">${h.dateRange}</td>
        <td style="padding:6px 12px;font-size:8.5pt;text-align:right;border-bottom:1px solid #e0ebe4;font-variant-numeric:tabular-nums;">${h.guestCount}</td>
        <td style="padding:6px 12px;font-size:8.5pt;text-align:right;border-bottom:1px solid #e0ebe4;font-variant-numeric:tabular-nums;">${h.roomCount}</td>
        <td style="padding:6px 12px;font-size:8.5pt;text-align:right;border-bottom:1px solid #e0ebe4;font-variant-numeric:tabular-nums;">${h.roomNights}</td>
        <td style="padding:6px 12px;font-size:9pt;font-weight:700;text-align:right;border-bottom:1px solid #e0ebe4;font-variant-numeric:tabular-nums;color:#185FA5;">${formatMoney(convertMoney(h.cost, project), project, lang)}</td>
      </tr>`).join("");
    summaryHtml = `
<div style="margin-bottom:14px;border:1px solid #d8eed8;border-radius:6px;overflow:hidden;break-inside:avoid;">
  <div style="background:#eaf2ec;padding:7px 12px;font-size:8.5pt;font-weight:700;letter-spacing:.08em;color:#3B6D11;">${t.hotelStatsByDate || "飯店統計"}</div>
  <table style="box-shadow:none;border-radius:0;">
    <thead><tr style="background:#f5faf6;">
      <th style="padding:6px 12px;font-size:8pt;text-align:left;font-weight:700;color:#5f5e5a;">${t.hotelName || "飯店"}</th>
      <th style="padding:6px 12px;font-size:8pt;text-align:left;font-weight:700;color:#5f5e5a;">${t.checkIn || "日期"}</th>
      <th style="padding:6px 12px;font-size:8pt;text-align:right;font-weight:700;color:#5f5e5a;">${t.stayGuestCount || "人數"}</th>
      <th style="padding:6px 12px;font-size:8pt;text-align:right;font-weight:700;color:#5f5e5a;">${t.stayRoomCount || "間數"}</th>
      <th style="padding:6px 12px;font-size:8pt;text-align:right;font-weight:700;color:#5f5e5a;">${t.roomNights || "客室泊數"}</th>
      <th style="padding:6px 12px;font-size:8pt;text-align:right;font-weight:700;color:#5f5e5a;">${t.totalSpend || "金額"}</th>
    </tr></thead>
    <tbody>${sumRows}
      <tr style="background:${headerGrad};color:#fff;">
        <td colspan="2" style="padding:7px 12px;font-size:8.5pt;font-weight:700;">${t.totalCost || "總計"}</td>
        <td style="padding:7px 12px;font-size:8.5pt;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;">${sumGuests}</td>
        <td style="padding:7px 12px;font-size:8.5pt;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;">${sumRooms}</td>
        <td style="padding:7px 12px;font-size:8.5pt;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;">${sumNights}</td>
        <td style="padding:7px 12px;font-size:10pt;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;">${formatMoney(convertMoney(sumCost, project), project, lang)}</td>
      </tr>
    </tbody>
  </table>
</div>`;
  }

  // diff bar（flight / staff 限定）
  const _grDiffBar = (() => {
    if (!diffInfo || !diffInfo.snapTime) return "";
    const nNew = Object.values(diffInfo.map).filter(v => v === "new").length;
    const nChg = Object.values(diffInfo.map).filter(v => v === "changed").length;
    const nDel = diffInfo.deleted || 0;
    const anyDiff = nNew + nChg + nDel > 0;
    if (anyDiff) return `
<div class="diff-mark" style="margin-bottom:12px;padding:8px 14px;border-radius:5px;border:1px solid #d4c060;background:#fffbe6;display:flex;align-items:center;gap:14px;flex-wrap:wrap;break-inside:avoid;">
  <span style="font-size:8pt;color:#7a6010;font-weight:700;">與 ${diffInfo.snapTime} 版本比較</span>
  ${nNew > 0 ? `<span style="padding:1px 8px;background:#22a959;color:#fff;border-radius:3px;font-size:7.5pt;font-weight:700;">新增 ${nNew}</span>` : ""}
  ${nChg > 0 ? `<span style="padding:1px 8px;background:#e6a817;color:#fff;border-radius:3px;font-size:7.5pt;font-weight:700;">變更 ${nChg}</span>` : ""}
  ${nDel > 0 ? `<span style="padding:1px 8px;background:#c0392b;color:#fff;border-radius:3px;font-size:7.5pt;font-weight:700;">刪除 ${nDel}</span>` : ""}
</div>`;
    return `
<div class="diff-mark" style="margin-bottom:12px;padding:7px 14px;border-radius:5px;border:1px solid #b8d8c0;background:#f0faf3;break-inside:avoid;">
  <span style="font-size:8pt;color:#2a6040;">✓ 與 ${diffInfo.snapTime} 版本相比，無任何變更</span>
</div>`;
  })();

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${_rDocTitle}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Noto Sans JP',sans-serif;font-size:9pt;color:#1a2820;background:#fff;}
@page{size:A4 ${pageDir};margin:12mm 14mm;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
.doc-header{background:${headerGrad};color:#fff;padding:14px 18px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;border-radius:4px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.09);}
.footer{margin-top:14px;font-size:7pt;color:#aaa;text-align:right;border-top:1px solid #d8e8dc;padding-top:6px;}</style></head>
<body style="padding:2mm;">
<div class="doc-header"><div><div style="font-size:8pt;opacity:.7;letter-spacing:.1em;text-transform:uppercase;">${typeLabel}</div><div style="font-family:'Noto Serif JP',serif;font-size:13pt;font-weight:600;margin-top:3px;">${projectName}</div></div>
<div style="text-align:right;font-size:8pt;opacity:.75;"><div>${now}</div><div>${data.length} rows · ${isLandscape ? "A4 Landscape" : "A4 Portrait"}</div></div></div>
${_grDiffBar}${summaryHtml}
<table><thead>${thead}</thead><tbody>${rows.join("")}</tbody></table>
<div class="footer">${projectName} · ${typeLabel} · ${now}</div>
</body></html>`;
}

function ReportExportModal({ onClose, t, lang, project, persons, flights, stays, flatStays, personsNoStay, hotels, pricingRules, vehicles, vehicleAssignments, personIndex, stayDisplayTotals, hotelCumulativeStats }) {
  const [reportType, setReportType] = useState("stay");
  const ALL_COLS = {
    stay: [
      { key: "no", label: t.no, default: true },
      { key: "dept", label: t.dept, default: true },
      { key: "name_kanji", label: t.nameKanji, default: true },
      { key: "name_roman", label: t.nameEnglish, default: true },
      { key: "hotel", label: t.hotel, default: true },
      { key: "room_no", label: t.roomNo, default: true },
      { key: "room_type", label: t.roomType, default: true },
      { key: "check_in", label: t.checkIn, default: true },
      { key: "check_out", label: t.checkOut, default: true },
      { key: "nights", label: t.nights, default: true },
      { key: "total_amt", label: t.totalAmt, default: true },
      { key: "stay_label", label: t.staySegment, default: false },
      { key: "special_room", label: t.specialRoom, default: false },
    ],
    flight: [
      { key: "no", label: t.no, default: true },
      { key: "dept", label: t.dept, default: true },
      { key: "name_kanji", label: t.nameKanji, default: true },
      { key: "name_roman", label: t.nameEnglish, default: true },
      { key: "airline", label: t.airline, default: true },
      { key: "flight_no", label: t.flightNo, default: true },
      { key: "cabin", label: t.cabin, default: true },
      { key: "pnr", label: t.pnr, default: false },
      { key: "dep_airport", label: t.depAirport, default: true },
      { key: "dep_time", label: t.depTime, default: true },
      { key: "arr_airport", label: t.arrAirport, default: true },
      { key: "arr_time", label: t.arrTime, default: true },
      { key: "ret_airline", label: `${t.flightReturn}${t.airline}`, default: true },
      { key: "ret_flight_no", label: `${t.flightReturn}${t.flightNo}`, default: true },
      { key: "ret_dep_airport", label: `${t.flightReturn}${t.depAirport}`, default: false },
      { key: "ret_dep_time", label: `${t.flightReturn}${t.depTime}`, default: true },
      { key: "ret_arr_airport", label: `${t.flightReturn}${t.arrAirport}`, default: false },
      { key: "ret_arr_time", label: `${t.flightReturn}${t.arrTime}`, default: true },
    ],
    staff: [
      { key: "no", label: t.no, default: true },
      { key: "dept", label: t.dept, default: true },
      { key: "title", label: t.jobTitle, default: true },
      { key: "name_kanji", label: t.nameKanji, default: true },
      { key: "name_roman", label: t.nameEnglish, default: true },
      { key: "importance", label: t.importance, default: false },
      { key: "passport", label: t.passport, default: true },
      { key: "dob", label: t.dob, default: false },
      { key: "passport_exp", label: t.passportExp, default: true },
      { key: "diet", label: t.dietNotes, default: false },
      { key: "on_site", label: t.onSite, default: false },
    ],
    vehicle: [
      { key: "vehicle", label: t.vehicleMgmt, default: true },
      { key: "dept", label: t.dept, default: true },
      { key: "name_kanji", label: t.nameKanji, default: true },
      { key: "name_roman", label: t.nameEnglish, default: true },
      { key: "role", label: t.driver + "/" + t.passengers, default: true },
    ],
  };
  const cols = ALL_COLS[reportType] || [];
  const [selCols, setSelCols] = useState(() => Object.fromEntries(cols.map((c) => [c.key, c.default])));

  useEffect(() => {
    setSelCols(Object.fromEntries((ALL_COLS[reportType] || []).map((c) => [c.key, c.default])));
  }, [reportType]);

  let lastHotelSummary = null;
  const buildData = () => {
    const sel = cols.filter((c) => selCols[c.key]);
    if (reportType === "stay") {
      const src = flatStays && flatStays.length >= 0 ? flatStays : stays;
      const toRow = (s, _tier) => {
        const p = s.person_id ? persons.find((x) => x.id === s.person_id) : null;
        const h = hotels.find((x) => x.id == s.hotel_id);
        const nights = diffDays(s.check_in, s.check_out);
        const amt = stayDisplayTotals ? stayDisplayTotals[s.id] : (s.total_amount || 0);
        return {
          no: s.special_room_name ? "—" : (personIndex[s.person_id] || "—"),
          dept: p?.dept || "—",
          name_kanji: s.special_room_name ? `[${s.special_room_name}]` : (p?.name_kanji || "—"),
          name_roman: p ? `${p.last_roman || ""} ${p.first_roman || ""}`.trim() : "—",
          hotel: h?.name || "—",
          room_no: s.room_number || "—",
          room_type: s.room_type === "Custom" ? (s.room_custom || "Custom") : (s.room_type || "—"),
          check_in: s.check_in || "—",
          check_out: s.check_out || "—",
          nights: nights > 0 ? String(nights) : "—",
          total_amt: amt ? formatMoney(convertMoney(amt, project), project, lang) : "—",
          stay_label: s.stay_label || "—",
          special_room: s.special_room_name || "—",
          _tier: _tier,
          _hotelId: s.hotel_id != null ? String(s.hotel_id) : null,
          _hotelName: h?.name || null,
          _amt: amt || 0,
        };
      };
      const sortFn = (a, b) => {
        const noA = personIndex[a.person_id] || 9999;
        const noB = personIndex[b.person_id] || 9999;
        if (noA !== noB) return noA - noB;
        const dA = ((a.person?.dept)||(persons.find((x)=>x.id===a.person_id)?.dept)||"").toLowerCase();
        const dB = ((b.person?.dept)||(persons.find((x)=>x.id===b.person_id)?.dept)||"").toLowerCase();
        if (dA !== dB) return dA.localeCompare(dB, undefined, { sensitivity: "base" });
        if ((a.check_in||"") !== (b.check_in||"")) return (a.check_in||"").localeCompare(b.check_in||"");
        return (a.check_out||"").localeCompare(b.check_out||"");
      };
      const normalAssigned   = src.filter((s) => !s.special_room_name &&  s.room_number).sort(sortFn);
      const specialAssigned  = src.filter((s) =>  s.special_room_name &&  s.room_number).sort(sortFn);
      const normalUnassigned = src.filter((s) => !s.special_room_name && !s.room_number).sort(sortFn);
      const specialUnassigned= src.filter((s) =>  s.special_room_name && !s.room_number).sort(sortFn);
      const noStayRows = (personsNoStay || [])
        .sort((a,b) => (personIndex[a.id]||9999)-(personIndex[b.id]||9999))
        .map((p) => ({
          no: personIndex[p.id] || "—", dept: p.dept || "—",
          name_kanji: p.name_kanji || "—",
          name_roman: `${p.last_roman||""} ${p.first_roman||""}`.trim() || "—",
          hotel:"—", room_no:"—", room_type:"—", check_in:"—", check_out:"—",
          nights:"—", total_amt:"—", stay_label:"—", special_room:"—", _tier: 3,
          _hotelId: null, _hotelName: null, _amt: 0,
        }));

      // 依飯店分組：每間飯店內維持原本的 tier 排序（已配房 → 專用空間 → 待配房號 → 專用空間未配房）
      const allRows = [
        ...normalAssigned.map((s) => toRow(s, 0)),
        ...specialAssigned.map((s) => toRow(s, 1)),
        ...normalUnassigned.map((s) => toRow(s, 2)),
        ...specialUnassigned.map((s) => toRow(s, 4)),
      ];
      const byHotel = new Map();
      allRows.forEach((r) => {
        const key = r._hotelId ?? "none";
        if (!byHotel.has(key)) byHotel.set(key, { hotelId: r._hotelId, hotelName: r._hotelName, rows: [] });
        byHotel.get(key).rows.push(r);
      });
      const hotelGroups = [...byHotel.values()];
      hotelGroups.sort((a, b) => {
        const minA = a.rows.map((r) => r.check_in).filter((x) => x !== "—").sort()[0] || "";
        const minB = b.rows.map((r) => r.check_in).filter((x) => x !== "—").sort()[0] || "";
        if (minA !== minB) return minA.localeCompare(minB);
        return (a.hotelName || "").localeCompare(b.hotelName || "", lang === "ja" ? "ja" : "zh-Hant");
      });
      hotelGroups.forEach((g) => {
        g.rows = [...g.rows].sort((a, b) => (a._tier ?? 0) - (b._tier ?? 0));
        g.rows.forEach((r) => { r._hotelKey = String(g.hotelId); });
      });
      noStayRows.forEach((r) => { r._hotelKey = "none"; });

      // 所有飯店統計（供報表頂部摘要表使用）
      lastHotelSummary = hotelGroups.map((g) => {
        const meta = computeHotelGroupMeta(g.rows.map((r) => ({
          check_in: r.check_in !== "—" ? r.check_in : null,
          check_out: r.check_out !== "—" ? r.check_out : null,
          person_id: r.no !== "—" ? 1 : null,
          special_room_name: r.special_room || null,
          room_number: r.room_no !== "—" ? r.room_no : null,
          hotel_id: g.hotelId,
          id: r.no + "-" + r.room_no,
        })));
        const cs = (hotelCumulativeStats && (hotelCumulativeStats[g.hotelId] || hotelCumulativeStats[+g.hotelId])) || {};
        const cost = cs.cost != null ? cs.cost : g.rows.reduce((s, r) => s + (r._amt || 0), 0);
        return {
          hotelName: g.hotelName || "—",
          guestCount: meta.guestCount,
          roomCount: meta.roomCount,
          roomNights: cs.roomNights || 0,
          cost,
          dateRange: meta.minIn && meta.maxOut ? `${fmtDate(meta.minIn, lang)} ～ ${fmtDate(meta.maxOut, lang)}` : "—",
        };
      });

      return [
        ...hotelGroups.flatMap((g) => g.rows),
        ...noStayRows,
      ];
    }
    if (reportType === "flight") {
      return persons.filter((p) => !p.hide_from_flights).map((p) => {
        const fl = flights.find((x) => x.person_id === p.id);
        const fmtTs = (ts) => { const v = toDatetimeLocalValue(ts); return v ? v.replace("T", " ") : "—"; };
        return {
          _pid: p.id,
          no: personIndex[p.id] || "",
          dept: p.dept || "—",
          name_kanji: p.name_kanji || "—",
          name_roman: `${p.last_roman || ""} ${p.first_roman || ""}`.trim() || "—",
          airline: fl?.airline || "—",
          flight_no: fl?.flight_no || "—",
          cabin: fl?.cabin || "—",
          pnr: fl?.pnr || "—",
          dep_airport: fl?.dep_airport || "—",
          dep_time: fmtTs(fl?.dep_time),
          arr_airport: fl?.arr_airport || "—",
          arr_time: fmtTs(fl?.arr_time),
          ret_airline: fl?.ret_airline || "—",
          ret_flight_no: fl?.ret_flight_no || "—",
          ret_dep_airport: fl?.ret_dep_airport || "—",
          ret_dep_time: fmtTs(fl?.ret_dep_time),
          ret_arr_airport: fl?.ret_arr_airport || "—",
          ret_arr_time: fmtTs(fl?.ret_arr_time),
        };
      });
    }
    if (reportType === "staff") {
      return [...persons]
        .sort((a, b) => (personIndex[a.id] || 9999) - (personIndex[b.id] || 9999))
        .map((p) => ({
        _pid: p.id,
        no: personIndex[p.id] || "",
        dept: p.dept || "—",
        title: [p.title_kanji, p.title_other].filter(Boolean).join(" / ") || "—",
        name_kanji: p.name_kanji || "—",
        name_roman: `${p.last_roman || ""} ${p.first_roman || ""}`.trim() || "—",
        importance: p.importance ? "★".repeat(+p.importance) : "—",
        passport: p.passport || "—",
        dob: p.dob || "—",
        passport_exp: p.passport_exp || "—",
        diet: p.diet || "—",
        on_site: (!p.hide_from_stays && !p.hide_from_vehicles) ? "✓" : [p.hide_from_stays ? "住宿×" : "", p.hide_from_vehicles ? "派車×" : ""].filter(Boolean).join(" "),
      }));
    }
    if (reportType === "vehicle") {
      const rows = [];
      vehicleAssignments.forEach((a) => {
        const v = vehicles.find((x) => x.id === a.vehicle_id);
        const p = persons.find((x) => x.id === a.person_id);
        if (!v || !p) return;
        rows.push({ vehicle: v.name, dept: p.dept || "—", name_kanji: p.name_kanji || "—", name_roman: `${p.last_roman || ""} ${p.first_roman || ""}`.trim() || "—", role: a.role === "driver" ? t.driver : t.passengers });
      });
      return rows;
    }
    return [];
  };

  const handlePreview = () => {
    if (reportType === "vehicle") {
      openVehicleReportPrint(vehicles, vehicleAssignments, persons, project, lang, t);
      return;
    }
    const sel = cols.filter((c) => selCols[c.key]);
    const rawRows = buildData();
    const data = rawRows.map((row) => {
      const out = {};
      sel.forEach((c) => { out[c.key] = row[c.key]; });
      out._tier = row._tier;
      out._hotelKey = row._hotelKey;
      out._hotelName = row._hotelName;
      out._amt = row._amt;
      out._pid = row._pid;
      return out;
    });

    // ── 快照差異（flight / staff）──────────────────────────
    let diffInfo = null;
    if (reportType === "flight" || reportType === "staff") {
      const _sKey = `reportSnapshot_${project?.id || "default"}_${reportType}`;
      const _fmtSnapTime = (ts) => {
        const d = new Date(ts);
        return `${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      };
      // 序列化目前資料快照（以 person_id 為 key，值為 JSON 字串）
      const _buildSnap = (rows) => {
        const m = {};
        rows.forEach((r) => {
          if (!r._pid) return;
          const snap = {};
          if (reportType === "flight") {
            const fl = flights.find((x) => x.person_id === r._pid);
            snap.airline = fl?.airline || ""; snap.flight_no = fl?.flight_no || "";
            snap.dep_airport = fl?.dep_airport || ""; snap.dep_time = fl?.dep_time || "";
            snap.arr_airport = fl?.arr_airport || ""; snap.arr_time = fl?.arr_time || "";
            snap.ret_airline = fl?.ret_airline || ""; snap.ret_flight_no = fl?.ret_flight_no || "";
            snap.ret_dep_time = fl?.ret_dep_time || ""; snap.ret_arr_time = fl?.ret_arr_time || "";
          } else {
            const p = persons.find((x) => x.id === r._pid);
            snap.dept = p?.dept || ""; snap.title_kanji = p?.title_kanji || "";
            snap.name_kanji = p?.name_kanji || ""; snap.last_roman = p?.last_roman || "";
            snap.first_roman = p?.first_roman || ""; snap.importance = p?.importance || 0;
            snap.passport = p?.passport || ""; snap.dob = p?.dob || "";
            snap.passport_exp = p?.passport_exp || "";
          }
          m[String(r._pid)] = JSON.stringify(snap);
        });
        return m;
      };
      let _oldSnap = null;
      try { _oldSnap = JSON.parse(localStorage.getItem(_sKey) || "null"); } catch {}
      const _nowSnap = { ts: Date.now(), rows: _buildSnap(rawRows) };
      // 存快照（本次即成為下次基準）
      try { localStorage.setItem(_sKey, JSON.stringify(_nowSnap)); } catch {}

      if (_oldSnap) {
        const snapTime = _fmtSnapTime(_oldSnap.ts);
        const diffMap = {};
        const currentPids = new Set(rawRows.map((r) => String(r._pid)).filter(Boolean));
        // 新增 / 變更
        rawRows.forEach((r) => {
          if (!r._pid) return;
          const pid = String(r._pid);
          const oldVal = _oldSnap.rows[pid];
          const newVal = _nowSnap.rows[pid];
          if (!oldVal) { diffMap[pid] = "new"; }
          else if (oldVal !== newVal) { diffMap[pid] = "changed"; }
        });
        // 刪除（快照有、現在沒有）
        const deleted = Object.keys(_oldSnap.rows).filter((pid) => !currentPids.has(pid)).length;
        diffInfo = { map: diffMap, snapTime, deleted };
      }
    }

    const html = generateReportHTML({ type: reportType, cols: sel, data, project, lang, t, hotelSummary: lastHotelSummary, diffInfo });
    openReportPreviewWindow(html, { printLabel: t.print, closeLabel: t.cancel });
  };

  const typeKeys = ["stay", "flight", "staff", "vehicle"];
  const typeLabels = { stay: t.reportTypeStay, flight: t.reportTypeFlight, staff: t.reportTypeStaff, vehicle: t.reportTypeVehicle };
  const selCount = cols.filter((c) => selCols[c.key]).length;

  return (
    <Modal title={t.reportExport} onClose={onClose}>
      <div style={{ display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap" }}>
        {typeKeys.map((k) => (

// ─── 請款對帳面板 ─────────────────────────────────────────────
/** 依連續相同房價切分請款列（對齊飯店帳單，避免均價產生小數） */
function buildInvoicePriceSegmentRows({ checkIn, totalNights, roomLabel, roomCount, subLabel, nightUnitPrice }) {
  const rows = [];
  let i = 0;
  while (i < totalNights) {
    const price = nightUnitPrice(i);
    if (price == null) { i += 1; continue; }
    let j = i + 1;
    while (j < totalNights && nightUnitPrice(j) === price) j += 1;
    const segNights = j - i;
    const startD = parseLocalDate(checkIn); startD.setDate(startD.getDate() + i);
    const endD = parseLocalDate(checkIn); endD.setDate(endD.getDate() + j);
    rows.push({
      check_in: localDateStr(startD),
      check_out: localDateStr(endD),
      roomLabel,
      subLabel,
      roomCount,
      nights: segNights,
      unitPrice: price,
      batchTotal: price * roomCount * segNights,
    });
    i = j;
  }
  return rows;
}

/**
 * 對齊飯店請款習慣：同飯店內，相同入住日+退房日+房型合併為一批
 * 公式：單價 × 間數 × 晚數（間數依房號或人數；每晚依 pricing_rules 計價）
 */
/** 從同一群住宿記錄中挑「代表」：優先天數較長者；天數相同時優先選有實際計費(total_amount>0)的那筆 */
function pickRepStay(candidates, getStay) {
  return candidates.reduce((best, cur) => {
    const sCur = getStay(cur);
    const sBest = getStay(best);
    const dCur = diffDays(sCur.check_in, sCur.check_out);
    const dBest = diffDays(sBest.check_in, sBest.check_out);
    if (dCur !== dBest) return dCur > dBest ? cur : best;
    const curHasFee = Number(sCur.total_amount) > 0;
    const bestHasFee = Number(sBest.total_amount) > 0;
    if (curHasFee && !bestHasFee) return cur;
    return best;
  }, candidates[0]);
}

function buildInvoiceBatchesMerged(stays, pricingRules, hotels) {
  const hMap = Object.fromEntries(hotels.map((h) => [+h.id, h]));

  const byUnit = {};
  stays.forEach((s) => {
    if (!s.hotel_id || !s.check_in || !s.check_out) return;
    const hid = +s.hotel_id;
    const rn = (s.room_number || "").trim();
    const unitKey = s.special_room_name
      ? `special:${s.id}`
      : rn ? `room:${hid}:${rn}` : `person:${s.person_id}`;
    if (!byUnit[unitKey]) byUnit[unitKey] = { hid, stays: [], minIn: null, maxOut: null };
    const u = byUnit[unitKey];
    u.stays.push(s);
    if (!u.minIn || s.check_in < u.minIn) u.minIn = s.check_in;
    if (!u.maxOut || s.check_out > u.maxOut) u.maxOut = s.check_out;
  });

  const byBatch = {};
  Object.values(byUnit).forEach(({ hid, stays: unitStays, minIn, maxOut }) => {
    if (!minIn || !maxOut) return;
    const rep = pickRepStay(unitStays, (s) => s);
    const roomLabel = rep.room_type === "Custom" ? (rep.room_custom || "Custom") : (rep.room_type || "—");
    const bk = `${hid}|${minIn}|${maxOut}|${roomLabel}`;
    if (!byBatch[bk]) byBatch[bk] = { hid, check_in: minIn, check_out: maxOut, roomLabel, units: [] };
    byBatch[bk].units.push({ rep, unitStays });
  });

  const byHotelResult = {};
  Object.values(byBatch).forEach(({ hid, check_in, check_out, roomLabel, units }) => {
    const nights = diffDays(check_in, check_out);
    if (nights <= 0) return;
    const roomCount = units.length;
    const allUnitStays = units.flatMap((u) => u.unitStays);
    const fallbackRep = pickRepStay(units, (u) => u.rep).rep;
    const segments = buildInvoicePriceSegmentRows({
      checkIn: check_in,
      totalNights: nights,
      roomLabel,
      roomCount,
      subLabel: null,
      nightUnitPrice: (i) => {
        const d = parseLocalDate(check_in); d.setDate(d.getDate() + i);
        const ds = localDateStr(d);
        const active = allUnitStays.filter((s) => stayActiveOnDate(s, ds));
        const priceRep = active.length ? pickRepStay(active, (s) => s) : fallbackRep;
        return stayNightPriceFromRules(priceRep, ds, pricingRules, hMap);
      },
    });
    const roomGroups = buildBatchRoomGroups(allUnitStays);
    const batchTotal = segments.reduce((s, seg) => s + seg.batchTotal, 0);
    if (!byHotelResult[hid]) byHotelResult[hid] = { hotel: hMap[hid], hid, batches: [] };
    byHotelResult[hid].batches.push({
      check_in, check_out, roomLabel, roomCount, nights, segments, batchTotal, roomGroups,
    });
  });

  const result = Object.values(byHotelResult).map((h) => {
    h.batches.sort((a, b) => a.check_in.localeCompare(b.check_in) || a.check_out.localeCompare(b.check_out) || a.roomLabel.localeCompare(b.roomLabel));
    h.hotelTotal = h.batches.reduce((s, b) => s + b.batchTotal, 0);
    return h;
  });
  result.sort((a, b) => (a.hotel?.name || "").localeCompare(b.hotel?.name || ""));
  return result;
}

function buildBatchRoomGroups(batchStays) {
  const grouped = {};
  batchStays.forEach((s) => {
    const label = s.special_room_name || (s.room_number || "").trim() || "—";
    if (!grouped[label]) grouped[label] = { label, stays: [] };
    grouped[label].stays.push(s);
  });
  return Object.values(grouped).sort((a, b) => a.label.localeCompare(b.label, undefined, { numeric: true }));
}

/** 逐間明細：依房號／每人／專用空間各算一行 */
function buildInvoiceBatchesPerRoom(stays, pricingRules, hotels) {
  const hMap = Object.fromEntries(hotels.map((h) => [+h.id, h]));
  const hotelUnitMap = {};
  stays.forEach((s) => {
    if (!s.hotel_id || !s.check_in || !s.check_out) return;
    const hid = +s.hotel_id;
    if (!hotelUnitMap[hid]) hotelUnitMap[hid] = {};
    const uk = buildInvoiceUnitKey(s);
    if (!hotelUnitMap[hid][uk]) hotelUnitMap[hid][uk] = { stays: [] };
    hotelUnitMap[hid][uk].stays.push(s);
  });

  const result = [];
  Object.entries(hotelUnitMap).forEach(([hidStr, unitMap]) => {
    const hid = +hidStr;
    const hotel = hMap[hid];
    const batches = [];

    Object.values(unitMap).forEach(({ stays: unitStays }) => {
      let minIn = null;
      let maxOut = null;
      unitStays.forEach((s) => {
        if (!minIn || s.check_in < minIn) minIn = s.check_in;
        if (!maxOut || s.check_out > maxOut) maxOut = s.check_out;
      });
      if (!minIn || !maxOut) return;
      const spanNights = diffDays(minIn, maxOut);
      if (spanNights <= 0) return;

      const rep = unitStays[0];
      const roomLabel = rep.room_type === "Custom" ? (rep.room_custom || "Custom") : (rep.room_type || "—");
      const rn = (rep.room_number || "").trim();
      const subLabel = rep.special_room_name ? rep.special_room_name : rn;
      const feeMap = Object.fromEntries(unitStays.map((s) => [s.id, calcStayTotalFromRules(s, pricingRules, hotels)]));

      buildInvoicePriceSegmentRows({
        checkIn: minIn,
        totalNights: spanNights,
        roomLabel,
        roomCount: 1,
        subLabel,
        nightUnitPrice: (i) => {
          const d = parseLocalDate(minIn); d.setDate(d.getDate() + i);
          const ds = localDateStr(d);
          const occupants = unitStays.filter((s) => stayActiveOnDate(s, ds));
          if (!occupants.length) return null;
          const payer = occupants.length === 1 ? occupants[0] : pickSharedRoomPayer(occupants, feeMap);
          return stayNightPriceFromRules(payer, ds, pricingRules, hMap);
        },
      }).forEach((row) => batches.push(row));
    });

    batches.sort((a, b) => a.check_in.localeCompare(b.check_in) || (a.subLabel || "").localeCompare(b.subLabel || ""));
    const hotelTotal = batches.reduce((s, b) => s + b.batchTotal, 0);
    result.push({ hotel, hid, batches, hotelTotal });
  });

  result.sort((a, b) => (a.hotel?.name || "").localeCompare(b.hotel?.name || ""));
  return result;
}

  const mergedTotal = mergedData.reduce((s, h) => s + h.hotelTotal, 0);
  const perRoomTotal = perRoomData.reduce((s, h) => s + h.hotelTotal, 0);
  const totalsDiffer = Math.abs(mergedTotal - perRoomTotal) > 0.5;
  const modeHint = invoiceMode === "merged" ? t.invoiceModeMergedHint : t.invoiceModePerRoomHint;
  const modeBtn = (mode, label) => (
    <button
      type="button"
      onClick={() => setInvoiceMode(mode)}
      style={{
        padding: "7px 16px", border: "none", cursor: "pointer", fontSize: 12,
        fontWeight: invoiceMode === mode ? 700 : 500,
        color: invoiceMode === mode ? "var(--sumi)" : "var(--nezumi)",
        background: invoiceMode === mode ? "var(--shiro)" : "transparent",
        borderRadius: 6,
        boxShadow: invoiceMode === mode ? "0 1px 4px rgba(0,0,0,.08)" : "none",
        fontFamily: "inherit",
      }}
    >{label}</button>
  );

  // ── 快照工具 ──────────────────────────────────────────────
  const _snapKey = `hotelChecklistSnapshot_${project?.id || "default"}`;

  const _buildSnapshot = (hotelData) => ({
    ts: Date.now(),
    hotels: hotelData.map((hd) => ({
      hid: String(hd.hid),
      name: hd.hotel?.name || "",
      total: hd.hotelTotal,
      batches: (hd.batches || []).map((b) => ({
        key: `${b.check_in}|${b.check_out}|${b.roomLabel}`,
        check_in: b.check_in,
        check_out: b.check_out,
        roomLabel: b.roomLabel,
        roomCount: b.roomCount,
        nights: b.nights,
        batchTotal: b.batchTotal,
      })),
    })),
  });

  const _loadSnapshot = () => {
    try { return JSON.parse(localStorage.getItem(_snapKey) || "null"); } catch { return null; }
  };

  const _saveSnapshot = (hotelData) => {
    try { localStorage.setItem(_snapKey, JSON.stringify(_buildSnapshot(hotelData))); } catch {}
  };

  // 比對單一飯店的 batches，回傳每個 batch 的狀態 map（key → "new"|"changed"|"deleted"|null）
  const _diffBatches = (oldBatches, newBatches) => {
    const result = {}; // key → { status, old }
    const oldMap = {};
    (oldBatches || []).forEach((b) => { oldMap[b.key] = b; });
    const newMap = {};
    (newBatches || []).forEach((b) => { newMap[b.key] = b; });

    // 新的 batch
    (newBatches || []).forEach((b) => {
      if (!oldMap[b.key]) {
        result[b.key] = { status: "new" };
      } else {
        const o = oldMap[b.key];
        const changed = o.roomCount !== b.roomCount || o.nights !== b.nights || o.batchTotal !== b.batchTotal;
        if (changed) result[b.key] = { status: "changed", old: o };
      }
    });
    // 刪除的 batch
    (oldBatches || []).forEach((b) => {
      if (!newMap[b.key]) result[b.key] = { status: "deleted", old: b };
    });
    return result;
  };

  // ── handlePrint ───────────────────────────────────────────
  const handlePrint = (selectedHids, showGuests, includeAmount, showSegments) => {
    const printData = selectedHids ? data.filter((hd) => selectedHids.has(String(hd.hid))) : data;
    const _now = new Date();
    const _mm = String(_now.getMonth() + 1).padStart(2, "0");
    const _dd = String(_now.getDate()).padStart(2, "0");
    const _datePrefix = `${_mm}月${_dd}日`;
    const _docTitle = printData.length === 1
      ? `${_datePrefix}_${printData[0].hotel?.name || t.invoiceTitle}`
      : `${_datePrefix}_飯店核對總表`;

    // 讀取快照並建立比對 map
    const _snap = _loadSnapshot();
    const _snapHotelMap = {};
    if (_snap) (_snap.hotels || []).forEach((h) => { _snapHotelMap[h.hid] = h; });
    const _hasSnap = !!_snap;
    const _snapTime = _snap ? (() => {
      const d = new Date(_snap.ts);
      const sm = String(d.getMonth() + 1).padStart(2, "0");
      const sd = String(d.getDate()).padStart(2, "0");
      const sh = String(d.getHours()).padStart(2, "0");
      const smin = String(d.getMinutes()).padStart(2, "0");
      return `${sm}月${sd}日 ${sh}:${smin}`;
    })() : "";

    // 儲存本次快照（列印後即更新基準）
    _saveSnapshot(data);
    const printTotal = printData.reduce((s, h) => s + h.hotelTotal, 0);
    const colCount = includeAmount ? 4 : 3;
    const rows = printData.map((hd, idx) => {
      // 差異比對：取得此飯店的 batch diff map
      const _snapHotel = _snapHotelMap[String(hd.hid)];
      const _diffMap = _hasSnap ? _diffBatches(_snapHotel?.batches, (hd.batches || []).map((b) => ({
        key: `${b.check_in}|${b.check_out}|${b.roomLabel}`,
        check_in: b.check_in, check_out: b.check_out,
        roomLabel: b.roomLabel, roomCount: b.roomCount,
        nights: b.nights, batchTotal: b.batchTotal,
      }))) : {};
      // 此飯店是否為新增（快照中不存在）
      const _hotelIsNew = _hasSnap && !_snapHotel;
      // 整理刪除的 batches（需額外渲染）
      const _deletedBatches = _hasSnap && _snapHotel
        ? (_snapHotel.batches || []).filter((ob) => _diffMap[ob.key]?.status === "deleted")
        : [];

      const batchRows = hd.batches.map((b, i) => {
        const bKey = `${b.check_in}|${b.check_out}|${b.roomLabel}`;
        const _diff = _diffMap[bKey];
