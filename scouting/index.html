<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勘景資料系統</title>
<link rel="stylesheet" href="/scouting/css/style.css?v=20261012c">
</head>
<body class="home-body">

<div id="authView" class="home-auth" hidden>
  <div class="home-card">
    <p class="home-mark">Location</p>
    <h1 data-i18n="appName">勘景資料系統</h1>
    <p class="home-lead" id="authLead" data-i18n="authLead">請使用已核准的帳號登入。</p>

    <div class="home-tabs" id="authTabs">
      <button type="button" class="home-tab active" data-mode="login" data-i18n="loginTab">登入</button>
      <button type="button" class="home-tab" data-mode="register" data-i18n="registerTab">申請帳號</button>
    </div>

    <p id="authError" class="admin-error"></p>

    <form id="loginForm" class="admin-form">
      <label class="field-label" data-accent data-i18n="email">電子郵件</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label class="field-label" data-accent data-i18n="password">密碼</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="loginBtn">登入</button>
      <button type="button" id="btnForgot" class="link-btn home-forgot" data-i18n="forgotPw">忘記密碼</button>
    </form>

    <form id="registerForm" class="admin-form" hidden>
      <label class="field-label" data-accent data-i18n="email">電子郵件</label>
      <input type="email" id="regEmail" autocomplete="username" required>
      <label class="field-label" data-accent data-i18n="password">密碼</label>
      <input type="password" id="regPassword" autocomplete="new-password" required>
      <label class="field-label" data-accent data-i18n="passwordConfirm">確認密碼</label>
      <input type="password" id="regPassword2" autocomplete="new-password" required>
      <label class="field-label" data-accent data-i18n="displayName">姓名（選填）</label>
      <input type="text" id="regName" autocomplete="name">
      <label class="field-label" data-accent data-i18n="applyMessage">申請訊息（選填）</label>
      <textarea id="regMessage" rows="2" data-i18n-placeholder="applyMessagePh" placeholder="所屬・職務等"></textarea>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="applyBtn">申請登入</button>
    </form>

    <form id="forgotForm" class="admin-form" hidden>
      <label class="field-label" data-accent data-i18n="email">電子郵件</label>
      <input type="email" id="forgotEmail" autocomplete="username" required>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="sendReset">寄出重設連結</button>
      <button type="button" id="btnBackLogin" class="link-btn home-forgot" data-i18n="backToLogin">返回登入</button>
    </form>

    <form id="resetForm" class="admin-form" hidden>
      <label class="field-label" data-accent data-i18n="newPassword">新密碼</label>
      <input type="password" id="resetPassword" autocomplete="new-password" required>
      <label class="field-label" data-accent data-i18n="confirmNewPassword">確認新密碼</label>
      <input type="password" id="resetPassword2" autocomplete="new-password" required>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="updatePassword">更新密碼</button>
    </form>

    <div id="verifyBox" hidden>
      <p class="admin-lead" data-i18n="verifyHint">驗證信已發送。管理員核准後即可看到被授權的勘景專案。</p>
      <button type="button" id="btnVerifyLogin" class="btn btn-primary btn-block" data-i18n="backToLogin">返回登入</button>
    </div>

    <select id="authLangSelect" class="home-lang-select lang-select" aria-label="Language"></select>
  </div>
</div>

<div id="listView" class="home-list" hidden>
  <header class="home-header">
    <div>
      <h1 data-i18n="appName">勘景資料系統</h1>
      <p class="home-user" id="userLine"></p>
    </div>
    <div class="home-header-actions">
      <select id="listLangSelect" class="home-lang-select lang-select" aria-label="Language"></select>
      <button type="button" id="btnNewProject" class="btn btn-primary" data-i18n="newProject">新增專案</button>
      <button type="button" id="btnLogout" class="btn btn-ghost" data-i18n="logout">登出</button>
    </div>
  </header>

  <section id="requestSection" class="home-section" hidden>
    <h2 data-i18n="pendingRequests">待審核申請</h2>
    <div id="requestList"></div>
  </section>

  <section class="home-section">
    <h2 data-i18n="projectList">專案列表</h2>
    <p id="listEmpty" class="admin-lead" hidden data-i18n="listEmpty">還沒有可看的勘景專案。建立新劇，或等管理員把你加進去。</p>
    <div id="projectGrid" class="home-grid"></div>
  </section>
</div>

<footer class="site-copy">版權所有 © 2026 井風國際娛樂有限公司 (Maria Entertainment Ltd.) 保留所有權利</footer>

<div id="createModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 data-i18n="createProjectTitle">新增勘景專案</h2>
    <p class="modal-hint" data-i18n="createProjectHint">開好後你會成為管理員，系統擁有者會自動看到這個劇。</p>
    <input type="text" id="newProjectName" data-i18n-placeholder="projectNamePh" placeholder="劇名" autocomplete="off">
    <p id="createError" class="admin-error"></p>
    <div class="modal-actions">
      <button type="button" id="btnCancelCreate" class="btn btn-ghost" data-i18n="cancel">取消</button>
      <button type="button" id="btnConfirmCreate" class="btn btn-primary" data-i18n="create">建立</button>
    </div>
  </div>
</div>

<div id="renameModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 data-i18n="renameProjectTitle">重新命名專案</h2>
    <input type="hidden" id="renameProjectId">
    <input type="text" id="renameProjectName" data-i18n-placeholder="projectNamePh" placeholder="劇名" autocomplete="off">
    <p id="renameError" class="admin-error"></p>
    <div class="modal-actions">
      <button type="button" id="btnCancelRename" class="btn btn-ghost" data-i18n="cancel">取消</button>
      <button type="button" id="btnConfirmRename" class="btn btn-primary" data-i18n="save">儲存</button>
    </div>
  </div>
</div>

<div id="memberModal" class="modal-overlay" hidden>
  <div class="modal modal-wide">
    <h2 id="memberTitle">成員管理</h2>
    <p class="modal-hint" data-i18n="memberHint">對方須先用同一個信箱申請帳號並完成驗證。</p>
    <div class="home-add-member">
      <input type="email" id="memberEmail" placeholder="name@example.com">
      <select id="memberRole">
        <option value="editor" data-i18n="roleEditor">編輯</option>
        <option value="admin" data-i18n="roleAdmin">管理員</option>
        <option value="viewer" data-i18n="roleViewer">唯讀</option>
      </select>
      <button type="button" id="btnAddMember" class="btn btn-primary" data-i18n="addMember">加入</button>
    </div>
    <p id="memberError" class="admin-error"></p>
    <div id="memberList"></div>
    <div class="modal-actions">
      <button type="button" id="btnCloseMembers" class="btn btn-ghost" data-i18n="close">關閉</button>
    </div>
  </div>
</div>

<div id="approveModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 data-i18n="approveTitle">批准申請</h2>
    <p class="modal-hint" id="approveHint"></p>
    <label class="field-label" data-accent data-i18n="assignProject">指定專案</label>
    <select id="approveProject"></select>
    <label class="field-label" data-accent data-i18n="assignRole">權限角色</label>
    <select id="approveRole">
      <option value="editor" data-i18n="roleEditor">編輯</option>
      <option value="admin" data-i18n="roleAdmin">管理員</option>
      <option value="viewer" data-i18n="roleViewer">唯讀</option>
    </select>
    <div class="modal-actions">
      <button type="button" id="btnCancelApprove" class="btn btn-ghost" data-i18n="cancel">取消</button>
      <button type="button" id="btnConfirmApprove" class="btn btn-primary" data-i18n="confirmApprove">確認批准</button>
    </div>
  </div>
</div>

<script src="/scouting/js/i18n.js?v=20261012c"></script>
<script src="/scouting/js/auth.js?v=20261012c"></script>
<script src="/scouting/js/home.js?v=20261012c"></script>
</body>
</html>
